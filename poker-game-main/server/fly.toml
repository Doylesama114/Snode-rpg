# fly.toml — poker-game multiplayer server configuration
app = "poker-server"
primary_region = "hkg"

[build]
  image = "node:20-slim"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
