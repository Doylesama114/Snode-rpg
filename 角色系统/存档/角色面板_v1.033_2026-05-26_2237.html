<title>角色 - 角色面板</title>


<style>*{margin:0;padding:0;box-sizing:border-box}


body{background:#f6f4ef;color:#1f2522;font-family:Microsoft YaHei,Noto Sans SC,system-ui,sans-serif;padding:30px;min-height:100vh;font-size:15px}


.container{max-width:1400px;margin:0 auto}


.section{background:#fffdf8;border-radius:10px;margin-bottom:20px;padding:20px 28px;border:1px solid #d8d2c4;box-shadow:0 8px 24px rgba(31,37,34,0.06)}


.section-title{font-size:26px;color:#1f2522;font-weight:bold;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #d8d2c4}


.section-body{padding:14px 20px}


.info-grid{display:flex;flex-direction:column;gap:12px}


.info-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}


.info-item{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#f6f4ef;border-radius:8px;border:1px solid #d8d2c4}


.info-label{font-size:16px;color:#69706b}


.info-value{font-size:20px;color:#1f2522;font-weight:bold}


.class-row{display:flex;gap:16px;flex-wrap:wrap}


.class-box{flex:1;min-width:200px;background:#f6f4ef;border-radius:10px;padding:14px 20px;border:1px solid #d8d2c4}


.class-name{font-size:28px;color:#1f2522;font-weight:bold}


.class-level{font-size:20px;color:#69706b;margin-top:4px}


.misc-item{margin-bottom:14px}


.m-title{font-size:18px;color:#69706b;font-weight:bold;margin-bottom:6px}


.misc-item div:last-child{font-size:17px;color:#1f2522;line-height:1.8}


.stat-item{background:#f6f4ef;border-radius:8px;padding:12px 16px;border:1px solid #d8d2c4;text-align:center}


.stat-label{display:block;font-size:15px;color:#69706b;margin-bottom:4px}


.stat-value{display:block;font-size:24px;color:#1f2522;font-weight:bold}


.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}


.attr-box{display:flex;background:#f6f4ef;border-radius:10px;border:1px solid #d8d2c4;overflow:hidden;min-height:240px}


.attr-main{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 18px;background:#edeae2;min-width:100px;gap:4px}


.attr-name{font-size:20px;color:#1f2522;font-weight:bold}


.attr-value{font-size:34px;color:#1f2522;font-weight:bold}


.attr-mod{font-size:18px;color:#69706b}


.prof-list{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:10px 14px;flex:1;align-content:start}


.prof-item{display:flex;align-items:center;gap:4px;font-size:14px;color:#1f2522;padding:3px 8px;background:#fffdf8;border-radius:4px;white-space:nowrap;border:1px solid #e8e2d8}


.prof-item span{flex:1}


.prof-minus,.prof-plus{width:22px;height:22px;border:none;border-radius:3px;cursor:pointer;font-size:13px;font-weight:bold;color:#fff;background:#a46d1f}


.prof-minus:hover,.prof-plus:hover{background:#c0852f}


.prof-val{min-width:20px;text-align:center;font-weight:bold;color:#a46d1f;font-size:15px}


.save-toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:#1f2522;padding:3px 8px;background:#fffdf8;border-radius:4px;border:1px solid #e8e2d8}


.save-toggle input{width:18px;height:18px;cursor:pointer;accent-color:#a46d1f}


.feat-list{display:flex;flex-direction:column;gap:6px}


.feat-chip{background:#f6f4ef;border-radius:8px;padding:10px 16px;border:1px solid #d8d2c4;font-size:16px;color:#1f2522}


.feat-lv{display:inline-block;padding:2px 8px;background:#a46d1f;border-radius:4px;font-size:12px;color:#fff;margin-right:8px;font-weight:bold}


.currency-row{display:flex;flex-direction:column;gap:8px}


.currency-item{background:#f6f4ef;border-radius:8px;padding:8px 16px;border:1px solid #d8d2c4;font-size:17px;color:#1f2522;display:flex;gap:12px;align-items:center}


.currency-item span:last-child{font-size:20px}


.weight-block{font-size:17px;color:#69706b;display:flex;flex-direction:column;gap:6px}


.weight-block span{background:#f6f4ef;padding:8px 14px;border-radius:6px;border:1px solid #d8d2c4}


.weight-current{color:#a46d1f;font-weight:bold;font-size:20px}


.talent-grid{display:flex;flex-direction:column;gap:6px}


.talent-header-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:4px}


.equip-selected{outline:3px solid #d9852e!important;outline-offset:2px;background:#ede4d4!important}


.equip-item{cursor:pointer}


.equip-empty{cursor:pointer}


.equip-item:hover{background:#f0ede6}


.equip-empty:hover{background:#e8e2d4}


.talent-header-cell{background:#edeae2;border-radius:4px;padding:6px;font-size:16px;color:#1f2522;font-weight:bold;text-align:center;border:1px solid #d8d2c4}


.talent-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}


.talent-item{background:#f6f4ef;border-radius:4px;padding:6px 4px;border:1px solid #d8d2c4;font-size:13px;color:#1f2522;text-align:center;min-height:36px;display:flex;align-items:center;justify-content:center}


.talent-slot-empty{background:transparent;border-radius:4px;padding:6px 4px;border:1px dashed #d8d2c4;font-size:12px;color:#69706b;font-style:italic;text-align:center;min-height:36px;display:flex;align-items:center;justify-content:center}


.equip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}


.equip-slot{background:#f6f4ef;border-radius:10px;padding:16px 20px;border:1px solid #d8d2c4}


.equip-title{font-size:18px;color:#1f2522;font-weight:bold;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid #d8d2c4}


.equip-items{display:grid;grid-template-columns:1fr 1fr;gap:6px}


.equip-item{font-size:16px;color:#1f2522;padding:8px 12px;margin:3px 0;background:#fffdf8;border-radius:6px;border:1px solid #e8e2d8}


.equip-empty{font-size:15px;color:#69706b;font-style:italic;padding:8px 12px;margin:3px 0;background:transparent;border-radius:6px;border:1px dashed #d8d2c4;text-align:center}


.trait-item{font-size:16px;color:#1f2522;margin-bottom:8px;padding:8px 12px;background:#f6f4ef;border-radius:6px;border-left:3px solid #a46d1f}


.trait-name{font-weight:bold;color:#1f2522;font-size:17px}


.lang-list,.prof-list2{display:flex;flex-wrap:wrap;gap:8px}


.skill-table{width:100%;border-collapse:collapse;font-size:15px}


.skill-table thead th{background:#edeae2;padding:8px 14px;text-align:left;color:#69706b;border-bottom:2px solid #d8d2c4;font-size:15px}


.skill-table tbody td{padding:6px 14px;border-bottom:1px solid #e8e2d8;font-size:15px}


.skill-name{color:#1f2522;font-size:16px;font-weight:bold}


.skill-sub{font-size:13px;color:#69706b}


.empty-slot td{color:#69706b;font-style:italic}


.learn-toggle{position:fixed;bottom:30px;right:30px;padding:14px 28px;font-size:18px;background:#a46d1f;color:#fff;border:none;border-radius:40px;cursor:pointer;z-index:1000;font-family:inherit;box-shadow:0 4px 12px rgba(164,109,31,0.3)}


.learn-toggle:hover{background:#c0852f;transform:scale(1.05)}


.learn-panel{display:none;position:fixed;bottom:100px;right:30px;width:600px;max-height:70vh;overflow-y:auto;background:#fffdf8;border:1px solid #d8d2c4;border-radius:10px;padding:16px;z-index:999;font-size:15px;color:#1f2522;box-shadow:0 8px 30px rgba(31,37,34,0.1)}


.xp-panel{display:flex;align-items:center;justify-content:center;min-height:44px}


.xp-panel span{font-size:24px;color:#1f2522;font-weight:bold}


.sp-panel{display:flex;flex-direction:column;gap:5px}


.sp-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}


.sp-item{display:flex;align-items:center;justify-content:center;gap:5px;padding:3px 6px;background:#f6f4ef;border-radius:4px;border:1px solid #e8e2d8}


.sp-dot{display:inline-block;width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,0.12)}


.sp-dot-premium{background:linear-gradient(135deg,#FFD700,#FF6B6B,#B94BFF,#00B0F0,#00FA99);border-color:rgba(164,109,31,0.3)}


.sp-count{font-size:16px;color:#1f2522;font-weight:bold;min-width:14px;text-align:center}


.trait-section{display:flex;flex-direction:column;gap:6px}


.trait-section .trait-item{margin-bottom:0}


.battle-layout{display:flex;gap:12px;align-items:stretch}


.battle-key{flex:0 0 auto;min-width:100px;display:flex}


.battle-key .stat-item{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px;background:#edeae2;border-radius:8px;border:1px solid #d8d2c4}


.battle-grid{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:8px}


.style-item{background:#edeae2;border-radius:4px;padding:3px 8px;font-size:14px;color:#1f2522;text-align:center;border:1px solid #d8d2c4}


.style-item-empty{background:transparent;border-radius:4px;padding:3px 8px;font-size:12px;color:#69706b;font-style:italic;text-align:center;border:1px dashed #d8d2c4}





.lang-tag{display:inline-block;padding:4px 8px;margin:3px;background:#f6f4ef;border-radius:4px;font-size:16px;color:#1f2522;border:1px solid #d8d2c4}


.prof-tag{display:inline-block;padding:4px 12px;margin:3px;background:#f6f4ef;border-radius:4px;font-size:16px;color:#1f2522;border:1px solid #d8d2c4}


/* 技能学习面板增强样式 */


#learnPanel { display:none; margin-top:12px; }


.learn-toggle { padding:8px 18px;font-size:14px;background:#c9753e;color:#fff;border:none;border-radius:6px;cursor:pointer; }


.learn-toggle:hover { background:#d9854e; }


</style></head>

function calcTotalHP(mc,ml,sc,sl,con,race,bg,fb){

function getSkillColorName(skillData) {

  var hex = skillData.color || "";

function getSkillSPCost(skillName, skillSrc) {


  // Look up the skill color from SKILL_DATA


  for (var cls in SKILL_DATA) {


    var skills = SKILL_DATA[cls];


    for (var si = 0; si < skills.length; si++) {


      if (skills[si].name === skillName) {


        var hex = skills[si].color || "";


        if (!hex || hex === "\u70ab\u5f69") return "";


        // Map hex to name directly (_hex2name has hex as keys, name as values)


        return _hex2name[hex] || "";


      }


    }


  }


  return "";


}


function parseSkillCost(skillData) {


  // Parse skill cost into a flat array of {colorName, colorHex}


  // Supports: single object {color, name}, array [{color, name}, ...]


  var _hex2name_local = {"#EE822F":"\u6a59\u8272","#FFFFFF":"\u767d\u8272","#B94BFF":"\u7d2b\u8272","#FFF32F":"\u9ec4\u8272","#D9D9D9":"\u65e0\u8272","#00B0F0":"\u84dd\u8272","#00FA99":"\u9752\u8272","#595959":"\u9ed1\u8272","#FF0000":"\u7ea2\u8272","#843F0B":"\u68d5\u8272","#FFB7E3":"\u7c89\u8272","#00B050":"\u7eff\u8272","#B3F9FF":"\u6d45\u8272"};


  if (!skillData.cost) return [];


  var raw = skillData.cost;


  var result = [];


  // Normalize to array


  var items = Array.isArray(raw) ? raw : [raw];


  for (var ci = 0; ci < items.length; ci++) {


    var item = items[ci];


    if (!item || !item.color) continue;


    var count = item.count || 1;


    var hex = item.color;


    var name = item.name || _hex2name_local[hex] || "\u65e0\u8272";


    for (var si = 0; si < count; si++) {


      result.push({colorName: name, colorHex: hex});


    }


  }


  return result;


}

  closeReplaceModal();


  state.sp[chosenColor] = (state.sp[chosenColor] || 0) - 1;


  window._spDeductionLog = window._spDeductionLog || [];


  window._spDeductionLog.push(chosenColor);


  var st = window._spStepInfo;


  if (st.remaining.length === 0) {


    window._spDeductionLog = [];


    st.confirmCb();


  } else {


    showSPChoiceModal(st.stepIdx + 1, st.totalSteps, st.remaining, {}, st.confirmCb, st.cancelCb);


  }


};





// Helper: cancel and rollback all SP payments


window._doSPCancel = function() {


  closeReplaceModal();


  var log = window._spDeductionLog || [];


  for (var li = 0; li < log.length; li++) {


    state.sp[log[li]] = (state.sp[log[li]] || 0) + 1;


  }

  if (st && st.cancelCb) st.cancelCb();


  render(); renderLearnPanel();


};

  var idx = -1;


  for (var i = 0; i < tt.length; i++) {


    if (tt[i].n === skillName && tt[i].cls === clsName) { idx = i; break; } }


  if (idx < 0) return;


  if (tt[idx].locked) { alert("\u8be5\u5929\u8d4b\u5df2\u9501\u5b9a\uff0c\u65e0\u6cd5\u53d6\u6d88\u5b66\u4e60"); return; }


  // Return SP


  var clsData = SKILL_DATA[clsName]; 


  if (clsData) {


    var sd = null; for (var si = 0; si < clsData.length; si++) { if (clsData[si].name === skillName) { sd = clsData[si]; break; } }


    if (sd) {


      var costArr = parseSkillCost(sd);


      for (var ci = 0; ci < costArr.length; ci++) {


        state.sp[costArr[ci].colorName] = (state.sp[costArr[ci].colorName] || 0) + 1;


      }


    }


  }


  tt.splice(idx, 1);


  state.talent_tree = tt;


  autoCalcStyles(); autoCalcTalentTree(); render(); renderLearnPanel(); }





function confirmUnlearnTalent(clsName, skillName, clsIdx) {


  var clsData = SKILL_DATA[clsName]; if (!clsData) return;


  var skillData = null; for (var i = 0; i < clsData.length; i++) { if (clsData[i].name === skillName) { skillData = clsData[i]; break; } }


  if (!skillData) return;


  var desc = (skillData.description || [""]).join("<br>");


  showSkillPreview(skillName, skillData.style || clsName, skillData.tier || "", desc, function() {


    unlearnTalent(clsName, skillName, clsIdx); }); }


function batchResetSkills() {


  // Search across ALL SKILL_DATA classes to find skill cost


  function findSkillDataAcrossClasses(skillName) {


    for (var cls in SKILL_DATA) {


      var arr = SKILL_DATA[cls];


      for (var si = 0; si < arr.length; si++) {


        if (arr[si].name === skillName) return arr[si];


      }


    }


    return null;


  }


  // Return SP for all unlocked skills before removing them


  for (var i = 0; i < state.skills.length; i++) {


    if (!state.skills[i].locked) {


      var sd = findSkillDataAcrossClasses(state.skills[i].n);


      if (sd) {


        var costArr = parseSkillCost(sd);


        for (var ci = 0; ci < costArr.length; ci++) {


          state.sp[costArr[ci].colorName] = (state.sp[costArr[ci].colorName] || 0) + 1;


        }


      }


    }


  }


  var kept = [];


  for (var i = 0; i < state.skills.length; i++) { if (state.skills[i].locked) kept.push(state.skills[i]); }


  state.skills = kept;


  state.forbidden_skills = [];


  autoCalcStyles(); autoCalcTalentTree(); render(); renderLearnPanel(); }


function showReplaceModal(newName, clsSkills, skillList, maxSlots) {


  closeReplaceModal();


  var overlay = document.createElement("div");


  overlay.id = "modalOverlay";


  overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center";


  document.body.appendChild(overlay);


  var html = "<div style='background:#2d2722;border:1px solid #5a3a18;border-radius:12px;padding:20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.5)'>";


  html += "<div style='font-size:16px;color:#e8a86a;font-weight:bold;margin-bottom:12px'>\u9009\u62e9\u8981\u66ff\u6362\u7684\u6280\u80fd</div>";


  html += "<div style='font-size:13px;color:#b09070;margin-bottom:10px'>\u6280\u80fd\u5217\u8868\u5df2\u6ee1\uff01\u8bf7\u9009\u62e9\u8981\u66ff\u6362\u7684\u6280\u80fd (" + newName + "):</div>";


  for (var bi = 0; bi < clsSkills.length; bi++) {


    html += "<button onclick='" + (clsSkills[bi].locked ? "" : "doReplace(" + bi + ");") + "' style='display:block;width:100%;padding:8px 12px;margin:4px 0;background:" + (clsSkills[bi].locked ? "#3d3530" : "#3a5030") + ";color:#f0e0d0;border:1px solid #5a3a18;border-radius:6px;cursor:" + (clsSkills[bi].locked ? "not-allowed" : "pointer") + ";text-align:left;font-size:13px'" + (clsSkills[bi].locked ? " disabled" : "") + ">" + (bi+1) + ". " + clsSkills[bi].n + (clsSkills[bi].locked ? " [\u9501\u5b9a]" : "") + "</button>"; }


  html += "<button onclick='closeReplaceModal()' style='width:100%;padding:8px;margin-top:10px;background:#5a3a18;color:#f0e0d0;border:none;border-radius:6px;cursor:pointer;font-size:13px'>\u53d6\u6d88</button></div>";


  overlay.innerHTML = html;


  overlay.style.display = "flex";


  window._replaceData = {clsSkills: clsSkills, skillList: skillList, maxSlots: maxSlots}; }


function closeReplaceModal() {


  var overlay = document.getElementById("modalOverlay");


  if (overlay) { overlay.parentNode.removeChild(overlay); } }


function doReplace(idx) {


  var data = window._replaceData;


  if (!data) return;


  var clsSkills = data.clsSkills; var skillList = data.skillList;


  if (clsSkills[idx].locked) { alert("\u8be5\u6280\u80fd\u5df2\u9501\u5b9a\uff0c\u65e0\u6cd5\u66ff\u6362"); return; }


  var removedId = clsSkills[idx].id;


  state.forbidden_skills = state.forbidden_skills || [];


  state.forbidden_skills.push(removedId);


  for (var si = 0; si < skillList.length; si++) { if (skillList[si].id === removedId) { skillList.splice(si, 1); break; } }


  closeReplaceModal(); }





function showSkillDetail(clsName, skillName) {


  var clsData = SKILL_DATA[clsName]; if (!clsData) return;


  var skillData = null; for (var i = 0; i < clsData.length; i++) { if (clsData[i].name === skillName) { skillData = clsData[i]; break; } }


  if (!skillData) return;


  var desc = (skillData.description || [""]).join("<br>");


  showSkillPreview(skillName, skillData.style || clsName, skillData.tier || "", desc, null); }





function showSkillDetailFromAll(skillName) {


  // Search all SKILL_DATA for a skill by name


  for (var cls in SKILL_DATA) {


    var skills = SKILL_DATA[cls];


    for (var si = 0; si < skills.length; si++) {


      if (skills[si].name === skillName) {


        var sd = skills[si];


        var desc = (sd.description || [""]).join("<br>");


        showSkillPreview(skillName, sd.style || cls, sd.tier || "", desc, null);


        return;


      }


    }


  }


}


function showSkillPreview(name, style, tier, desc, onConfirm) {


  closeReplaceModal();


  var overlay = document.createElement("div");


  overlay.id = "modalOverlay";


  overlay.style.cssText = "position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center";


  document.body.appendChild(overlay);


  var html = "<div style='background:#2d2722;border:1px solid #5a3a18;border-radius:12px;padding:20px;max-width:450px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.5)'>";


  html += "<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:12px'>";


  html += "<div><span style='font-size:18px;color:#e8a86a;font-weight:bold'>" + name + "</span>";


  html += "<span style='font-size:12px;color:#b09070;margin-left:8px'>[" + style + " / " + tier + "]</span></div>";


  html += "<button onclick='closeReplaceModal()' style='background:none;border:none;color:#888;font-size:20px;cursor:pointer'>&times;</button></div>";


  html += "<div style='font-size:13px;color:#ddd;line-height:1.6;padding:10px;background:#1f1a16;border-radius:6px;margin-bottom:14px;max-height:300px;overflow-y:auto'>" + desc + "</div>";


  html += "<div style='display:flex;gap:8px;justify-content:flex-end'>";


  html += "<button onclick='closeReplaceModal()' style='padding:8px 16px;background:#5a3a18;color:#f0e0d0;border:none;border-radius:6px;cursor:pointer'>\u53d6\u6d88</button>";


  if (onConfirm) {


    window._previewCallback = onConfirm;


    html += "<button onclick='closeReplaceModal();window._previewCallback()' style='padding:8px 16px;background:#4a8;color:#fff;border:none;border-radius:6px;cursor:pointer'>\u786e\u8ba4\u53d6\u6d88\u5b66\u4e60</button>";


  }


  html += "</div></div>";


  overlay.innerHTML = html;


  overlay.style.display = "flex"; }


render();</script>
