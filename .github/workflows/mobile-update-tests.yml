name: Mobile update transaction tests
on:
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-update-tests.yml'
jobs:
  native-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test actual native resource transactions
        working-directory: mobile
        run: gradle testDebugUnitTest -PskipBootstrap=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-update-tests
          path: mobile/app/build/reports/tests/
