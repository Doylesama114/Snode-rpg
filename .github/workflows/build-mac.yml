name: Build macOS Installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build (empty uses this workflow ref)'
        required: false
        type: string
  push:
    branches:
      - 'codex/mac-installer-*'
      - 'codex/release-*'
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: mac-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-15
            app-dir: mac-arm64
          - arch: x64
            os: macos-15-intel
            app-dir: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - name: Install dependencies
        working-directory: electron-app
        run: npm ci
      - name: Test Mac integration
        run: node --test scripts/tests/mac-platform.test.cjs scripts/tests/advisor-chargen-snapshot.test.cjs
      - name: Build DMG installer
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          TARGET_ARCH: ${{ matrix.arch }}
          DEBUG: electron-builder
        run: |
          set -o pipefail
          npm run dist:mac -- --arch "$TARGET_ARCH" 2>&1 | tee "$GITHUB_WORKSPACE/mac-build.log"
      - name: Surface build failure
        if: failure()
        run: |
          LOG="$GITHUB_WORKSPACE/mac-build.log"
          if [ ! -f "$LOG" ]; then echo "::error title=DMG build failed::no log file produced"; exit 0; fi
          tail -n 80 "$LOG"
          MSG=$(grep -inE 'error|failed|cannot|ENOENT|hdiutil|not found' "$LOG" | tail -n 12 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-3000)
          echo "::error title=DMG build failed::${MSG}"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log-${{ matrix.arch }}
          path: mac-build.log
          if-no-files-found: ignore
      - name: Verify signature and launch packaged app
        env:
          APP_DIR: ${{ matrix.app-dir }}
        run: |
          APP_PATH="electron-app/dist/mac/$APP_DIR/斯诺德跑团.app"
          echo "app path: $APP_PATH"
          ls -1 electron-app/dist/mac 2>/dev/null || true
          if [ ! -d "$APP_PATH" ]; then
            echo "::error title=APP bundle missing::$APP_PATH not found (see dir listing above)"
            exit 1
          fi
          if ! OUT=$(codesign --verify --deep --strict --verbose=2 "$APP_PATH" 2>&1); then
            echo "$OUT"
            MSG=$(printf '%s' "$OUT" | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-2500)
            echo "::error title=codesign verify failed::${MSG}"
            exit 1
          fi
          echo "$OUT"
          if ! OUT2=$(node scripts/smoke-desktop.mjs "$APP_PATH/Contents/MacOS/斯诺德跑团" 2>&1); then
            echo "$OUT2"
            MSG2=$(printf '%s' "$OUT2" | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g' | cut -c1-2500)
            echo "::error title=smoke launch failed::${MSG2}"
            exit 1
          fi
          echo "$OUT2"
      - uses: actions/upload-artifact@v4
        with:
          name: Snode-RPG-mac-${{ matrix.arch }}
          path: |
            electron-app/dist/mac/*.dmg
            electron-app/dist/mac/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish DMG to GitHub Release
        # tag 推送，或手动补发时把 ref 指向某个 tag（workflow_dispatch 的 github.ref 是分支，
        # 只写 refs/tags/v 会让官方说明里的"手动补发"补不到 DMG）
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN2 }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${INPUT_REF:-$REF_NAME}"
          RELEASE_TAG="${RELEASE_TAG#refs/tags/}"
          echo "target release: $RELEASE_TAG"
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" \
              || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          shopt -s nullglob
          files=(electron-app/dist/mac/*.dmg electron-app/dist/mac/*.zip)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no mac artifacts produced"; exit 1; fi
          for file in "${files[@]}"; do
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY" --clobber; then uploaded=true; break; fi
              sleep "$((attempt * 10))"
            done
            if [ "$uploaded" != true ]; then echo "::error::DMG upload failed: $file"; exit 1; fi
          done

  mac-manifest:
    # 汇总两个架构的 zip/dmg，生成 mac.json（客户端据此判定版本与下载地址，不依赖 api.github.com）
    needs: build-mac
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Snode-RPG-mac-*
          path: dist
          merge-multiple: true
      - name: Build mac.json
        env:
          TARGET_TAG: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          ls -1 dist
          python3 - <<'PY'
          import base64, glob, hashlib, json, os, re
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ.get('TARGET_TAG') or os.environ['GITHUB_REF_NAME']
          tag = tag.replace('refs/tags/', '')
          assets = []
          for f in sorted(glob.glob('dist/*mac-*.zip') + glob.glob('dist/*mac-*.dmg')):
              name = os.path.basename(f)
              m = re.match(r'Snode-RPG-([0-9.]+)-mac-(arm64|x64)\.(zip|dmg)$', name)
              if not m:
                  continue
              h = hashlib.sha512()
              with open(f, 'rb') as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                      h.update(chunk)
              assets.append({
                  'arch': m.group(2),
                  'kind': m.group(3),
                  'name': name,
                  'url': 'https://github.com/%s/releases/download/%s/%s' % (repo, tag, name),
                  'size': os.path.getsize(f),
                  'sha512': base64.b64encode(h.digest()).decode(),
              })
          if not assets:
              raise SystemExit('no mac assets found')
          version = re.match(r'Snode-RPG-([0-9.]+)', assets[0]['name']).group(1)
          json.dump({'version': version, 'assets': assets}, open('mac.json', 'w'), ensure_ascii=False, indent=2)
          print(open('mac.json').read())
          PY
      - name: Publish mac.json to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.ref, 'v') || startsWith(inputs.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN2 }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.ref || github.ref_name }}"
          TAG="${TAG#refs/tags/}"
          gh release upload "$TAG" mac.json --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: mac-manifest
          path: mac.json
          retention-days: 14