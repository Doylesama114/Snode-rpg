name: Deploy Web to Aliyun OSS

on:
  push:
    branches: [master]

jobs:
  deploy-oss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp -r 斯诺德跑团 _deploy/
          cp -r 职业页 _deploy/
          if [ -d electron-app/poker-game ]; then
            cp -r electron-app/poker-game _deploy/poker-game
          fi
          cp bug-report.js _deploy/
          cp index.html _deploy/
          # 注入 Bug 反馈按钮（OSS 子目录部署用相对路径 ../bug-report.js）
          find _deploy -name "*.html" | while read f; do
            sed -i 's|src="/bug-report.js"|src="../bug-report.js"|g; s|src="bug-report.js"|src="../bug-report.js"|g' "$f"
            if ! grep -q "bug-report.js" "$f"; then
              sed -i "s|</body>|<script src=\"../bug-report.js\"></script>\n</body>|" "$f"
            fi
          done
          # 注入移动端 AI 顾问悬浮球入口（OSS 子目录部署用相对路径）
          find _deploy -name "*.html" | while read f; do
            if ! grep -q "advisor-mobile-entry.js" "$f"; then
              case "$f" in
                *斯诺德跑团*) REL="advisor-mobile-entry.js";;
                *职业页*) REL="../斯诺德跑团/advisor-mobile-entry.js";;
                *) REL="斯诺德跑团/advisor-mobile-entry.js";;
              esac
              sed -i "s|</body>|<script src=\"$REL\"></script>\n</body>|" "$f"
            fi
          done
          ADVISOR_API="${{ vars.ADVISOR_API_BASE }}"
          if [ -z "$ADVISOR_API" ] && [ -n "${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}" ]; then
            ADVISOR_API=$(curl -sS --max-time 15 "${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}/advisor-endpoint.txt" 2>/dev/null | tr -d '[:space:]' || true)
          fi
          case "$ADVISOR_API" in
            https://*|http://*) ;;
            *) ADVISOR_API="" ;;
          esac
          if [ -n "$ADVISOR_API" ]; then
            find _deploy -name "顾问.html" -exec sed -i "s|__ADVISOR_API_BASE__|$ADVISOR_API|g" {} +
            # inject SNODE_ADVISOR_API for bug report upload
            find _deploy -name "*.html" | while read f; do
              if ! grep -q "SNODE_ADVISOR_API" "$f"; then
                sed -i "s@</body>@<script>window.SNODE_ADVISOR_API = window.SNODE_ADVISOR_API || \"$ADVISOR_API\";</script>\n</body>@" "$f"
              fi
            done
          fi
          find _deploy -name "*_backup_*" -delete 2>/dev/null || true
          find _deploy -name "*.bat" -delete 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/verify.html 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/tests.html 2>/dev/null || true

      - name: Setup ossutil
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: ${{ vars.ALIYUN_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

      - name: Sync web to Aliyun OSS
        env:
          BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
          PUBLIC_BASE: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}
        run: |
          ossutil sync _deploy/ "oss://${BUCKET}/web/" --update -f --acl public-read --meta Cache-Control:no-cache
          echo "=== OSS web mirror done ==="
          echo "Web entry: ${PUBLIC_BASE}/web/index.html"
