name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp -r 斯诺德跑团 _deploy/
          cp -r 职业页 _deploy/
          cp bug-report.js _deploy/
          # 在所有 HTML 中注入 Bug 反馈按钮脚本
          find _deploy -name "*.html" | while read f; do
            if ! grep -q "bug-report.js" "$f"; then
              sed -i "s|</body>|<script src=\"/bug-report.js\"></script>\n</body>|" "$f"
            fi
          done
          find _deploy -name "*_backup_*" -delete 2>/dev/null || true
          find _deploy -name "*.bat" -delete 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/verify.html 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/tests.html 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy

      - name: Deploy to Gitee Pages
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          cd _deploy
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy to Gitee Pages" || true
          git push -f "https://Doylesama007:${GITEE_TOKEN}@gitee.com/Doylesama007/Snode-rpg.git" master:gitee-pages
