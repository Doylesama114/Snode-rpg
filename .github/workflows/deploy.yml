name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp -r 斯诺德跑团 _deploy/
          cp -r 职业页 _deploy/
          if [ -d electron-app/poker-game ]; then
            cp -r electron-app/poker-game _deploy/poker-game
          fi
          cp bug-report.js _deploy/
          cp index.html _deploy/
          # 在所有 HTML 中注入 Bug 反馈按钮脚本
          find _deploy -name "*.html" | while read f; do
            if ! grep -q "bug-report.js" "$f"; then
              sed -i "s|</body>|<script src=\"/bug-report.js\"></script>\n</body>|" "$f"
            fi
          done
          find _deploy -name "*_backup_*" -delete 2>/dev/null || true
          find _deploy -name "*.bat" -delete 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/verify.html 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/tests.html 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
