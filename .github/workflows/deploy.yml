name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: |
          mkdir -p _deploy
          cp -r 斯诺德跑团 _deploy/
          cp -r 职业页 _deploy/
          cp sentry-loader.js _deploy/ 2>/dev/null || true
          find _deploy -name "*_backup_*" -delete 2>/dev/null || true
          find _deploy -name "*.bat" -delete 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/verify.html 2>/dev/null || true
          rm -rf _deploy/斯诺德跑团/tests.html 2>/dev/null || true

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
