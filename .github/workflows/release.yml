name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'
  # 手动补发：某个 tag 的 Release 资源缺失/上传失败时，可在 Actions 页直接重跑（使用默认分支上最新的
  # 工作流文件，因此能吃到上传重试等修复），无需移动 tag 或改版本号。
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的目标 tag（例如 v1.0.7278）'
        required: true
        type: string

# 同一 tag 只保留一个发布流程，避免重复上传互相覆盖
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pin 2022: windows-latest 镜像变动曾导致 electron-builder/NSIS 偶发失败
    runs-on: windows-2022
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # 解析本次构建的目标 tag：tag 推送用 ref_name；手动补发用 inputs.tag
      - name: Resolve target tag
        id: target
        shell: pwsh
        run: |
          $t = "${{ inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($t)) { $t = "${{ github.ref_name }}" }
          Write-Host "target tag: $t"
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Sync source files
        run: |
          xcopy /E /Y /I "斯诺德跑团" "electron-app\斯诺德跑团\"
          xcopy /E /Y /I "职业页" "electron-app\职业页\"

      - name: Install dependencies
        working-directory: electron-app
        run: npm ci

      - name: Embed DeepSeek config
        shell: cmd
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        working-directory: electron-app
        run: |
          if "%DEEPSEEK_API_KEY%"=="" (
            echo ::error::Missing repository secret DEEPSEEK_API_KEY — add it in GitHub Settings ^> Secrets
            exit /b 1
          )
          (
            echo DEEPSEEK_API_KEY=%DEEPSEEK_API_KEY%
            echo DEEPSEEK_MODEL=deepseek-v4-flash
            echo DEEPSEEK_THINKING=0
          ) > ..\.env
          node embed-env-for-dist.js

      # electron-builder 自带 NSIS 缓存；系统 choco NSIS 易抢 PATH 且安装不稳定，已去掉

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Local/electron/Cache
          key: eb-win-${{ hashFiles('electron-app/package-lock.json') }}
          restore-keys: eb-win-

      - name: Build
        working-directory: electron-app
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            Write-Host "=== electron-builder attempt $i/3 ==="
            node node_modules/electron-builder/out/cli/cli.js --win nsis --x64 --publish never
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Build failed (exit $LASTEXITCODE), waiting before retry..."
            Start-Sleep -Seconds 20
          }
          if (-not $ok) { exit 1 }

      # 先留存构建产物：即使后面的 Release 上传失败，也能从 artifact 直接恢复，无需重新构建
      - name: Upload dist as artifact (for mirror job / recovery)
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: electron-app/dist/*
          retention-days: 1

      # 逐文件重试上传：大文件偶发 "other side closed"（GitHub 侧连接中断）；
      # gh 自带分块上传，--clobber 幂等，重跑不会产生重复资源。
      # 脚本正文保持纯 ASCII，避免 runner 端编码差异影响 PowerShell 解析。
      - name: Upload to GitHub Release (retry per file)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN2 }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "${{ steps.target.outputs.tag }}"
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo --json tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release $tag not found, creating..."
            gh release create $tag --repo $repo --title $tag
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::failed to create release $tag"; exit 1 }
          }
          $files = @(Get-ChildItem -Path electron-app/dist -File |
            Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' })
          if ($files.Count -eq 0) { Write-Host "::error::no dist files to upload"; exit 1 }
          foreach ($f in $files) {
            $ok = $false
            for ($i = 1; $i -le 5; $i++) {
              $mb = [math]::Round($f.Length / 1MB, 1)
              Write-Host "=== upload $($f.Name) attempt $i/5 ($mb MB) ==="
              gh release upload $tag $f.FullName --repo $repo --clobber
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Write-Host "upload interrupted (exit $LASTEXITCODE), retry in $((15 * $i))s"
              Start-Sleep -Seconds (15 * $i)
            }
            if (-not $ok) { Write-Host "::error::upload failed after 5 attempts: $($f.Name)"; exit 1 }
          }
          Write-Host "release $tag assets uploaded"

  mirror-oss:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files

      - name: Setup ossutil
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: ${{ vars.ALIYUN_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

      - name: Sync release assets to Aliyun OSS
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
          PUBLIC_BASE: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          EXE=$(ls -1 *.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::No .exe in dist artifact"
            exit 1
          fi
          # GitHub Variable 须为 https://bucket.oss-...aliyuncs.com（勿省略协议头）
          PUBLIC_BASE="${PUBLIC_BASE%/}"
          case "$PUBLIC_BASE" in
            http://*|https://*) ;;
            *) PUBLIC_BASE="https://${PUBLIC_BASE}" ;;
          esac

          echo "=== OSS Mirror: $TAG ==="
          echo "EXE: $EXE ($(du -h "$EXE" | cut -f1))"
          ls -la

          for f in *.exe *.yml *.blockmap; do
            [ -f "$f" ] || continue
            echo "Uploading releases/${TAG}/${f}..."
            ossutil cp "$f" "oss://${BUCKET}/releases/${TAG}/${f}" --update -f --acl public-read
          done

          if [ -f latest.yml ]; then
            echo "Uploading releases/latest/latest.yml..."
            ossutil cp latest.yml "oss://${BUCKET}/releases/latest/latest.yml" --update -f --acl public-read
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg feedUrl "${PUBLIC_BASE}/releases/${TAG}/" \
            --arg exeUrl "${PUBLIC_BASE}/releases/${TAG}/${EXE}" \
            --arg exeName "$EXE" \
            --arg githubRelease "https://github.com/Doylesama114/Snode-rpg/releases/tag/${TAG}" \
            '{version: $version, tag: $tag, feedUrl: $feedUrl, exeUrl: $exeUrl, exeName: $exeName, mirrors: ["oss", "github"], githubRelease: $githubRelease}' \
            > /tmp/latest.json
          ossutil cp /tmp/latest.json "oss://${BUCKET}/releases/latest/latest.json" --update -f --acl public-read

          echo "=== OSS mirror done ==="
          echo "::notice::OSS feed ${PUBLIC_BASE}/releases/${TAG}/"
          echo "::notice::OSS latest ${PUBLIC_BASE}/releases/latest/latest.json"

  build-android:
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}
      BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
      GH_TOKEN2: ${{ secrets.GH_TOKEN2 }}
      ADVISOR_API_BASE: ${{ vars.ADVISOR_API_BASE }}
    steps:
      # 解析目标 tag（与 build job 同规则：手动补发用 inputs.tag）
      - name: Resolve target tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "VERSION_TAG=$TAG" >> "$GITHUB_ENV"
          echo "target tag: $TAG"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build mobile resource packages
        run: |
          VERSION="${VERSION_TAG#v}"
          ADVISOR_API_BASE="${{ vars.ADVISOR_API_BASE }}"
          if [ -z "$ADVISOR_API_BASE" ]; then
            ADVISOR_API_BASE=$(curl -sS --max-time 15 "${PUBLIC_BASE}/advisor-endpoint.txt" 2>/dev/null | tr -d '[:space:]' || true)
          fi
          case "$ADVISOR_API_BASE" in
            https://*|http://*) ;;
            *) ADVISOR_API_BASE="" ;;
          esac
          export ADVISOR_API_BASE
          node scripts/build-mobile-packages.mjs --base "$PUBLIC_BASE" --version "$VERSION"
          ls -la dist_mobile/

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret MOBILE_KEYSTORE_B64 (run Generate Android Keystore workflow once and store the artifact)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > mobile/keystore-release.jks
          ls -la mobile/keystore-release.jks

      - name: Build APK
        working-directory: mobile
        env:
          KEYSTORE_PASS: ${{ secrets.MOBILE_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MOBILE_KEY_PASS }}
        run: |
          gradle --version | head -5
          echo "ANDROID_HOME=${ANDROID_HOME:-not set}"
          VERSION="${VERSION_TAG#v}"
          if [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing Android signing secrets (MOBILE_KEYSTORE_PASS / MOBILE_KEY_ALIAS / MOBILE_KEY_PASS)"
            exit 1
          fi
          gradle assembleRelease             -PupdateBase="$PUBLIC_BASE"             -PversionName="$VERSION"             -PversionCode="${VERSION##*.}"             -PkeystorePath=keystore-release.jks             -PkeystorePass="$KEYSTORE_PASS"             -PkeyAlias="$KEY_ALIAS"             -PkeyPass="$KEY_PASS"

      - name: Rename APK
        run: |
          VERSION="${VERSION_TAG#v}"
          cp mobile/app/build/outputs/apk/release/app-release.apk "Snode-RPG-${VERSION}.apk"
          sha256sum "Snode-RPG-${VERSION}.apk"

      - name: Setup ossutil
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: ${{ vars.ALIYUN_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

      - name: Upload mobile packages and APK
        run: |
          set -euo pipefail
          VERSION="${VERSION_TAG#v}"
          # OSS 禁止默认域名公开分发 .apk，APK 改走 GitHub Release
          ossutil cp "dist_mobile/core-${VERSION}.zip" "oss://${BUCKET}/mobile/packages/${VERSION}/core-${VERSION}.zip" -f --acl public-read
          ossutil cp "dist_mobile/poker-${VERSION}.zip" "oss://${BUCKET}/mobile/packages/${VERSION}/poker-${VERSION}.zip" -f --acl public-read

          # 获取或创建 GitHub Release（build job 可能仍在构建 exe）
          REL_JSON=$(curl -s -H "Authorization: token $GH_TOKEN2" \
            "https://api.github.com/repos/Doylesama114/Snode-rpg/releases/tags/${VERSION_TAG}")
          RELEASE_ID=$(echo "$REL_JSON" | jq -r '.id // empty')
          if [ -z "$RELEASE_ID" ]; then
            REL_JSON=$(curl -s -X POST -H "Authorization: token $GH_TOKEN2" -H "Accept: application/vnd.github+json" \
              -d "{\"tag_name\":\"${VERSION_TAG}\",\"name\":\"${VERSION_TAG}\",\"draft\":false,\"prerelease\":false}" \
              "https://api.github.com/repos/Doylesama114/Snode-rpg/releases")
            RELEASE_ID=$(echo "$REL_JSON" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ]; then
              REL_JSON=$(curl -s -H "Authorization: token $GH_TOKEN2" \
                "https://api.github.com/repos/Doylesama114/Snode-rpg/releases/tags/${VERSION_TAG}")
              RELEASE_ID=$(echo "$REL_JSON" | jq -r '.id // empty')
            fi
          fi
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::Cannot resolve GitHub release id"
            exit 1
          fi

          APK_NAME="Snode-RPG-${VERSION}.apk"
          ASSET_ID=$(curl -s -H "Authorization: token $GH_TOKEN2" \
            "https://api.github.com/repos/Doylesama114/Snode-rpg/releases/$RELEASE_ID/assets" \
            | jq -r ".[] | select(.name==\"${APK_NAME}\") | .id")
          if [ -n "$ASSET_ID" ]; then
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN2" \
              "https://api.github.com/repos/Doylesama114/Snode-rpg/releases/$RELEASE_ID/assets/$ASSET_ID"
          fi
          curl -s -X POST -H "Authorization: token $GH_TOKEN2" -H "Content-Type: application/octet-stream" \
            --data-binary "@${APK_NAME}" \
            "https://uploads.github.com/repos/Doylesama114/Snode-rpg/releases/$RELEASE_ID/assets?name=${APK_NAME}"

          # version.json 的 APK 指向 GitHub Release（OSS 不托管 apk）
          APK_URL="https://github.com/Doylesama114/Snode-rpg/releases/download/${VERSION_TAG}/${APK_NAME}"
          jq --arg ver "$VERSION" --arg url "$APK_URL" \
            '.apk.version = $ver | .apk.url = $url' dist_mobile/version.json > dist_mobile/version.json.tmp
          mv dist_mobile/version.json.tmp dist_mobile/version.json
          ossutil cp "dist_mobile/version.json" "oss://${BUCKET}/mobile/version.json" -f --acl public-read --meta Cache-Control:no-cache

          echo "::notice::APK ${APK_URL}"
          echo "::notice::version.json ${PUBLIC_BASE}/mobile/version.json"
