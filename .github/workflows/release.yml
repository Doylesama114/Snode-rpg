name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sync source files
        run: |
          xcopy /E /Y /I "斯诺德跑团" "electron-app\斯诺德跑团\"
          xcopy /E /Y /I "职业页" "electron-app\职业页\"

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Embed DeepSeek config
        shell: cmd
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        working-directory: electron-app
        run: |
          if "%DEEPSEEK_API_KEY%"=="" (
            echo ::error::Missing repository secret DEEPSEEK_API_KEY — add it in GitHub Settings ^> Secrets
            exit /b 1
          )
          (
            echo DEEPSEEK_API_KEY=%DEEPSEEK_API_KEY%
            echo DEEPSEEK_MODEL=deepseek-v4-flash
            echo DEEPSEEK_THINKING=0
          ) > ..\.env
          node embed-env-for-dist.js

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build
        working-directory: electron-app
        run: node node_modules/electron-builder/out/cli/cli.js --win nsis --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            electron-app/dist/*.exe
            electron-app/dist/*.yml
            electron-app/dist/*.blockmap
          token: ${{ secrets.GH_TOKEN2 }}

      - name: Upload dist as artifact (for mirror job)
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: electron-app/dist/*
          retention-days: 1

  mirror-oss:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files

      - name: Setup ossutil
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: ${{ vars.ALIYUN_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

      - name: Sync release assets to Aliyun OSS
        env:
          TAG: ${{ github.ref_name }}
          BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
          PUBLIC_BASE: ${{ vars.ALIYUN_OSS_PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          EXE=$(ls -1 *.exe 2>/dev/null | head -1)
          if [ -z "$EXE" ]; then
            echo "::error::No .exe in dist artifact"
            exit 1
          fi

          echo "=== OSS Mirror: $TAG ==="
          echo "EXE: $EXE ($(du -h "$EXE" | cut -f1))"
          ls -la

          for f in *.exe *.yml *.blockmap; do
            [ -f "$f" ] || continue
            echo "Uploading releases/${TAG}/${f}..."
            ossutil cp "$f" "oss://${BUCKET}/releases/${TAG}/${f}" --update -f --acl public-read
          done

          if [ -f latest.yml ]; then
            echo "Uploading releases/latest/latest.yml..."
            ossutil cp latest.yml "oss://${BUCKET}/releases/latest/latest.yml" --update -f --acl public-read
          fi

          cat > /tmp/latest.json <<EOF
{
  "version": "${VERSION}",
  "tag": "${TAG}",
  "feedUrl": "${PUBLIC_BASE}/releases/${TAG}/",
  "exeUrl": "${PUBLIC_BASE}/releases/${TAG}/${EXE}",
  "exeName": "${EXE}",
  "mirrors": ["oss", "github"],
  "githubRelease": "https://github.com/Doylesama114/Snode-rpg/releases/tag/${TAG}"
}
EOF
          ossutil cp /tmp/latest.json "oss://${BUCKET}/releases/latest/latest.json" --update -f --acl public-read

          echo "=== OSS mirror done ==="
          echo "::notice::OSS feed ${PUBLIC_BASE}/releases/${TAG}/"
          echo "::notice::OSS latest ${PUBLIC_BASE}/releases/latest/latest.json"