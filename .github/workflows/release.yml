name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sync source files
        run: |
          xcopy /E /Y /I "斯诺德跑团" "electron-app\斯诺德跑团\"
          xcopy /E /Y /I "职业页" "electron-app\职业页\"

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build
        working-directory: electron-app
        run: node node_modules/electron-builder/out/cli/cli.js --win nsis --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            electron-app/dist/*.exe
            electron-app/dist/*.yml
            electron-app/dist/*.blockmap
          token: ${{ secrets.GH_TOKEN }}

      - name: Upload dist as artifact (for mirror job)
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: electron-app/dist/*
          retention-days: 1

  mirror-gitee:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files

      - name: Mirror to Gitee Release
        run: |
          TAG="${{ github.ref_name }}"
          EXE=$(ls *.exe | head -1)
          TOKEN="${{ secrets.GITEE_TOKEN }}"
          API="https://gitee.com/api/v5/repos/Doylesama007/Snode-rpg/releases"

          echo "=== Gitee Mirror: $TAG ==="
          echo "EXE: $EXE ($(du -h "$EXE" 2>/dev/null | cut -f1 || echo '?'))"
          ls -la *.yml 2>/dev/null

          # 1. 检查是否已有同 tag 的 Release
          echo "Checking existing releases..."
          REL_ID=$(curl -sf "$API?access_token=$TOKEN&per_page=20" | jq -r ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)

          if [ -z "$REL_ID" ] || [ "$REL_ID" = "null" ]; then
            echo "Creating new release..."
            BODY="🔄 自动同步 GitHub Release\n\n📥 GitHub: https://github.com/Doylesama114/Snode-rpg/releases/tag/$TAG\n\n⚡ 国内用户可在GitHub Releases页面直接下载exe"
            REL=$(curl -sf -X POST "$API" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"target_commitish\":\"master\",\"body\":\"$BODY\",\"prerelease\":false,\"access_token\":\"$TOKEN\"}")
            REL_ID=$(echo "$REL" | jq -r '.id')
            echo "Created release: $REL_ID"
          else
            echo "Release already exists: $REL_ID"
          fi

          # 2. 上传所有 yml 文件
          for YML in *.yml; do
            echo "Uploading $YML..."
            if curl -sf --max-time 60 --retry 2 --retry-delay 5 \
                -X POST "$API/$REL_ID/attach_files" \
                -F "access_token=$TOKEN" \
                -F "file=@$YML"; then
              echo "  $YML uploaded OK"
            else
              echo "  WARNING: $YML upload failed"
            fi
          done

          # 3. 上传 exe（跨国网络大概率超时，改为尝试性上传）
          if [ -n "$EXE" ]; then
            echo "Uploading $EXE (large file, may timeout on cross-border network)..."
            if curl -sf --max-time 900 --retry 3 --retry-delay 30 --retry-max-time 1200 \
                -X POST "$API/$REL_ID/attach_files" \
                -F "access_token=$TOKEN" \
                -F "file=@$EXE"; then
              echo "EXE uploaded OK"
            else
              echo "EXE auto-upload failed (cross-border timeout)."
              echo "For manual upload, run: ./upload-gitee-exe.sh $TAG"
            fi
          fi

          echo "=== Gitee mirror done ==="
          echo "::notice::Gitee release: https://gitee.com/Doylesama007/Snode-rpg/releases/tag/$TAG"