name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sync source files
        run: |
          xcopy /E /Y /I "斯诺德跑团" "electron-app\斯诺德跑团\"
          xcopy /E /Y /I "职业页" "electron-app\职业页\"

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build
        working-directory: electron-app
        run: node --require ./spawn_monkey_patch.js node_modules/electron-builder/out/cli/cli.js --win nsis --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            electron-app/dist/*.exe
            electron-app/dist/*.yml
            electron-app/dist/*.blockmap
          token: ${{ secrets.GH_TOKEN }}

      - name: Upload dist as artifact (for mirror job)
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: electron-app/dist/*
          retention-days: 1

  mirror-gitee:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-files

      - name: Mirror to Gitee Release
        run: |
          TAG="${{ github.ref_name }}"
          EXE=$(ls *.exe | head -1)
          YML=$(ls *.yml | head -1)
          BLOCKMAP=$(ls *.blockmap 2>/dev/null | head -1 || echo "")

          # 创建发行版（先放 GitHub 下载链接）
          BODY=$(jq -n --arg tag "$TAG" '{
            tag_name: $tag, name: $tag, target_commitish: "master",
            body: "🔄 自动同步 GitHub Release\n\n📥 下载: https://github.com/Doylesama114/Snode-rpg/releases/download/\($tag)/\($tag)",
            prerelease: false
          }')
          REL=$(curl -s -X POST "https://gitee.com/api/v5/repos/Doylesama007/Snode-rpg/releases" \
            -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" \
            -H "Content-Type: application/json" -d "$BODY")
          REL_ID=$(echo "$REL" | jq -r '.id')

          # 上传 exe
          curl -s -X POST "https://gitee.com/api/v5/repos/Doylesama007/Snode-rpg/releases/$REL_ID/attach_files" \
            -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" \
            -F "file=@$EXE"

          # 上传 latest.yml
          if [ -n "$YML" ]; then
            curl -s -X POST "https://gitee.com/api/v5/repos/Doylesama007/Snode-rpg/releases/$REL_ID/attach_files" \
              -H "Authorization: token ${{ secrets.GITEE_TOKEN }}" \
              -F "file=@$YML"
          fi

          echo "Gitee release created: $REL_ID"