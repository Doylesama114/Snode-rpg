name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Sync source files
        run: |
          xcopy /E /Y /I "斯诺德跑团" "electron-app\斯诺德跑团\"
          xcopy /E /Y /I "职业页" "electron-app\职业页\"

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Build
        working-directory: electron-app
        run: npx electron-builder --win nsis --publish never

      - name: List dist files
        working-directory: electron-app
        run: dir dist

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            electron-app/dist/*.exe
            electron-app/dist/*.yml
            electron-app/dist/*.blockmap
          token: ${{ secrets.GH_TOKEN }}

      - name: Mirror to Gitee Release
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $TAG = "${{ github.ref_name }}"
          $EXE = Get-ChildItem electron-app/dist/*.exe | Select-Object -First 1
          $BODY = @{ tag_name=$TAG; name=$TAG; body="自动同步自 GitHub Release"; prerelease=$false } | ConvertTo-Json
          $REL = Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/Doylesama007/Snode-rpg/releases" -Method Post -Headers @{Authorization="token $env:GITEE_TOKEN"} -ContentType "application/json" -Body $BODY
          Invoke-RestMethod -Uri "https://gitee.com/api/v5/repos/Doylesama007/Snode-rpg/releases/$($REL.id)/attach_files" -Method Post -Headers @{Authorization="token $env:GITEE_TOKEN"} -Form @{file=Get-Item $EXE.FullName}
