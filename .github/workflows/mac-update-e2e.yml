name: macOS Update E2E

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/mac-update-*'
      - 'codex/mac-installer-*'

permissions:
  contents: read

jobs:
  mac-update-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests (mac-updater)
        run: node --test scripts/tests/mac-updater.test.cjs
      - name: Update install e2e (real macOS)
        run: node scripts/mac-update-e2e.mjs
      - name: Steps passed
        run: echo "${{ matrix.os }} 更新安装链路通过"
