name: Deploy AI Advisor to Aliyun FC

on:
  push:
    branches: [master]
    paths:
      - 'advisor-server/**'
      - 'scripts/mage-advisor.mjs'
      - 'scripts/advisor-*.mjs'
      - 'advisor/**'
      - '.github/workflows/deploy-fc.yml'
  workflow_dispatch:

jobs:
  deploy-fc:
    runs-on: ubuntu-latest
    env:
      ALIYUN_FC_REGION: ${{ vars.ALIYUN_FC_REGION || secrets.ALIYUN_FC_REGION || 'cn-chengdu' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build FC package
        run: node advisor-server/build-fc-package.mjs

      - name: Install Serverless Devs
        run: npm install -g @serverless-devs/s

      - name: Configure credentials
        run: s config add --AccountID ${{ secrets.ALIYUN_FC_ACCOUNT_ID }} --AccessKeyID ${{ secrets.ALIYUN_FC_ACCESS_KEY_ID }} --AccessKeySecret ${{ secrets.ALIYUN_FC_ACCESS_KEY_SECRET }} -a default -f

      - name: Deploy to FC
        working-directory: advisor-server
        run: s deploy -y -a default

      - name: Print function URL
        working-directory: advisor-server
        run: |
          s info -a default 2>&1 | tee /tmp/sinfo.txt
          echo "::notice::上面的 URL 即 AI 顾问接口地址（形如 https://snode-advisor-xxxx.cn-chengdu.fcapp.run）"

      - name: Setup ossutil for endpoint publish
        uses: yizhoumo/setup-ossutil@v2
        with:
          endpoint: ${{ vars.ALIYUN_OSS_ENDPOINT }}
          access-key-id: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}

      - name: Publish endpoint to OSS
        env:
          BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]*fcapp\.run[^ ]*' /tmp/sinfo.txt | head -1 || true)
          if [ -z "$URL" ]; then
            echo "::warning::未能从 s info 输出解析 fcapp.run 地址，请到 FC 控制台查看触发器地址"
            exit 0
          fi
          printf '%s' "$URL" > /tmp/advisor-endpoint.txt
          ossutil cp /tmp/advisor-endpoint.txt "oss://${BUCKET}/advisor-endpoint.txt" -f --acl public-read
          echo "::notice::ADVISOR_API_BASE=$URL"

