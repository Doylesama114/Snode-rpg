name: Pull Feedback & Bug Reports

on:
  schedule:
    # 每天北京时间 08:00（GitHub cron 为 UTC）
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_READ_ACCESS_KEY_ID }}
  ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_READ_ACCESS_KEY_SECRET }}
  ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
  ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT }}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache feedback inbox
        uses: actions/cache@v4
        with:
          path: |
            advisor/feedback/inbox
            advisor/bug/inbox
          key: feedback-inbox-${{ github.run_id }}
          restore-keys: |
            feedback-inbox-

      - name: Pull AI feedback
        run: node scripts/advisor-feedback-pull.mjs

      - name: Pull bug feedback
        run: node scripts/advisor-bug-pull.mjs

      - name: Commit reports if changed
        run: |
          git config user.name "snode-bot"
          git config user.email "snode-bot@users.noreply.github.com"
          # 注意：reports 目录首次生成时是未跟踪文件，git diff 检测不到，必须用 status --porcelain
          if [ -n "$(git status --porcelain -- advisor/feedback/reports advisor/bug/reports)" ]; then
            git add advisor/feedback/reports advisor/bug/reports
            git commit -m "chore: 更新 AI/Bug 反馈汇总报告"
            git push
          else
            echo "无新反馈，跳过提交"
          fi

      - name: Show reports
        run: |
          echo '--- AI 反馈汇总 ---'
          cat advisor/feedback/reports/feedback-report.md 2>/dev/null || echo '(暂无 AI 反馈报告)'
          echo '--- Bug 反馈汇总 ---'
          cat advisor/bug/reports/bug-report.md 2>/dev/null || echo '(暂无 Bug 反馈报告)'
