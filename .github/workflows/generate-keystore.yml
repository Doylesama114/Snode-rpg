name: Generate Android Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        id: gen
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v             -keystore mobile-release.jks             -alias snode             -keyalg RSA -keysize 2048 -validity 10950             -storepass "$PASS" -keypass "$PASS"             -dname "CN=Snode RPG, OU=Mobile, O=Snowd, L=Beijing, ST=Beijing, C=CN"
          base64 -w0 mobile-release.jks > mobile-release.jks.b64
          sha256sum mobile-release.jks > keystore.sha256
          {
            echo "===== Android Keystore Info (keep private) ====="
            echo "alias: snode"
            echo "storepass: $PASS"
            echo "keypass: $PASS"
            echo "sha256: $(cut -d' ' -f1 keystore.sha256)"
            echo "================================================="
          } > keystore-info.txt
          echo "::notice::keystore sha256: $(cut -d' ' -f1 keystore.sha256)"

      - name: Upload keystore artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            mobile-release.jks.b64
            keystore-info.txt
          retention-days: 90
