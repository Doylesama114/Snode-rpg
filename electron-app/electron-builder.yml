appId: com.snowd.skilltree
productName: "斯诺德跑团"
directories:
  output: dist
files:
  - main.js
  - preload.js
  - update-mirror-config.js
  - advisor-env-bootstrap.js
  - package.json
  - spawn_monkey_patch.js
  - sync-check.js
  - 职业页/**/*
  - 斯诺德跑团/**/*
  - poker-game/**/*
extraFiles:
  - from: ../scripts
    to: scripts
    filter:
      - "**/*.mjs"
  - from: ../advisor
    to: advisor
  - from: ../.env.example
    to: .env.example
  - from: .env.bundle
    to: .env
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  forceCodeSigning: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: false
  artifactName: "Snode-RPG-Setup-${version}.${ext}"
  include: installer.nsh
npmRebuild: false
nodeGypRebuild: false
publish:
  provider: github
  owner: Doylesama114
  repo: Snode-rpg
