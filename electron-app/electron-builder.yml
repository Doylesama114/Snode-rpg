appId: com.snowd.skilltree
productName: "斯诺德跑团"
directories:
  output: dist
files:
  - main.js
  - preload.js
  - desktop-diagnostics.js
  - window-lifecycle.js
  - recovery-store.js
  - desktop-settings.js
  - desktop-error.html
  - desktop-error.js
  - update-mirror-config.js
  - mac-platform.js
  - advisor-env-bootstrap.js
  - chargen-cli-server.js
  - package.json
  - spawn_monkey_patch.js
  - sync-check.js
  - portable-updater.js
  - 职业页/**/*
  - "!职业页/_monk_test_top.html"      # 一次性测试页，不能进安装包
  - 斯诺德跑团/**/*
  - "!斯诺德跑团/tests.html"          # 回归断言页，不进安装包（同 _monk_test_top.html）
  - poker-game/**/*
extraFiles:
  - from: ../snode.cmd
    to: snode.cmd
  - from: ../docs/chargen-cli.md
    to: CLI.md
  - from: ../scripts
    to: scripts
    filter:
      - "**/*.mjs"
      - "**/*.ps1"
  - from: ../advisor
    to: advisor
  - from: ../.env.example
    to: .env.example
  - from: .env.bundle
    to: .env
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # zip 是便携版自更新用的产物（应用自己下载解压，不经过安装器）
  artifactName: "Snode-RPG-${version}-win-${arch}.zip"
  signAndEditExecutable: false
  forceCodeSigning: false
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  artifactName: "Snode-RPG-Setup-${version}.${ext}"
  include: installer.nsh
npmRebuild: false
nodeGypRebuild: false
publish:
  provider: github
  owner: Doylesama114
  repo: Snode-rpg
