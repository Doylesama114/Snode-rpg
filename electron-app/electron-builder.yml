appId: com.snowd.skilltree
productName: "斯诺德跑团"
directories:
  output: dist
files:
  - main.js
  - preload.js
  - package.json
  - spawn_monkey_patch.js
  - sync-check.js
  - 职业页/**/*
  - 斯诺德跑团/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "斯诺德跑团-Setup-${version}.exe"
npmRebuild: false
nodeGypRebuild: false
