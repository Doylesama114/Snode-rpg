appId: com.snowd.skilltree
productName: "斯诺德跑团"
directories:
  output: dist
files:
  - main.js
  - preload.js
  - package.json
  - spawn_monkey_patch.js
  - sync-check.js
  - 职业页/**/*
  - 斯诺德跑团/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  forceCodeSigning: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: false
  artifactName: "Snode-RPG-Setup-${version}.${ext}"
  include: installer.nsh
npmRebuild: false
nodeGypRebuild: false
publish:
  provider: github
  owner: Doylesama114
  repo: Snode-rpg
  token: ${GH_TOKEN}
