<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>创建新角色</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  background: #f6f4ef;
  color: #1f2522;
  min-height: 100vh;
  padding: 30px;
  font-size: 15px;
}
.container { max-width: 800px; margin: 0 auto; animation: fadeInUp 0.45s ease-out both; }
h1 { font-size: 26px; font-weight: bold; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 2px solid #d8d2c4; }
.step-indicator { display: flex; gap: 6px; margin-bottom: 24px; }
.step-dot { flex: 1; height: 6px; border-radius: 3px; background: #d8d2c4; transition: background 0.3s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
.step-dot.active { background: #a46d1f; transform: scale(1.3); }
.step-dot.done { background: #6b8f5e; }
.step { display: none; }
.step.active { display: block; }
.step-title { font-size: 22px; font-weight: bold; margin-bottom: 16px; }
.step-desc { font-size: 14px; color: #69706b; margin-bottom: 20px; line-height: 1.7; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-bottom: 20px; }
.card {
  background: #fffdf8; border: 2px solid #d8d2c4; border-radius: 10px; padding: 16px;
  cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(31,37,34,0.04);
  display: flex; flex-direction: column; gap: 6px;
}
.card:hover { border-color: #a46d1f; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(31,37,34,0.08); }
.card.selected { border-color: #a46d1f; background: #f6f4ef; box-shadow: 0 0 0 2px #a46d1f; }
.card-name { font-size: 17px; font-weight: bold; color: #1f2522; }
.card-sub { font-size: 12px; color: #69706b; }
.card-desc { font-size: 13px; line-height: 1.5; margin-top: 4px; display: none; color: #1f2522; }
.card.selected .card-desc { display: block; }
.detail-panel {
  background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 10px; padding: 20px 24px;
  margin-bottom: 20px; display: none;
}
.detail-panel.show { display: block; }
.detail-panel h3 { font-size: 18px; margin-bottom: 10px; color: #1f2522; }
.detail-panel .field { font-size: 14px; color: #69706b; margin-bottom: 6px; }
.detail-panel .field span { color: #1f2522; font-weight: bold; }
.attr-buy { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.attr-row {
  display: flex; align-items: center; gap: 8px; padding: 10px 14px;
  background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 8px;
}
.attr-label { font-size: 15px; font-weight: bold; color: #1f2522; min-width: 44px; }
.attr-btn {
  width: 28px; height: 28px; border: 1px solid #a46d1f; border-radius: 6px;
  background: #fffdf8; cursor: pointer; font-size: 16px; font-weight: bold;
  color: #a46d1f; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.attr-btn:hover { background: #a46d1f; color: #fff; }
.attr-btn:disabled { opacity: 0.3; cursor: not-allowed; background: #f6f4ef; color: #ccc; border-color: #ccc; }
.attr-val { font-size: 20px; font-weight: bold; color: #1f2522; min-width: 28px; text-align: center; }
.attr-mod { font-size: 14px; color: #69706b; min-width: 32px; text-align: center; }
.attr-cost { font-size: 12px; color: #a46d1f; min-width: 20px; text-align: center; }
.point-pool {
  text-align: center; padding: 12px; background: #fffdf8; border: 1px solid #d8d2c4;
  border-radius: 8px; margin-bottom: 16px; font-size: 16px;
}
.point-pool span { font-weight: bold; font-size: 24px; color: #a46d1f; }
.skill-select { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.skill-chip {
  padding: 8px 14px; background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 8px;
  cursor: pointer; transition: all 0.2s; font-size: 14px;
}
.skill-chip:hover { border-color: #a46d1f; }
.skill-chip.selected { background: #a46d1f; color: #fff; border-color: #a46d1f; }
.skill-chip:disabled { opacity: 0.4; cursor: not-allowed; }
.spec-btn {
  padding: 8px 14px; background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 8px;
  cursor: pointer; transition: all 0.2s; font-size: 14px;
}
.spec-btn:hover { border-color: #a46d1f; }
.spec-btn.selected { background: #a46d1f; color: #fff; border-color: #a46d1f; }
.nav-buttons { display: flex; gap: 12px; justify-content: space-between; margin-top: 24px; padding-top: 16px; border-top: 1px solid #d8d2c4; }
.btn {
  padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.btn-primary { background: #a46d1f; color: #fff; }
.btn-primary:hover { background: #c0852f; }
.btn-secondary { background: #edeae2; color: #1f2522; }
.btn-secondary:hover { background: #d8d2c4; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.form-textarea { width: 100%; min-height: 70px; padding: 10px 12px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fffdf8; resize: vertical; }
.form-textarea:focus { outline: none; border-color: #a46d1f; box-shadow: 0 0 0 2px rgba(164,109,31,0.15); }
.form-group-full { grid-column: 1 / -1; }
.form-group-half { grid-column: span 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 13px; font-weight: bold; color: #1f2522; }
.form-input { width: 100%; padding: 8px 10px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fffdf8; }
.form-input:focus { outline: none; border-color: #a46d1f; box-shadow: 0 0 0 2px rgba(164,109,31,0.15); }
.form-textarea { width: 100%; min-height: 70px; padding: 10px 12px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fffdf8; resize: vertical; }
.form-textarea:focus { outline: none; border-color: #a46d1f; box-shadow: 0 0 0 2px rgba(164,109,31,0.15); }
.form-group-full { grid-column: 1 / -1; }
.form-group-half { grid-column: span 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 13px; font-weight: bold; color: #1f2522; }
.form-input { width: 100%; padding: 8px 10px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 14px; font-family: inherit; background: #fffdf8; }
.form-input:focus { outline: none; border-color: #a46d1f; box-shadow: 0 0 0 2px rgba(164,109,31,0.15); }
.review-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
.review-item { background: #fffdf8; border: 1px solid #d8d2c4; border-radius: 8px; padding: 14px 18px; }
.review-label { font-size: 12px; color: #69706b; margin-bottom: 4px; }
.review-value { font-size: 16px; font-weight: bold; color: #1f2522; }
.review-attrs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.review-attr { text-align: center; padding: 4px; background: #f6f4ef; border-radius: 4px; font-size: 13px; }
.review-attr .val { font-weight: bold; font-size: 16px; display: block; }
.form-input {
  width: 100%; padding: 10px 14px; border: 1px solid #d8d2c4; border-radius: 8px;
  font-size: 15px; font-family: inherit; background: #fffdf8; color: #1f2522; outline: none;
}
.form-input:focus { border-color: #a46d1f; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
.form-group { margin-bottom: 10px; }
.form-group label { display: block; font-size: 13px; color: #69706b; margin-bottom: 4px; font-weight: bold; }
.search-bar { margin-bottom: 16px; }
.search-bar input { width: 100%; padding: 10px 14px; border: 1px solid #d8d2c4; border-radius: 8px; font-size: 15px; font-family: inherit; background: #fffdf8; outline: none; }
.search-bar input:focus { border-color: #a46d1f; }
.empty-msg { text-align: center; padding: 40px; color: #69706b; font-size: 14px; }
.back-link {
  display: inline-block; color: #69706b; font-size: 14px; text-decoration: none;
  margin-bottom: 16px; cursor: pointer;
}
.back-link:hover { color: #a46d1f; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 11px; padding: 2px 8px; background: #f6f4ef; border-radius: 4px; color: #69706b; border: 1px solid #e8e2d8; }
.trait-list { margin-top: 8px; }
.trait-item { font-size: 13px; padding: 6px 10px; background: #f6f4ef; border-radius: 6px; margin-bottom: 4px; border-left: 3px solid #a46d1f; }
.trait-name { font-weight: bold; color: #1f2522; }
.trait-desc { color: #69706b; }
.race-attr-display { font-size: 13px; color: #69706b; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.race-attr-display .ab { background: #f6f4ef; padding: 2px 8px; border-radius: 4px; }
@media (max-width: 860px) {
  .container { max-width: 100%; }
  body { padding: 20px; }
  h1 { font-size: 22px; }
  .step-title { font-size: 20px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .detail-panel { padding: 14px 18px; }
}
@media (max-width: 600px) {
  .container { padding: 0; }
  body { padding: 16px; }
  .btn { width: 100%; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .attr-buy { grid-template-columns: 1fr; }
  .review-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  body { padding: 12px; }
  h1 { font-size: 20px; }
  .card-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { padding: 12px; gap: 4px; }
  .card-name { font-size: 15px; }
  .card-sub { font-size: 11px; }
  .attr-row { padding: 8px 10px; }
  .attr-label { font-size: 13px; }
  .attr-btn { width: 24px; height: 24px; font-size: 14px; }
  .attr-val { font-size: 17px; }
  .nav-buttons { flex-direction: column; gap: 8px; }
  .btn { font-size: 14px; padding: 10px 20px; }
  .popup .skill-chip { font-size: 12px; padding: 6px 10px; }
}

function initWizard() {
  var h="";
  for(var i=0;i<TOTAL_STEPS;i++) h+="<div class='step-dot' data-step='"+i+"'></div>";
  document.getElementById("stepIndicator").innerHTML=h;

var STEP_LABELS=["选择职业","选择起始特性","选择种族","分配属性","选择熟练项","选择个性背景","选择装备","确认角色"];

var _chargenNotifyTimer=null;
function notifyChargenChange(){
  if(_chargenNotifyTimer)clearTimeout(_chargenNotifyTimer);
  _chargenNotifyTimer=setTimeout(function(){
    _chargenNotifyTimer=null;
    try{
      if(window.snowdChargen){
        window.dispatchEvent(new CustomEvent("snowd-chargen-change",{detail:snowdChargen.getState()}));
      }
    }catch(e){}
  },600);
}
function chargenSnapshotChar(){
  return{
    className:CHAR.className||null,
    raceName:CHAR.raceName||null,
    attrs:CHAR.attrs?JSON.parse(JSON.stringify(CHAR.attrs)):{},
    selectedSkills:(CHAR.selectedSkills||[]).slice(),
    selectedFeatures:(CHAR.selectedFeatures||[]).map(function(f){return f.n||f;}),
    specChoices:CHAR.specChoices?JSON.parse(JSON.stringify(CHAR.specChoices)):{},
    bgName:CHAR.bgName||null,
    bgProfs:CHAR.bgProfs?JSON.parse(JSON.stringify(CHAR.bgProfs)):{},
    equipChoice:CHAR.equipChoice?{letter:CHAR.equipChoice.letter}:null,
    extraLanguages:(CHAR.extraLanguages||[]).slice(),
    charName:CHAR.charName||""
  };
}
function buildChargenFingerprint(st){
  var c=st.char||st;
  return[
    st.step,c.className,c.raceName,c.bgName,
    (c.selectedFeatures||[]).join(","),
    (c.selectedSkills||[]).join(","),
    JSON.stringify(c.attrs||{}),
    JSON.stringify(c.specChoices||{}),
    JSON.stringify(c.bgProfs||{}),
    c.equipChoice&&c.equipChoice.letter
  ].join("|");
}
window.snowdChargen={
  isChargenPage:function(){return true;},
  getState:function(){
    var st={
      source:"chargen_page",
      step:CURRENT_STEP,
      stepLabel:STEP_LABELS[CURRENT_STEP]||"",
      char:chargenSnapshotChar()
    };
    st.fingerprint=buildChargenFingerprint(st);
    return st;
  }
};

function applyAdvisorHandoff(){
  try{
    var raw=localStorage.getItem("advisor_chargen_handoff");
    if(!raw)return;
    var h=JSON.parse(raw);
    if(!h||h.source!=="advisor-wizard")return;
    localStorage.removeItem("advisor_chargen_handoff");
    var sel=h.selections||{};
    for(var ci=0;ci<CLASSES.length;ci++){
      if(CLASSES[ci].name==="法师"||CLASSES[ci].n==="法师"){CHAR.classIdx=ci;CHAR.className="法师";CHAR.classData=CLASSES[ci];break;}
    }
    if(sel.specialization)CHAR.keyAttr="智力";
    if(sel.startingFeatures)CHAR.selectedFeatures=sel.startingFeatures.slice();
    if(sel.race){
      for(var ri=0;ri<RACES.length;ri++){if(RACES[ri].name===sel.race){CHAR.raceIdx=ri;CHAR.raceName=sel.race;CHAR.raceData=RACES[ri];break;}}
    }
    if(sel.attrs){for(var ai=0;ai<ATTR_NAMES.length;ai++){var an=ATTR_NAMES[ai];if(sel.attrs[an]!=null)CHAR.attrs[an]=sel.attrs[an];}}
    if(sel.skills)CHAR.selectedSkills=sel.skills.slice();
    if(sel.background){
      for(var bi=0;bi<BACKGROUNDS.length;bi++){if(BACKGROUNDS[bi].name===sel.background){CHAR.bgIdx=bi;CHAR.bgName=sel.background;CHAR.bgData=BACKGROUNDS[bi];break;}}
    }
    if(h.specChoices)CHAR.specChoices=h.specChoices;
    if(h.extraLanguages)CHAR.extraLanguages=h.extraLanguages.slice();
    if(sel.equipmentKit){
      var opts=EQUIP_DATA["法师"]||[];
      for(var ei=0;ei<opts.length;ei++){if(opts[ei].letter===sel.equipmentKit){CHAR.equipIdx=ei;CHAR.equipChoice=opts[ei];break;}}
    }
    if(h.charName){CHAR.charName=h.charName;CHAR.playerName=CHAR.playerName||"玩家";}
    goToStep(typeof h.targetStep==="number"?h.targetStep:0);
  }catch(e){console.warn("advisor handoff",e);}
}

initWizard();
applyAdvisorHandoff();

function updateOverview() {
  var h = '';
  // 职业
  if (CHAR.className) {
    h += '<div class="ov-section"><div class="ov-label">🗡 职业</div>';
    h += '<div class="ov-item">' + CHAR.className + '</div>';
    if (CHAR.keyAttr) h += '<div class="ov-item">关键属性: ' + CHAR.keyAttr + '</div>';
    if (CHAR.selectedFeatures && CHAR.selectedFeatures.length) {
      h += '<div class="ov-item">起始特性: ' + CHAR.selectedFeatures.map(function(f){return f.n||f;}).join('、') + '</div>';
    }
    h += '</div>';
  }
  // 种族
  if (CHAR.raceName) {
    h += '<div class="ov-section"><div class="ov-label">🧬 种族</div>';
    h += '<div class="ov-item">' + CHAR.raceName + '</div>';
    if(CHAR.raceSize) h += '<div class="ov-item">体型: ' + CHAR.raceSize + '</div>';
    var rd = CHAR.raceData;
    if (rd && rd['属性加成']) {
      var bs = []; for (var an in rd['属性加成']) { var v = rd['属性加成'][an]; if (v && v !== 0 && v !== 'X') bs.push(an + (v > 0 ? '+' : '') + v); }
      if (bs.length) h += '<div class="ov-item">' + bs.join(' ') + '</div>';
    }
    if (rd && rd['特性']) {
      for (var ti = 0; ti < rd['特性'].length; ti++) h += '<div class="ov-item">·' + rd['特性'][ti].name + '</div>';
    }
    if (CHAR.humanFreeSkill) h += '<div class="ov-item">自由熟练: ' + CHAR.humanFreeSkill + '</div>';
    h += '</div>';
  }
  // 属性 (含种族加成)
  if (CHAR.className) {
    var attrs = ['力量','敏捷','体质','智力','感知','魅力','意志','幸运'];
    var rd = CHAR.raceData;
    h += '<div class="ov-section"><div class="ov-label">📊 属性</div>';
    h += '<div class="ov-attrs">';
    for (var ai = 0; ai < attrs.length; ai++) {
      var an = attrs[ai];
      var base = CHAR.attrs[an] || 8;
      var bonus = 0;
      if (rd && rd['属性加成'] && rd['属性加成'][an]) {
        var bv = rd['属性加成'][an];
        if (bv === 'X') { bonus = CHAR.raceExtra && CHAR.raceExtra.indexOf(an) >= 0 ? 1 : 0; }
        else if (typeof bv === 'number') bonus = bv;
      }
      var final = base + bonus;
      h += '<span>' + an.substring(0,1) + ':' + final + '</span>';
    }
    h += '</div></div>';
  }
  // HP/FP
  if (CHAR.className && CHAR.classData) {
    var cl = CHAR.classData;
    var con = CHAR.attrs['体质'] || 8;
    var rd2 = CHAR.raceData;
    var raceHp = (rd2 && rd2['生命值加成']) ? (typeof rd2['生命值加成']==='string' ? 
      (function(rh){var hpParts=rh.split("/");if(hpParts.length===2){var hp0=parseInt(hpParts[0])||0;var hp1=parseInt(hpParts[1])||0;return (CHAR.raceSize&&CHAR.raceSize.indexOf("小")<0)?hp1:hp0;}else{var m=rh.match(/(\d+)/);return m?parseInt(m[1]):0;}})(rd2['生命值加成']) : rd2['生命值加成']) : 0;
    var bgHp = (CHAR.bgData && CHAR.bgData['生命值加成']) ? parseInt(CHAR.bgData['生命值加成']) || 0 : 0;
    // Fallback lookup for classes_data.js missing key_attr/hp/fp_formula
    var CLS_OVERRIDE = {
      '蛮斗士':{key_attr:'力量', hp:12, fp:8, saves:'力量、体质'},
      '战士':{key_attr:'力量或敏捷', hp:10, fp:8, saves:'力量、敏捷'},
      '法师':{key_attr:'智力', hp:8, fp:12, saves:'智力、感知'},
      '德鲁伊':{key_attr:'感知', hp:8, fp:8, saves:'智力、感知'},
      '游荡者':{key_attr:'敏捷', hp:8, fp:8, saves:'敏捷、感知'},
      '吟游诗人':{key_attr:'魅力', hp:8, fp:8, saves:'敏捷、魅力'},
      '猎人':{key_attr:'敏捷', hp:8, fp:8, saves:'力量、敏捷'},
      '圣骑士':{key_attr:'意志', hp:10, fp:8, saves:'感知、魅力'},
      '武僧':{key_attr:'敏捷', hp:8, fp:8, saves:'力量、敏捷'},
      '牧师':{key_attr:'感知', hp:8, fp:8, saves:'感知、魅力'},
      '术士':{key_attr:'幸运', hp:8, fp:8, saves:'体质、魅力'},
      '魔契师':{key_attr:'魅力', hp:8, fp:8, saves:'感知、魅力'},
      '奇械师':{key_attr:'魅力', hp:8, fp:8, saves:'体质、智力'},
      '萨满祭司':{key_attr:'感知', hp:8, fp:8, saves:'感知、魅力'}
    };
    var co = CLS_OVERRIDE[CHAR.className];
    var hpFirst = co ? co.hp : 8;
    var fpFirst = co ? co.fp : 8;
    // Prefer REF_CLASSES or classData if available
    if (typeof REF_CLASSES !== 'undefined' && REF_CLASSES[CHAR.className]) {
      if (REF_CLASSES[CHAR.className].hp_formula) hpFirst = REF_CLASSES[CHAR.className].hp_formula.first;
      if (REF_CLASSES[CHAR.className].fp_formula) fpFirst = REF_CLASSES[CHAR.className].fp_formula.first;
    }
    if (cl.hp_formula && cl.hp_formula.first) hpFirst = cl.hp_formula.first;
    if (cl.fp_formula && cl.fp_formula.first) fpFirst = cl.fp_formula.first;
    var hpFromCon = Math.floor((con - 10) / 2);
    var hp = hpFirst + hpFromCon + raceHp + bgHp;
    var fpKey = CHAR.keyAttr || (cl.key_attr || (co ? co.key_attr : '魅力'));
    if (fpKey === '力量或敏捷') fpKey = CHAR.keyAttr || '力量';
    var fpVal = CHAR.attrs[fpKey] || 10;
    var fpFromKey = Math.floor((fpVal - 10) / 2);
    var raceFP = (rd2 && rd2['疲劳值加成']) ? (typeof rd2['疲劳值加成']==='string' ? parseInt(rd2['疲劳值加成']) : rd2['疲劳值加成']) : 0;
    var fp = fpFirst + fpFromKey + raceFP;
    h += '<div class="ov-section"><div class="ov-label">❤️ 生命 / 疲劳</div>';
    h += '<div class="ov-hp"><span>HP: ' + hp + '</span><span>FP: ' + fp + '</span></div></div>';
  }
  // 熟练项 (含来源)
  var profLines = [];
  if (CHAR.selectedSkills && CHAR.selectedSkills.length) {
    for (var si = 0; si < CHAR.selectedSkills.length; si++) profLines.push({ name: CHAR.selectedSkills[si], src: '职业' });
  }
  // Specialization proficiencies
  var autoCls2 = SPEC_AUTO_PROF[CHAR.className];
  if (autoCls2) {
    for (var asn in autoCls2) {
      var ad = autoCls2[asn];
      if (ad.profs) {
        for (var pa in ad.profs) {
          var skills = ad.profs[pa];
          for (var psi = 0; psi < skills.length; psi++) profLines.push({ name: skills[psi], src: '专精' });
        }
      }
    }
  }
  // Specialization user choices
  if (CHAR.specChoices) {
    for (var sn in CHAR.specChoices) {
      var ch = CHAR.specChoices[sn];
      if (ch.skill && ch.skill.indexOf('-') >= 0) {
        var specParts = ch.skill.split('-');
        profLines.push({ name: ch.skill, src: '专精' });
      }
    }
  }
  // Background proficiencies
  if (CHAR.bgName && CHAR.bgData) {
    var bgSk = CHAR.bgData['基础熟练项'] || '';
    if (bgSk && bgSk !== '无') {
      var bgParts = bgSk.split(/[、，]/);
      for (var bi = 0; bi < bgParts.length; bi++) {
        var bn = bgParts[bi].trim(); if (!bn) continue;
        var mapped = BG_SKILL_MAP[bn]; if (!mapped || mapped === 'cat') continue;
        var mp = mapped.split('.'); if (mp.length === 2) profLines.push({ name: mp[1], src: '背景' });
        else profLines.push({ name: bn, src: '背景' });
      }
    }
    if (CHAR.bgProfs && CHAR.bgProfs.skills) {
      for (var cat in CHAR.bgProfs.skills) {
        if (cat === '_custom') continue;
        var arr = CHAR.bgProfs.skills[cat];
        if (arr && arr.length) {
          for (var aj = 0; aj < arr.length; aj++) profLines.push({ name: arr[aj], src: '背景' });
        }
      }
    }
  }
  // Human free skill
  if (CHAR.humanFreeSkill) profLines.push({ name: CHAR.humanFreeSkill, src: '人类' });
  if (profLines.length) {
    h += '<div class="ov-section"><div class="ov-label">📚 熟练项</div>';
    for (var pi = 0; pi < profLines.length; pi++) {
      var clr = profLines[pi].src === '职业' ? '#6b8f5e' : (profLines[pi].src === '背景' ? '#8f6b5e' : '#5e6b8f');
      h += '<div class="ov-item">·' + profLines[pi].name + '<span class="ov-tag" style="background:' + clr + '">' + profLines[pi].src + '</span></div>';
    }
    h += '</div>';
  }
  // 背景
  if (CHAR.bgName) {
    h += '<div class="ov-section"><div class="ov-label">🎭 背景: ' + CHAR.bgName + '</div>';
    h += '</div>';
  }
  // 装备
  if (CHAR.equipChoice) {
    h += '<div class="ov-section"><div class="ov-label">⚔ 装备: ' + (CHAR.equipChoice.letter || '已选') + '</div>';
    h += '</div>';
  }
  if (!h) h = '<div class="ov-empty">逐步完成创建，概览将实时更新</div>';
  document.getElementById('ovContent').innerHTML = h;
  notifyChargenChange();
}

function goToStep(n) {
  if(window.snd)snd.play('step');
  CURRENT_STEP=n;
  var dots=document.querySelectorAll(".step-dot");
  for(var i=0;i<dots.length;i++){
    dots[i].className="step-dot";
    if(i<n) dots[i].classList.add("done");
    else if(i===n) dots[i].classList.add("active");
  }
  renderStep(n);
}

function renderStep(n) {
  var c=document.getElementById("stepContent");
  if(n===0) renderClassStep(c);
  else if(n===1) renderStartFeaturesStep(c);
  else if(n===2) renderRaceStep(c);
  else if(n===3) renderAttrStep(c);
  else if(n===4) renderSkillStep(c);
  else if(n===5) renderBgStep(c);
  else if(n===6) renderEquipStep(c);
  else if(n===7) renderReviewStep(c);
}

function navBtns(showPrev,canNext,nextLabel){
  var h="<div class='nav-buttons'><div>";
  if(showPrev) h+="<button class='btn btn-secondary' onclick='goToStep("+(CURRENT_STEP-1)+")'>← 上一步</button>";
  else h+="<span></span>";
  h+="</div><div>";
  if(CURRENT_STEP<TOTAL_STEPS-1){
    h+="<button class='btn btn-primary' id='nextBtn' onclick='goToStep("+(CURRENT_STEP+1)+")'"+(canNext?"":" disabled")+">下一步 →</button>";
  }else{
    h+="<button class='btn btn-primary' id='saveBtn' onclick='saveCharacter()'"+(CHAR.charName.length>0?"":" disabled")+">"+(nextLabel||"🎉 保存角色")+"</button>";
  }
  h+="</div></div>";
  return h;
}

function bgSkillClick(el){
  if(el.classList.contains("selected")){
    el.classList.remove("selected");
    var row=el.parentNode;
    var cat=row.getAttribute("data-cat")||"";
    if(cat==="_all"){
      delete CHAR.bgProfs.skills["_custom"];
    }else if(cat&&CHAR.bgProfs.skills[cat]){
      var skill=el.getAttribute("data-skill");
      var idx=CHAR.bgProfs.skills[cat].indexOf(skill);
      if(idx>=0)CHAR.bgProfs.skills[cat].splice(idx,1);
    }
    return;
  }
  var row=el.parentNode;
  var max=parseInt(row.getAttribute("data-max"))||1;
  var cat=row.getAttribute("data-cat")||"";
  var sel=row.querySelectorAll(".selected");
  if(sel.length>=max)return;
  el.classList.add("selected");
  if(cat==="_all"){
    if(!CHAR.bgProfs.skills)CHAR.bgProfs.skills={};
    CHAR.bgProfs.skills["_custom"]={attr:el.getAttribute("data-attr"),skill:el.getAttribute("data-skill")};
  }else if(cat){
    if(!CHAR.bgProfs.skills)CHAR.bgProfs.skills={};
    var skill=el.getAttribute("data-skill");
    if(!CHAR.bgProfs.skills[cat])CHAR.bgProfs.skills[cat]=[];
    CHAR.bgProfs.skills[cat].push(skill);
  }
}

function renderAttrStep(c) {
  var used=calcCost(); var rem=TOTAL_POINTS-used;
  var h="<div class='step-title'>"+STEP_LABELS[3]+"</div>";
  h+="<div class='step-desc'>使用 32 点费用分配你的属性值。单项至多分配 9 点（=15 属性值）。种族加值将在最终计算时自动添加。</div>";
  h+="<div class='point-pool'>剩余费用：<span id='remainingPts'>"+rem+"</span> / "+TOTAL_POINTS+"</div>";
  h+="<div class='attr-buy' id='attrGrid'>";
  for(var i=0;i<ATTR_NAMES.length;i++){
    var an=ATTR_NAMES[i]; var val=CHAR.attrs[an]; var cost=calcAttrCost(val);
    h+="<div class='attr-row'>";
    h+="<div class='attr-label'>"+an+"</div>";
    h+="<button class='attr-btn' onclick='adjAttr(\""+an+"\",-1)'"+(cost<=0?" disabled":"")+" id='dec_"+an+"'>−</button>";
    h+="<div class='attr-val' id='val_"+an+"'>"+val+getRaceBonus(an)+"</div>";
    h+="<button class='attr-btn' onclick='adjAttr(\""+an+"\",1)'"+(val>=15||rem<(val>=13?2:1)?" disabled":"")+" id='inc_"+an+"'>+</button>";
    h+="<div class='attr-mod' id='mod_"+an+"'>"+modStr(val)+"</div>";
    h+="<div class='attr-cost'>"+cost+"</div></div>";
  }
  h+="</div>";
  h+=navBtns(true,rem===0);
  c.innerHTML=h;
}


function getRaceBonus(a){var r=CHAR.raceData;if(!r||!r["属性加成"])return"";var b=r["属性加成"][a]||0;return b?" <span style='font-size:12px;color:#6b8f5e'>("+(b>0?"+":"")+b+")</span>":"";}
function adjAttr(name,delta){
  var cur=CHAR.attrs[name]; var nxt=cur+delta;
  if(nxt<8||nxt>15) return;
  var curTotal=calcCost();
  var added=calcAttrCost(nxt)-calcAttrCost(cur);
  if(curTotal+added>TOTAL_POINTS) return;
  CHAR.attrs[name]=nxt;
  document.getElementById("val_"+name).innerHTML=nxt+getRaceBonus(name);
  document.getElementById("mod_"+name).textContent=modStr(nxt);
  document.getElementById("dec_"+name).disabled=(nxt<=8);
  var rem=TOTAL_POINTS-calcCost();
  document.getElementById("remainingPts").textContent=rem;
  for(var i2=0;i2<ATTR_NAMES.length;i2++){
    var an2=ATTR_NAMES[i2]; var v2=CHAR.attrs[an2];
    var el2=document.querySelector("#attrGrid .attr-row:nth-child("+(i2+1)+") .attr-cost");
    if(el2) el2.textContent=v2>=15?"MAX":(v2>=13?"2":"1");
    document.getElementById("inc_"+an2).disabled=(v2>=15||rem<(v2>=13?2:1));
  }
  document.getElementById("nextBtn").disabled=(rem!==0);
  updateOverview();
}

function parseSkills(t){
  if(!t) return [];
  var m=t.match(/从(.+?)中/);
  if(!m) return t.split(/[、,，]/).map(function(s){return s.trim();}).filter(function(s){return s.length>0&&s.indexOf("选择")<0;});
  return m[1].split(/[、,，]/).map(function(s){return s.trim();}).filter(function(s){return s.length>0;});
}

function parseEquipToSlots(text, charData){
  if(!text) return;
  var gm=text.match(/(\d+)枚金币/);
  if(gm) charData.currency["金币"]=(charData.currency["金币"]||0)+parseInt(gm[1]);
  var t=text.replace(/^[^。]*其中包括有：/,"").replace(/^[^。]*套装[^。]*其中包括有：/,"");
  if(text.indexOf("\n")>=0){
    var lines=text.split("\n");
    for(var li=0;li<lines.length;li++){
      var l=lines[li].trim();if(!l) continue;
      if(/\d+枚金币/.test(l)) continue;
      var nm=l.split("：")[0].trim().replace(/^[一二两三四五六七八九十\d]+[把根面副个对瓶组块枚件套柄]/,"").trim();
      if(nm&&nm.length>1) charData.equipment["背包"].push(nm);
    }
    return;
  }
  var toolAlias={};
  toolAlias["简易野炊工具"]="野炊工具";toolAlias["草药工具"]="草药工具";toolAlias["制毒工具"]="制毒工具";
  toolAlias["酿酒工具"]="酿酒工具";toolAlias["写作工具"]="写作工具";toolAlias["探索工具"]="探索工具";
  toolAlias["攀爬工具"]="攀爬工具";toolAlias["生火工具"]="生火工具";toolAlias["开锁工具"]="开锁工具";
  toolAlias["魔术道具"]="魔术道具";
  var parts=[];var depth=0;var cur="";
  for(var ci=0;ci<t.length;ci++){
    var ch=t[ci];
    if(ch==="（"||ch==="(") depth++;
    else if(ch==="）"||ch===")") depth--;
    if(ch==="."&&depth===0&&cur.trim().length>0){parts.push(cur.trim());cur="";}
    else cur+=ch;
  }
  if(cur.trim()) parts.push(cur.trim());
  for(var pi=0;pi<parts.length;pi++){
    var part=parts[pi];
    if(/\d+枚/.test(part)&&part.length<12) continue;
    var containerMatch=part.match(/^[^（(]+?[（(](.+)[)）]/);
    var itemName=part;
    var contents=null;
    if(containerMatch){
      itemName=containerMatch[0].replace(/[（(].*[)）]/,"").trim();
      contents=containerMatch[1].split(/[、，]/);
    }
    itemName=itemName.replace(/[和]\d+[支发][^。]*$/,"").trim();
    itemName=itemName.replace(/(^|[和，、])[一二两三四五六七八九十\d]*[把根面副个对瓶组块枚件套柄条根发盏颗封卷张帖袋捆顶]/,"$1").trim();
    itemName=itemName.replace(/^[和，、]\d*[支发粒]/,"").trim();
    if(itemName.indexOf("或")>=0) itemName=itemName.split("或")[0].trim();
    if(itemName.indexOf("、")>=0) itemName=itemName.split("、")[0].trim();
    if(itemName.indexOf("，")>=0) itemName=itemName.split("，")[0].trim();
    itemName=itemName.replace(/[和、，]$/,"").trim();
    if(!itemName||itemName.length<=1) continue;
    for(var ak in toolAlias){if(itemName.indexOf(ak)>=0){itemName=toolAlias[ak];break;}}
    var slot=determineEquipSlot(itemName);
    if(!charData.equipment[slot]) charData.equipment[slot]=[];
    var dup=false;
    for(var si=0;si<charData.equipment[slot].length;si++){if(charData.equipment[slot][si]===itemName){dup=true;break;}}
    if(!dup) charData.equipment[slot].push(itemName);
    if(contents){var _ts="背包";if(itemName==="旅行腰包")_ts="旅行腰包";if(itemName==="背包")_ts="背包";
      for(var ci2=0;ci2<contents.length;ci2++){
        var cn=contents[ci2].trim();
        if(!cn||/\d+枚/.test(cn)||cn.length<=1) continue;
        var _qOrig=cn;cn=cn.replace(/^[一二两三四五六七八九十\d]+[把根面副个对瓶组块枚件套柄]/,"").trim();
        for(var ak2 in toolAlias){if(cn.indexOf(ak2)>=0){cn=toolAlias[ak2];break;}}
        if(cn&&cn.length>1){var _qcnt=_getQty(_qOrig);for(var _qi=0;_qi<_qcnt;_qi++)charData.equipment[_ts].push(cn)}
      }
    }
  }
}
function determineEquipSlot(itemName){
  var wepExact=["短剑","长剑","巨剑","刺剑","手斧","战斧","巨斧","轻锤","战锤","重锤","长矛","匕首","标枪","长弓","短弓","长棍","木杖","法杖","魔棒","短杖","火枪","步枪","手弩","轻弩","重弩","投石索","飞镖","袖剑","拳刃","猎刀","弯刀","军刀","镰刀","手术刀","雕刻刀"];
  for(var i=0;i<wepExact.length;i++){if(itemName.indexOf(wepExact[i])>=0) return "主手武器";}
  var wepGeneric=["剑","斧","锤","矛","弓","弩","枪","杖","棍","镖","刃","刀"];
  for(var i=0;i<wepGeneric.length;i++){if(itemName.indexOf(wepGeneric[i])>=0) return "主手武器";}
  if(itemName.indexOf("盾")>=0) return "副手武器";
  if(itemName.indexOf("甲")>=0||itemName.indexOf("衣")>=0||itemName.indexOf("服")>=0) return "防具";
  if(itemName.indexOf("戒指")>=0||itemName.indexOf("项链")>=0||itemName.indexOf("坠")>=0||itemName.indexOf("徽")>=0||itemName.indexOf("水晶球")>=0) return "配饰";
  if(itemName.indexOf("旅行腰包")>=0||itemName==="腰包") return "旅行腰包";
  if(itemName.indexOf("材料包")>=0||itemName.indexOf("草药袋")>=0||itemName.indexOf("材料袋")>=0) return "材料包";
  if(itemName.indexOf("杂物包")>=0) return "杂物包";
  if(itemName.indexOf("背包")>=0) return "背包";
  return "背包";
}


function applySpecProfs(charData){
  if(CHAR.specChoices){
    for(var sn in CHAR.specChoices){
      var ch=CHAR.specChoices[sn];
      if(ch.skill&&ch.skill.indexOf("-")>=0){
        var parts=ch.skill.split("-");
        var attrName=parts[0];
        var attrMap={"奥秘":"智力","知识":"智力","运动":"力量","巧手":"敏捷","巧手-偷窃":"敏捷","巧手-开锁":"敏捷","巧手-拆除":"敏捷"};
        var actualAttr=attrMap[attrName]||attrName;
        if(charData.profs[actualAttr]&&charData.profs[actualAttr][ch.skill]!==undefined){
          charData.profs[actualAttr][ch.skill]=(charData.profs[actualAttr][ch.skill]||0)+1;
        }
      }else if(ch.skill){
        if(ch.attr&&charData.profs[ch.attr]&&charData.profs[ch.attr][ch.skill]!==undefined){
          charData.profs[ch.attr][ch.skill]=(charData.profs[ch.attr][ch.skill]||0)+1;
        }
      }
    }
  }
  var autoCls=SPEC_AUTO_PROF[CHAR.className];
  if(autoCls){
    for(var asn in autoCls){
      var ad=autoCls[asn];
      if(ad.profs){
        for(var pa in ad.profs){
          var skills=ad.profs[pa];
          for(var psi=0;psi<skills.length;psi++){
            if(charData.profs[pa]&&charData.profs[pa][skills[psi]]!==undefined){
              charData.profs[pa][skills[psi]]=(charData.profs[pa][skills[psi]]||0)+1;
            }
          }
        }
      }
      if(ad.professionals){
        for(var pi=0;pi<ad.professionals.length;pi++){
          if(charData.professionals.indexOf(ad.professionals[pi])<0){
            charData.professionals.push(ad.professionals[pi]);
          }
        }
      }
    }
  }
}

function applyBgProfs(charData){
  var bgData=CHAR.bgData;
  if(!bgData)return;

  // Apply 基础熟练项
  var skText=bgData["基础熟练项"]||"";
  if(skText&&skText!=="无"){
    var skills=skText.split(/[、，]/);
    for(var i=0;i<skills.length;i++){
      var sk=skills[i].trim();if(!sk)continue;
      var mapped=BG_SKILL_MAP[sk];
      if(!mapped||mapped==="cat")continue;
      var parts=mapped.split(".");
      if(parts.length===2&&charData.profs[parts[0]]&&charData.profs[parts[0]][parts[1]]!==undefined){
        charData.profs[parts[0]][parts[1]]=(charData.profs[parts[0]][parts[1]]||0)+1;
      }
    }
  }

  // Apply category choices
  if(CHAR.bgProfs&&CHAR.bgProfs.skills){
    for(var cat in CHAR.bgProfs.skills){
      if(cat==="_custom"){
        var ch=CHAR.bgProfs.skills[cat];
        if(ch.attr&&ch.skill&&charData.profs[ch.attr]&&charData.profs[ch.attr][ch.skill]!==undefined){
          charData.profs[ch.attr][ch.skill]=(charData.profs[ch.attr][ch.skill]||0)+1;
        }
      }else{
        var arr=CHAR.bgProfs.skills[cat];
        if(arr&&arr.length){
          var catInfo=BG_SKILL_CATS[cat];
          if(catInfo){
            for(var j=0;j<arr.length;j++){
              if(charData.profs[catInfo.attr]&&charData.profs[catInfo.attr][arr[j]]!==undefined){
                charData.profs[catInfo.attr][arr[j]]=(charData.profs[catInfo.attr][arr[j]]||0)+1;
              }
            }
          }
        }
      }
    }
  }

  // Apply 专业熟练项
  var proText=bgData["专业熟练项"]||"";
  if(proText&&proText!=="无"){
    if(proText.indexOf("任选")>=0){
      if(CHAR.bgProfs&&CHAR.bgProfs.profInput){
        // Add user input to professionals
        if(charData.professionals.indexOf(CHAR.bgProfs.profInput)<0){
          charData.professionals.push(CHAR.bgProfs.profInput);
        }
      }
    }else{
      var proList=proText.split(/[、，]/);
      for(var i=0;i<proList.length;i++){
        var pn=proList[i].trim();
        if(pn&&charData.professionals.indexOf(pn)<0){
          charData.professionals.push(pn);
        }
      }
    }
  }
}

function bgResolveItem(name){
  if(typeof ITEM_DATA!=="undefined"&&ITEM_DATA[name])return name;
  // Try to find a known item name within this string
  if(typeof ITEM_DATA!=="undefined"){
    var best=null;
    for(var key in ITEM_DATA){
      if(name.indexOf(key)>=0&&(!best||key.length>best.length))best=key;
    }
    if(best)return best;
  }
  return name;
}
function bgItemSlot(name){
  if(typeof ITEM_DATA!=="undefined"){
    var id=ITEM_DATA[name];
    if(id&&id.tags){
      var tags=id.tags;
      if(tags.indexOf("武器")>=0)return "主手武器";
      if(tags.indexOf("护甲")>=0||tags.indexOf("防具")>=0)return "防具";
      if(tags.indexOf("盾牌")>=0)return "副手武器";
      if(tags.indexOf("配饰")>=0)return "配饰";
      if(tags.indexOf("容器")>=0){
        if(name.indexOf("旅行")>=0||name.indexOf("腰包")>=0)return "旅行腰包";
        if(name.indexOf("材料")>=0||name.indexOf("草药")>=0)return "材料包";
        if(name.indexOf("杂物")>=0)return "杂物包";
        return "背包";
      }
      if(tags.indexOf("乐器")>=0||tags.indexOf("医用")>=0||tags.indexOf("服饰")>=0||
         tags.indexOf("食品")>=0||tags.indexOf("消耗品")>=0||
         tags.indexOf("工具")>=0||tags.indexOf("材料")>=0||
         tags.indexOf("矿石")>=0||tags.indexOf("草药")>=0)return "背包";
      // Default to 杂物包 for small misc items
      if(tags.indexOf("杂物")>=0)return "杂物包";
    }
  }
  return "杂物包";
}

// ========== XLSX Export Engine ==========
async function inflate(data, tryRaw) {
  var useRaw = tryRaw !== false;
  if (useRaw) {
    try {
      var ds = new DecompressionStream("deflate-raw");
      var reader = ds.readable.getReader();
      var writer = ds.writable.getWriter();
      var readDone = (async function() {
        var chunks = [];
        while (true) { var r = await reader.read(); if (r.done) break; chunks.push(r.value); }
        return chunks;
      })();
      writer.write(data);
      writer.close();
      var chunks = await readDone;
      var total = 0;
      for (var i = 0; i < chunks.length; i++) total += chunks[i].length;
      var result = new Uint8Array(total);
      var off = 0;
      for (var i = 0; i < chunks.length; i++) { result.set(chunks[i], off); off += chunks[i].length; }
      return result;
    } catch(e) {
      // deflate-raw not supported, fall through to zlib wrapper approach
    }
  }
  // Add zlib header (0x78 0x9C) to raw deflate data for "deflate" format
  var zlibHeader = new Uint8Array([0x78, 0x9C]);
  var wrapped = new Uint8Array(zlibHeader.length + data.length);
  wrapped.set(zlibHeader, 0);
  wrapped.set(data, zlibHeader.length);
  var ds2 = new DecompressionStream("deflate");
  var reader2 = ds2.readable.getReader();
  var writer2 = ds2.writable.getWriter();
  var readDone2 = (async function() {
    var chunks = [];
    while (true) { var r = await reader2.read(); if (r.done) break; chunks.push(r.value); }
    return chunks;
  })();
  writer2.write(wrapped);
  writer2.close();
  var chunks2 = await readDone2;
  var total2 = 0;
  for (var i = 0; i < chunks2.length; i++) total2 += chunks2[i].length;
  var result2 = new Uint8Array(total2);
  var off2 = 0;
  for (var i = 0; i < chunks2.length; i++) { result2.set(chunks2[i], off2); off2 += chunks2[i].length; }
  return result2;
}

async function readFileEntry(files, entry) {
  if (!files[entry]) return null;
  var f = files[entry];
  if (f.method === 0) return new TextDecoder().decode(f.compressed); // stored
  if (f.method === 8) {
    var decompressed = await inflate(f.compressed);
    return new TextDecoder().decode(decompressed);
  }
  throw new Error("不支持的压缩方式: " + f.method);
}

// ========== XLSX Parser (regex-based, no DOMParser) ==========
async function parseXLSX(buffer) {
  var zip = await readZIP(buffer);
  if(!zip["xl/sharedStrings.xml"]||!zip["xl/worksheets/sheet1.xml"])throw new Error("模板格式不正确");
  var ssXML=await readFileEntry(zip,"xl/sharedStrings.xml");
  var sheetXML=await readFileEntry(zip,"xl/worksheets/sheet1.xml");
  // Parse shared strings with regex (avoids DOMParser namespace issues)
  var strings=[];
  var siRe=/<si>([\s\S]*?)<\/si>/g;var sm;
  while((sm=siRe.exec(ssXML))!==null){strings.push(sm[1].replace(/<[^>]+>/g,""));}
  // Parse cells with regex: match <c r="XX" ...><v>N</v></c>
  var cells={},rawValues={};
  var cRe=/<c r="([A-Z]+\d+)"(?:[^>]*?t="([^"]*)")?[^>]*>(?:<is>(?:<t[^>]*>)?([^<]*)(?:<\/t>)?<\/is>|<v>(\d+(?:\.\d+)?)<\/v>)<\/c>/g;
  var cm;
  while((cm=cRe.exec(sheetXML))!==null){
    var ref=cm[1],tAttr=cm[2]||"",inline=cm[3],vNum=cm[4];
    var rawVal=vNum||inline||"";
    var textVal=rawVal;
    if(tAttr==="s"&&vNum){
      var idx=parseInt(vNum);
      textVal=(idx<strings.length)?strings[idx]:vNum;
    }
    if(rawVal){rawValues[ref]=rawVal;}
    if(textVal){cells[ref]=textVal;if(ref=="C17"||ref=="C22")console.log("REGEX FOUND",ref,"rawVal="+rawVal,"textVal="+textVal);}
  }
  console.log("REGEX PARSER: strings="+strings.length+" cells="+Object.keys(cells).length);return{cells:cells,rawValues:rawValues,strings:strings};
}

var _XLSX_CRC_TABLE = null;
function _xlsxCrc32(data) {
  if (!_XLSX_CRC_TABLE) {
    _XLSX_CRC_TABLE = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      _XLSX_CRC_TABLE[n] = c;
    }
  }
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < data.length; i++) crc = (crc >>> 8) ^ _XLSX_CRC_TABLE[(crc ^ data[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

async function _xlsxDeflate(data) {
  var ds = new CompressionStream("deflate-raw");
  var writer = ds.writable.getWriter();
  var reader = ds.readable.getReader();
  writer.write(data);
  writer.close();
  var chunks = [];
  while (true) { var r = await reader.read(); if (r.done) break; chunks.push(r.value); }
  var total = 0;
  for (var i = 0; i < chunks.length; i++) total += chunks[i].length;
  var result = new Uint8Array(total);
  var off = 0;
  for (var i = 0; i < chunks.length; i++) { result.set(chunks[i], off); off += chunks[i].length; }
  return result;
}

function _xlsxBuildZip(entries) {
  var parts = [];
  var cdEntries = [];
  for (var ei = 0; ei < entries.length; ei++) {
    var en = entries[ei];
    var nameBuf = new TextEncoder().encode(en.name);
    var data = en.data;
    var crc = _xlsxCrc32(data);
    var lh = new ArrayBuffer(30 + nameBuf.length);
    var dv = new DataView(lh);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, en.method, true); dv.setUint32(10, (Date.now() / 1000) | 0, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, en.compSize, true); dv.setUint32(22, en.uncompSize, true);
    dv.setUint16(26, nameBuf.length, true); dv.setUint16(28, 0, true);
    var lhArr = new Uint8Array(lh);
    lhArr.set(nameBuf, 30);
    parts.push(lhArr, data);
    cdEntries.push({ nameBuf: nameBuf, method: en.method, crc: crc, compSize: en.compSize, uncompSize: en.uncompSize });
  }
  var totalOff = 0;
  for (var i = 0; i < parts.length; i++) totalOff += parts[i].length;
  var cdBufs = [];
  for (var i = 0; i < cdEntries.length; i++) {
    var ce = cdEntries[i];
    var fo = 0;
    for (var j = 0; j < i * 2; j++) fo += parts[j].length;
    var cdh = new ArrayBuffer(46 + ce.nameBuf.length);
    var cdv = new DataView(cdh);
    cdv.setUint32(0, 0x02014b50, true); cdv.setUint16(4, 20, true); cdv.setUint16(6, 20, true);
    cdv.setUint16(8, 0x0800, true); cdv.setUint16(10, ce.method, true); cdv.setUint32(12, (Date.now() / 1000) | 0, true);
    cdv.setUint32(16, ce.crc, true); cdv.setUint32(20, ce.compSize, true); cdv.setUint32(24, ce.uncompSize, true);
    cdv.setUint16(28, ce.nameBuf.length, true); cdv.setUint16(30, 0, true); cdv.setUint16(32, 0, true);
    cdv.setUint16(34, 0, true); cdv.setUint16(36, 0, true); cdv.setUint32(38, 0, true); cdv.setUint32(42, fo, true);
    var cdhArr = new Uint8Array(cdh);
    cdhArr.set(ce.nameBuf, 46);
    cdBufs.push(cdhArr);
  }
  var cdSize = 0;
  for (var i = 0; i < cdBufs.length; i++) cdSize += cdBufs[i].length;
  var eocd = new ArrayBuffer(22);
  var ev = new DataView(eocd);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, cdEntries.length, true); ev.setUint16(10, cdEntries.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, totalOff, true); ev.setUint16(20, 0, true);
  var all = parts.concat(cdBufs);
  all.push(new Uint8Array(eocd));
  var totalLen = 0;
  for (var i = 0; i < all.length; i++) totalLen += all[i].length;
  var result = new Uint8Array(totalLen);
  var off = 0;
  for (var i = 0; i < all.length; i++) { result.set(all[i], off); off += all[i].length; }
  return result;
}
