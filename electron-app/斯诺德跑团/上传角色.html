<script>
var ATTR_NAMES=["力量","敏捷","体质","智力","感知","魅力","意志","幸运"];
// ========== ZIP Reader ==========
async function readZIP(buffer) {
  var view = new DataView(buffer);
  // Find end of central directory record (EOCD)
  var eocdOffset = -1;
  for (var i = buffer.byteLength - 22; i >= Math.max(0, buffer.byteLength - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
  }
  if (eocdOffset < 0) throw new Error("无法解析ZIP文件");

  var cdOffset = view.getUint32(eocdOffset + 16, true);
  var cdSize = view.getUint32(eocdOffset + 12, true);
  var totalEntries = view.getUint16(eocdOffset + 10, true);

  var files = {};
  var pos = cdOffset;
  for (var i = 0; i < totalEntries; i++) {
    if (view.getUint32(pos, true) !== 0x02014b50) break;
    var compMethod = view.getUint16(pos + 10, true);
    var compSize = view.getUint32(pos + 20, true);
    var uncompSize = view.getUint32(pos + 24, true);
    var nameLen = view.getUint16(pos + 28, true);
    var extraLen = view.getUint16(pos + 30, true);
    var commentLen = view.getUint16(pos + 32, true);
    var localOffset = view.getUint32(pos + 42, true);

    var name = "";
    for (var j = 0; j < nameLen; j++) name += String.fromCharCode(view.getUint8(pos + 46 + j));

    // Read local file header
    var lp = localOffset;
    var lnameLen = view.getUint16(lp + 26, true);
    var lextraLen = view.getUint16(lp + 28, true);
    var dataStart = lp + 30 + lnameLen + lextraLen;
    var rawData = new Uint8Array(buffer, dataStart, compSize);

    files[name] = { compressed: rawData, method: compMethod, compSize: compSize, uncompSize: uncompSize };
    pos += 46 + nameLen + extraLen + commentLen;
  }
  return files;
}

async function inflate(data, tryRaw) {
  var useRaw = tryRaw !== false;
  if (useRaw) {
    try {
      var ds = new DecompressionStream("deflate-raw");
      var reader = ds.readable.getReader();
      var writer = ds.writable.getWriter();
      var readDone = (async function() {
        var chunks = [];
        while (true) { var r = await reader.read(); if (r.done) break; chunks.push(r.value); }
        return chunks;
      })();
      writer.write(data);
      writer.close();
      var chunks = await readDone;
      var total = 0;
      for (var i = 0; i < chunks.length; i++) total += chunks[i].length;
      var result = new Uint8Array(total);
      var off = 0;
      for (var i = 0; i < chunks.length; i++) { result.set(chunks[i], off); off += chunks[i].length; }
      return result;
    } catch(e) {
      // deflate-raw not supported, fall through to zlib wrapper approach
    }
  }
  // Add zlib header (0x78 0x9C) to raw deflate data for "deflate" format
  var zlibHeader = new Uint8Array([0x78, 0x9C]);
  var wrapped = new Uint8Array(zlibHeader.length + data.length);
  wrapped.set(zlibHeader, 0);
  wrapped.set(data, zlibHeader.length);
  var ds2 = new DecompressionStream("deflate");
  var reader2 = ds2.readable.getReader();
  var writer2 = ds2.writable.getWriter();
  var readDone2 = (async function() {
    var chunks = [];
    while (true) { var r = await reader2.read(); if (r.done) break; chunks.push(r.value); }
    return chunks;
  })();
  writer2.write(wrapped);
  writer2.close();
  var chunks2 = await readDone2;
  var total2 = 0;
  for (var i = 0; i < chunks2.length; i++) total2 += chunks2[i].length;
  var result2 = new Uint8Array(total2);
  var off2 = 0;
  for (var i = 0; i < chunks2.length; i++) { result2.set(chunks2[i], off2); off2 += chunks2[i].length; }
  return result2;
}

async function readFileEntry(files, entry) {
  if (!files[entry]) return null;
  var f = files[entry];
  if (f.method === 0) return new TextDecoder().decode(f.compressed); // stored
  if (f.method === 8) {
    var decompressed = await inflate(f.compressed);
    return new TextDecoder().decode(decompressed);
  }
  throw new Error("不支持的压缩方式: " + f.method);
}

// ========== XLSX Parser (regex-based, no DOMParser) ==========
async function parseXLSX(buffer) {
  var zip = await readZIP(buffer);
  if(!zip["xl/sharedStrings.xml"]||!zip["xl/worksheets/sheet1.xml"])throw new Error("模板格式不正确");
  var ssXML=await readFileEntry(zip,"xl/sharedStrings.xml");
  var sheetXML=await readFileEntry(zip,"xl/worksheets/sheet1.xml");
  // Parse shared strings with regex (avoids DOMParser namespace issues)
  var strings=[];
  var siRe=/<si>([\s\S]*?)<\/si>/g;var sm;
  while((sm=siRe.exec(ssXML))!==null){strings.push(sm[1].replace(/<[^>]+>/g,""));}
  // Parse cells with regex: match <c r="XX" ...><v>N</v></c>
  var cells={},rawValues={};
  var cRe=/<c r="([A-Z]+\d+)"(?:[^>]*?t="([^"]*)")?[^>]*>(?:<is>(?:<t[^>]*>)?([^<]*)(?:<\/t>)?<\/is>|<v>(\d+(?:\.\d+)?)<\/v>)<\/c>/g;
  var cm;
  while((cm=cRe.exec(sheetXML))!==null){
    var ref=cm[1],tAttr=cm[2]||"",inline=cm[3],vNum=cm[4];
    var rawVal=vNum||inline||"";
    var textVal=rawVal;
    if(tAttr==="s"&&vNum){
      var idx=parseInt(vNum);
      textVal=(idx<strings.length)?strings[idx]:vNum;
    }
    if(rawVal){rawValues[ref]=rawVal;}
    if(textVal){cells[ref]=textVal;if(ref=="C17"||ref=="C22")console.log("REGEX FOUND",ref,"rawVal="+rawVal,"textVal="+textVal);}
  }
  console.log("REGEX PARSER: strings="+strings.length+" cells="+Object.keys(cells).length);return{cells:cells,rawValues:rawValues,strings:strings};
}

function calcMod(val){return Math.floor(((val||10)-10)/2);}
var _REF_CLASSES={"蛮斗士":{hp:{first:12,up:5},fp:{first:8,up:1},key:"力量"},"战士":{hp:{first:10,up:4},fp:{first:8,up:1},key:"力量或敏捷"},"法师":{hp:{first:8,up:2},fp:{first:12,up:1},key:"智力"},"猎人":{hp:{first:8,up:3},fp:{first:8,up:1},key:"敏捷"},"牧师":{hp:{first:8,up:2},fp:{first:8,up:1},key:"感知"},"圣骑士":{hp:{first:10,up:4},fp:{first:8,up:1},key:"意志"},"游荡者":{hp:{first:8,up:3},fp:{first:8,up:1},key:"敏捷"},"德鲁伊":{hp:{first:8,up:3},fp:{first:8,up:1},key:"感知"},"萨满祭司":{hp:{first:8,up:3},fp:{first:8,up:1},key:"感知"},"术士":{hp:{first:8,up:2},fp:{first:8,up:1},key:"幸运"},"武僧":{hp:{first:8,up:3},fp:{first:8,up:1},key:"敏捷"},"吟游诗人":{hp:{first:8,up:2},fp:{first:8,up:1},key:"魅力"},"魔契师":{hp:{first:8,up:2},fp:{first:8,up:1},key:"魅力"},"奇械师":{hp:{first:8,up:2},fp:{first:8,up:1},key:""},"守望者":{hp:{first:12,up:4},fp:{first:8,up:1},key:"意志"}};
var _REF_BG_TRAITS={侍僧:"侍僧可以进行虔诚的祷告，并且与同一信仰的信徒们互相尊重",骗子:"骗子可以将自己伪装成另一个身份，还会根据偏好骗局获得额外加成",恶棍:"恶棍根据自身的罪行拥有几个臭味相投的接头人",盗贼:"盗贼能够制作仅有自己和同行看得懂的特殊暗号和隐秘图标，并且在偷窃时具有优势",职业杀手:"职业杀手根据任务渠道受雇与他人，对方可能会不定期派发暗杀任务",乐师:"乐师在持有乐器时进行魅力检定具有优势，还能够通过演奏提升在当地的名望",艺人:"艺人能够更快速地通过表演获得名气",小丑:"小丑在表演失败时可能使结局导向更为有利的情况",驯兽师:"驯兽师能够与动物建立更深厚的羁绊",魔术师:"魔术师擅长用障眼法迷惑观众",平民英雄:"平民英雄深受平民阶层的信赖，可以从普通人那里获得更多的助力",药剂师:"药剂师精通药物的配制与识别",工匠:"工匠能够制作和修理各类物品",酿酒师:"酿酒师精于酿造各类美酒",制图师:"制图师精于绘制精准的地图",厨师:"厨师能够烹制美味佳肴",医者:"医者拥有治疗伤病的能力",隐士:"隐士远离尘嚣，在独处中获得感悟",护林员:"护林员熟悉森林的每一寸土地",农夫:"农夫勤劳朴实，擅长耕作",赏金猎人:"赏金猎人追踪目标从未失手",游牧民:"游牧民适应各种严酷环境",野蛮人:"野蛮人以蛮力解决问题",占星师:"占星师通过星象预知未来",图书管理员:"图书管理员管理着浩瀚的知识",教授:"教授传授知识给下一代",法师学徒:"法师学徒正在学习魔法的奥秘",水手:"水手在海上如履平地",士兵:"士兵服从命令，纪律严明",流浪儿:"流浪儿在街头学会了生存之道",守卫:"守卫恪尽职守保护一方平安",消防员:"消防员不畏火海拯救生命",雇佣兵:"雇佣兵为金钱而战",赌徒:"赌徒相信运气胜过一切",失败商人:"失败商人从失败中汲取教训",天生领袖:"天生领袖能够鼓舞身边的人",运动员:"运动员拥有一项偏好的运动项目，在进行这项运动时具备专家级的熟练度",公民:"公民是城市中的普通一员",侦探:"侦探擅长从蛛丝马迹中寻找真相",外乡人:"外乡人带着远方的故事而来",狂信徒:"狂信徒对信仰坚定不移",愚者:"愚者看似糊涂实则大智若愚"};

function calcHP(s){
  var mc=s.classes[0],sc=s.classes[1];
  if(!mc.name)return s.hp||0;
  var cl=_REF_CLASSES[mc.name];if(!cl)return s.hp||0;
  var con=s.attrs["体质"]||10;var cm=calcMod(con);
  var f=cl.hp.first,u=cl.hp.up,ml=mc.level||1;
  var raceHp=_REF_RACES[s.race]||0;
  var featHP=0;
  for(var fi=0;fi<(s.special_feats||[]).length;fi++){
    var fn=typeof s.special_feats[fi]==="string"?s.special_feats[fi]:(s.special_feats[fi].name||"");
    if(fn==="健美教练")featHP+=10;
    if(fn==="健壮")featHP+=2*(ml+(sc&&sc.level?(sc.level-1):0));
  }
  var bgHp=0;if(s.background&&_REF_BGS){var _bhp=_REF_BGS[s.background];if(typeof _bhp==="number")bgHp=_bhp;}
  var hp=f+cm+raceHp+bgHp+(u+cm)*(ml-1);
  if(sc&&sc.name&&sc.level>0){
    var cl2=_REF_CLASSES[sc.name];if(cl2){var su=cl2.hp.up;hp+=(su+cm)*(sc.level-1);}
  }
  return hp+featHP;
}
function calcFP(s){
  var mc=s.classes[0],sc=s.classes[1];
  if(!mc.name)return s.fp||0;
  var cl=_REF_CLASSES[mc.name];if(!cl)return s.fp||0;
  var key=cl.key;if(key==="力量或敏捷")key=s.classes[0].keyAttr||"力量";
  var kv=s.attrs[key]||10;var km=calcMod(kv);
  var f=cl.fp.first,u=cl.fp.up,ml=mc.level||1;
  var fp=f+km+u*(ml-1);
  if(sc&&sc.name&&sc.level>0){
    var cl2=_REF_CLASSES[sc.name];if(cl2){var su=cl2.fp.up;fp+=su*(sc.level-1);}
  }
  return fp;
}
function calcInit(s){return calcMod(s.attrs["敏捷"]||10);}
function calcProfBonus(level){if(level>=17)return 6;if(level>=13)return 5;if(level>=9)return 4;if(level>=5)return 3;return 2;}
function calcAttackHit(s){
  var ml=s.classes[0].level||0;var pb=calcProfBonus(ml);
  var str=s.attrs["力量"]||10,dex=s.attrs["敏捷"]||10;
  var am=Math.max(calcMod(str),calcMod(dex));
  return pb+am;
}
function calcSpellHit(s){
  var ml=s.classes[0].level||0;var pb=calcProfBonus(ml);
  var cl=_REF_CLASSES[s.classes[0].name];var key=cl?cl.key:"";if(key==="力量或敏捷")key=s.classes[0].keyAttr||"力量";
  var kv=s.attrs[key]||10;

function defaultColorMarks(){var m={},i;for(i=0;i<_MARK_COLOR_NAMES.length;i++)m[_MARK_COLOR_NAMES[i]]=false;return m;}
function ensureSpStateOn(s){if(!s.color_marks)s.color_marks=defaultColorMarks();if(typeof s.sp_points!=="number")s.sp_points=0;}
function parseSpFromXlsxText(text){
  if(text==null||text==="")return 0;
  text=String(text).trim();
  if(!text)return 0;
  if(/^\d+$/.test(text))return Math.max(0,parseInt(text,10));
  var spMap={"橙":"橙色","白":"白色","紫":"紫色","黄":"黄色","无":"无色","蓝":"蓝色","青":"青色","黑":"黑色","红":"红色","棕":"棕色","粉":"粉色","绿":"绿色","浅":"浅色","炫":"炫彩"};
  var total=0,i;
  for(i=0;i<text.length;i++){if(spMap[text.charAt(i)])total++;}
  return total;
}
function applyXpSpPickerResult(state,result){
  state.xp=result.xp;

}

function buildState(parsed) { var cells=parsed.cells; var rawVals=parsed.rawValues;
  function c(ref){return cells[ref]||"";}
  function cn(ref){var dc=cells[ref];var dn=parseInt(dc);if(!isNaN(dn)&&dn<50)return dn;var v=rawVals[ref];if(v==null||v==="")return 0;var n=parseInt(v);return isNaN(n)?0:n;}

  function findCell(text){return findCellFuzzy([text]);}
  function readRight(ref,maxCols){if(!ref)return"";var col=ref.charCodeAt(0);var row=parseInt(ref.substring(1));for(var o=1;o<=(maxCols||3);o++){var v=c(String.fromCharCode(col+o)+row);if(v)return v;}return"";}
  function readRightNum(ref,maxCols){if(!ref)return 0;var col=ref.charCodeAt(0);var row=parseInt(ref.substring(1));for(var o=1;o<=(maxCols||3);o++){var cr=String.fromCharCode(col+o)+row;var dc=cells[cr];var dn=parseInt(dc);if(!isNaN(dn)&&dn<50&&dn>-20)return dn;var v=rawVals[cr];if(v!=null&&v!==""){var n=parseInt(v);if(!isNaN(n)&&n<50&&n>-20)return n;}}return 0;}
  function adjVal(ref,offset){if(!ref)return"";var col=ref.charCodeAt(0);var row=parseInt(ref.substring(1));return c(String.fromCharCode(col+offset)+row);}

function getSkillStyle(name, cls){

  var s=SKILL_STYLE[cls+"\t"+name];
  if(s)return s;
  // Fallback: search across all classes
  for(var k in SKILL_STYLE){

  }

}

function autoCalcStyles(state){
  // Preserve styles from xlsx E column: skip if valid non-label styles
  for(var pi=0;pi<state.classes.length;pi++){
    var cs=state.classes[pi];
    if(cs.name&&cs.styles&&cs.styles[0]&&cs.styles[0]!=="通用"&&cs.styles[0]!=="风格"&&cs.styles[0]!=="风格名")return;
  }
  var sc={};
  for(var i=0;i<state.skills.length;i++){
    var s=state.skills[i];if(!s.src||s.src==="通用")continue;
    // Skip starting features (they're in _SKILL_LOOKUP_START)
    if(_SKILL_LOOKUP_START[s.n])continue;
    var ci=(s.sub&&s.sub!=="")?1:0;
    var st=getSkillStyle(s.n,s.sub||s.src);
    if(!st)continue;
    if(!sc[ci])sc[ci]={};if(!sc[ci][st])sc[ci][st]=0;sc[ci][st]++;
  }
  // Count styles from talent tree
  for(var i=0;i<state.talent_tree.length;i++){
    var t=state.talent_tree[i];if(!t||!t.n||t.cls==="通用")continue;
    var tci=(t.sub&&t.sub!=="")?1:0;
    var tStyle=getSkillStyle(t.n,t.sub||t.cls||state.classes[0].name);
    if(!tStyle)continue;
    if(!sc[tci])sc[tci]={};if(!sc[tci][tStyle])sc[tci][tStyle]=0;sc[tci][tStyle]++;
  }
  for(var ci=0;ci<state.classes.length;ci++){
    if(sc[ci]){
      var st=Object.keys(sc[ci]).sort(function(a,b){return sc[ci][b]-sc[ci][a]}).filter(function(s){return s!=="通用";});
      for(var i=0;i<4;i++)state.classes[ci].styles[i]=st[i]||"";
    }
  }
}

function charNameExists(charName) {
  if (!charName) return false;
  for (var i = 1; i <= 3; i++) {
    if (localStorage.getItem("char_" + charName + "_slot" + i)) return true;
  }
  return false;
}
function allocateUniqueCharId(desired) {
  if (!desired) desired = "未命名角色";
  if (!charNameExists(desired)) return desired;
  var n = 2;
  while (charNameExists(desired + "_" + n)) n++;
  return desired + "_" + n;
}

function confirmImport() {
  if (!pendingState) return;
  ensureSpStateOn(pendingState);
  delete pendingState.sp;
  var displayName = pendingState.name || "未命名角色";
  pendingState.name = displayName;
  var storageId = allocateUniqueCharId(displayName);
  pendingState._charName = storageId;
  pendingState._savedAt = new Date().toISOString();
  pendingState._chargenOrigin = "upload";
  delete pendingState._creationSnapshot;
  var key = "char_" + storageId + "_slot1";
  var toSave = pendingState;
  try {
    var clone = JSON.parse(JSON.stringify(pendingState, function (k, v) {
      if (k === "_uploadedXlsxBuf") return undefined;
      return v;
    }));
    toSave = clone;
  } catch (_e) {}
  toSave._chargenOrigin = "upload";
  delete toSave._creationSnapshot;
  try {
    localStorage.setItem(key, JSON.stringify(toSave));
  } catch (e) {
    SD_alert("保存失败：" + (e.message || e));
    return;
  }
  var msg = "✅ 成功导入！角色名：" + displayName + "（存档槽 1）";
  if (storageId !== displayName) msg = "✅ 成功导入！角色名：" + displayName + "，存档为「" + storageId + "」（存档槽 1）";
  document.getElementById("successMsg").textContent = msg;
  document.getElementById("successMsg").style.display = "block";
  document.getElementById("previewPanel").style.display = "none";
  setTimeout(function(){ location.href = "角色选择页.html"; }, 1500);
}
