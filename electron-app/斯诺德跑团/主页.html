<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冒险者手册 · 斯诺德跑团</title>
<style>
  /* 页面外壳与柜台/木牌样式由 guild-ui.css 提供（body.gui-page） */
  .holder { padding: 4px 0; }
</style>
</head>
<body>
<div class="gui-wrap">
  <div class="gui-hero">
    <h1>冒险者手册</h1>
    <p>管理你的角色与冒险旅程</p>
  </div>

  <section class="gui-counter">
    <div class="top">
      <div class="gui-sec-head"><span class="t">柜台 · 角色事务</span><span class="m">选择一项开始</span><span class="line"></span></div>
      <div class="gui-planks">
        <a class="gui-plank" href="角色选择页.html">
          <svg class="face" viewBox="0 0 400 100" preserveAspectRatio="none"><use href="#gui-plaque"/></svg>
          <svg class="pico" viewBox="0 0 24 24"><use href="#i-character"/></svg>
          <span class="inner"><span class="txt"><span class="n">选择已有角色</span><span class="d">从已有的角色存档中选择并继续冒险</span></span></span>
          <svg class="go" viewBox="0 0 26 26"><use href="#gui-go"/></svg>
        </a>
        <a class="gui-plank" href="角色创建页.html">
          <svg class="face" viewBox="0 0 400 100" preserveAspectRatio="none"><use href="#gui-plaque"/></svg>
          <svg class="pico" viewBox="0 0 24 24"><use href="#i-create"/></svg>
          <span class="inner"><span class="txt"><span class="n">创建新角色</span><span class="d">创建一位全新的冒险者，开始新的旅程</span></span></span>
          <svg class="go" viewBox="0 0 26 26"><use href="#gui-go"/></svg>
        </a>
        <a class="gui-plank" href="上传角色.html">
          <svg class="face" viewBox="0 0 400 100" preserveAspectRatio="none"><use href="#gui-plaque"/></svg>
          <svg class="pico" viewBox="0 0 24 24"><use href="#i-upload"/></svg>
          <span class="inner"><span class="txt"><span class="n">上传已有角色</span><span class="d">通过冒险者角色档案表格导入角色</span></span></span>
          <svg class="go" viewBox="0 0 26 26"><use href="#gui-go"/></svg>
        </a>
        <a class="gui-plank" href="资料库.html">
          <svg class="face" viewBox="0 0 400 100" preserveAspectRatio="none"><use href="#gui-plaque"/></svg>
          <svg class="pico" viewBox="0 0 24 24"><use href="#i-library"/></svg>
          <span class="inner"><span class="txt"><span class="n">资料库</span><span class="d">创建流程、个性与背景规则、物资大全与基础规则</span></span></span>
          <svg class="go" viewBox="0 0 26 26"><use href="#gui-go"/></svg>
        </a>
      </div>
      <div class="rail"></div>
    </div>
  </section>

  <div class="gui-foot">斯诺德规则 · 角色管理工具</div>
</div>
<script src="snd.js"></script>
<script src="shortcuts.js"></script>
<script>window.__guiBeam = "角色管理"; window.__guiSkin = true;</script>
<script src="guild-ui.js"></script>
</body>
</html>
