<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>物资大全 - 斯诺德资料库</title>
<style>
  :root{--ink:#1f2522;--muted:#69706b;--paper:#fbf8f1;--soft:#f1ebdf;--bg:#f6f4ef;--line:#d8d2c4;--accent:#a46d1f;--good:#4caf50;--row:#fbf8f1;--row-alt:#f3eee3}
  html.dark{--ink:#e8e6e3;--muted:#9d9b98;--paper:#24272b;--soft:#2b2f33;--bg:#1a1d20;--line:#3a3d40;--accent:#d4a54a;--good:#7ec87b;--row:#24272b;--row-alt:#2b2f33}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
  a.back{color:var(--accent);text-decoration:none;font-size:14px}
  h1{margin:10px 0 4px;font-size:26px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
  .toolbar input{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--paper);color:var(--ink)}
  .toolbar label{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .tab{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;font-size:13px}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .meta{color:var(--muted);font-size:13px;margin:8px 0}
  .tableBox{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:74vh}
  table{border-collapse:collapse;width:100%;min-width:900px;table-layout:fixed}
  th,td{border:1px solid var(--line);padding:7px 9px;font-size:13px;vertical-align:top;text-align:left;line-height:1.6;word-break:break-word;white-space:pre-wrap}
  th{background:var(--soft);color:var(--accent);position:sticky;top:0;z-index:2;white-space:nowrap;font-size:13px}
  tr:nth-child(even) td{background:var(--row-alt)}
  tr.groupMain td{background:var(--soft);color:var(--accent);font-weight:bold;font-size:13px;letter-spacing:.5px;position:sticky;top:33px;z-index:1;white-space:nowrap}
  tr.groupSub td{background:var(--row-alt);color:var(--accent);font-weight:bold;font-size:12.5px;white-space:nowrap}
  td.name{font-weight:bold}
  td.desc{color:var(--ink)}
  td.desc .none{color:var(--muted);font-size:12px}
  .q-chip{display:inline-block;padding:1px 6px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:12px;color:var(--accent)}
  .plabel{color:var(--muted);font-size:12px}
  .price2{color:var(--muted);font-size:12px}
  .cap{color:var(--muted);font-size:12px}
  .extra{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .empty{padding:24px;color:var(--muted);text-align:center}
  @media(max-width:760px){.tableBox{max-height:none}table{min-width:720px}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="资料库.html">← 返回资料库</a>
  <h1>📦 斯诺德物资大全</h1>
  <div class="sub">来自《斯诺德物资大全.xlsx》的完整表格视图：名称 / 小类 / 效果与简介 / 价格 / 载重与负重 / 品质，按原文件的分组与小分类排列。</div>
  <div class="toolbar">
    <input id="q" placeholder="搜索物品名称、小类、效果简介、价格、载重、品质…">
    <label><input type="checkbox" id="onlyDesc"> 只看有详细效果</label>
    <span class="meta" id="count"></span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="tableBox">
    <table id="tbl">
      <thead><tr>
        <th style="width:15%">名称</th>
        <th style="width:10%">小类</th>
        <th style="width:39%">效果 / 简介</th>
        <th style="width:14%">价格</th>
        <th style="width:14%">载重 / 负重</th>
        <th style="width:8%">品质</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">没有匹配的物品</div>
  </div>
</div>
<script src="store_data.js"></script>
<script>
var _cat = '全部';
var GROUP_ORDER = {};
var SUB_ORDER = {};
(function(){
  var gi = 0;
  for (var g in STORE_DATA) {
    if (!STORE_DATA.hasOwnProperty(g)) continue;
    GROUP_ORDER[g] = gi++;
    SUB_ORDER[g] = {};
    var arr = STORE_DATA[g] || [];
    var si = 0;
    for (var i = 0; i < arr.length; i++) {
      var c = (arr[i] && arr[i].cat) || '其他';
      if (SUB_ORDER[g][c] == null) SUB_ORDER[g][c] = si++;
    }
  }
})();
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function priceText(it){
  var h = esc(it.price||'');
  if(it.priceLabel && it.priceLabel!=='售价') h += '<span class="plabel"> / '+esc(it.priceLabel)+'</span>';
  if(it.price2) h += ' <span class="price2">· '+esc(it.price2)+(it.price2Label?(' '+esc(it.price2Label)):'')+'</span>';
  return h || '—';
}
function weightText(it){
  var h = esc(it.weight||'');
  if(it.cap) h += (h?' ':'') + '<span class="cap">（负重 '+esc(it.cap)+'）</span>';
  return h || '—';
}
function descText(it){
  var h = '';
  if(it.desc) h += esc(it.desc);
  if(it.extra && it.extra.length){
    for(var i=0;i<it.extra.length;i++){
      var pair = it.extra[i] || [];
      h += (h?'\n':'') + esc(pair[0]||'') + '：' + esc(pair[1]||'');
    }
  }
  if(!h) h = '<span class="none">（原文件未提供效果说明）</span>';
  return h;
}
function itemHay(it){
  var parts = [it.name, it.cat, it.group, it.price, it.weight, it.cap, it.desc, it.quality, it.priceLabel, it.price2, it.price2Label];
  if(it.extra) for(var i=0;i<it.extra.length;i++){ parts.push((it.extra[i]||[])[0]); parts.push((it.extra[i]||[])[1]); }
  return parts.join(' ').toLowerCase();
}
function allItems(){
  var out=[];
  for(var cat in STORE_DATA){
    if(!STORE_DATA.hasOwnProperty(cat))continue;
    var arr=STORE_DATA[cat]||[];
    for(var i=0;i<arr.length;i++){
      var it=arr[i]||{};
      var sub=it.cat||'其他';
      out.push({
        name:it.name||'', cat:sub, price:it.price||'', priceLabel:it.priceLabel||'', price2:it.price2||'',
        price2Label:it.price2Label||'', weight:it.weight||'', cap:it.cap||'', desc:it.desc||'',
        quality:it.quality||'', extra:it.extra||null,
        group:cat, groupIdx:GROUP_ORDER[cat]||0,
        subIdx:(SUB_ORDER[cat]&&SUB_ORDER[cat][sub]!=null?SUB_ORDER[cat][sub]:999)
      });
    }
  }
  return out;
}
var ALL = allItems();
function renderTabs(){
  var cats=['全部'].concat(Object.keys(STORE_DATA));
  var h='';
  for(var i=0;i<cats.length;i++){
    h+='<div class="tab'+(cats[i]===_cat?' active':'')+'" data-cat="'+esc(cats[i])+'">'+esc(cats[i])+'</div>';
  }
  document.getElementById('tabs').innerHTML=h;
  var tabs=document.querySelectorAll('#tabs .tab');
  for(var j=0;j<tabs.length;j++){
    tabs[j].onclick=function(){_cat=this.getAttribute('data-cat');renderTabs();renderTable();};
  }
}
function rowHtml(it){
  return '<tr><td class="name">'+esc(it.name)+'</td>'
    +'<td>'+esc(it.cat)+'</td>'
    +'<td class="desc">'+descText(it)+'</td>'
    +'<td>'+priceText(it)+'</td>'
    +'<td>'+weightText(it)+'</td>'
    +'<td>'+(it.quality?('<span class="q-chip">'+esc(it.quality)+'</span>'):'—')+'</td></tr>';
}
function renderTable(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var onlyDesc=document.getElementById('onlyDesc').checked;
  var rows=[];
  for(var i=0;i<ALL.length;i++){
    var it=ALL[i];
    if(_cat!=='全部'&&it.group!==_cat)continue;
    if(onlyDesc&&!it.desc&&!(it.extra&&it.extra.length))continue;
    if(q && itemHay(it).indexOf(q)<0)continue;
    rows.push(it);
  }
  rows.sort(function(a,b){
    if(a.groupIdx!==b.groupIdx)return a.groupIdx-b.groupIdx;
    if(a.subIdx!==b.subIdx)return a.subIdx-b.subIdx;
    return 0;
  });
  var h='';
  if(_cat==='全部'){
    var lastGroup='', lastSub='';
    for(var r=0;r<rows.length;r++){
      var it=rows[r];
      if(it.group!==lastGroup){
        h+='<tr class="groupMain"><td colspan="6">▣ '+esc(it.group)+'</td></tr>';
        lastGroup=it.group; lastSub='';
      }
      if(it.cat!==lastSub){
        h+='<tr class="groupSub"><td colspan="6">　· '+esc(it.cat)+'</td></tr>';
        lastSub=it.cat;
      }
      h+=rowHtml(it);
    }
  } else {
    var lastSub2='';
    for(var r2=0;r2<rows.length;r2++){
      var it2=rows[r2];
      if(it2.cat!==lastSub2){
        h+='<tr class="groupSub"><td colspan="6">▸ '+esc(it2.cat)+'</td></tr>';
        lastSub2=it2.cat;
      }
      h+=rowHtml(it2);
    }
  }
  document.getElementById('tbody').innerHTML=h;
  document.getElementById('empty').style.display=rows.length?'none':'block';
  var totalDesc=0;
  for(var k=0;k<rows.length;k++) if(rows[k].desc) totalDesc++;
  document.getElementById('count').textContent = '共 '+rows.length+' 项'+(totalDesc?('，其中 '+totalDesc+' 项含详细效果'):'');
}
document.getElementById('q').addEventListener('input',renderTable);
document.getElementById('onlyDesc').addEventListener('change',renderTable);
renderTabs();
renderTable();
</script>
</body>
</html>
