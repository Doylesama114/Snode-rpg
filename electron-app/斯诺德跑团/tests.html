<script>
var results = [];
var passes = 0, fails = 0;

function assert(actual, expected, testName) {
  var pass = JSON.stringify(actual) === JSON.stringify(expected);
  if (pass) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual)); }
}

function assertClose(actual, expected, testName) {
  var pass = typeof actual === 'number' && typeof expected === 'number' && Math.abs(actual - expected) < 0.01;
  if (pass) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected ' + expected + ', got ' + actual); }
}

function assertTrue(actual, testName) {
  if (actual) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName); }
}

function assertFalse(actual, testName) {
  if (!actual) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected falsy, got ' + actual); }
}

// =================== T1: calcMod (pure) ===================
results.push('<div class="section"><h3>T1: calcMod — 属性调整值</h3>');
assert(calcMod(10), 0, 'calcMod(10) → 0');
assert(calcMod(8), -1, 'calcMod(8) → -1');
assert(calcMod(12), 1, 'calcMod(12) → +1');
assert(calcMod(9), -1, 'calcMod(9) → -1 (floor向下取整)');
assert(calcMod(20), 5, 'calcMod(20) → +5');
assert(calcMod(30), 10, 'calcMod(30) → +10');
assert(calcMod(7), -2, 'calcMod(7) → -2');
results.push('</div>');

// =================== T2: parseSkillCost (pure) ===================
results.push('<div class="section"><h3>T2: parseSkillCost — 技能点消耗解析</h3>');

assert(parseSkillCost(singleCost), [
  { colorName: "红色", colorHex: "#FF0000" },
  { colorName: "红色", colorHex: "#FF0000" }
], '单色×2 → [{红色,红色}]');

var arrayCost = { cost: [{ color: "#FF0000", count: 1 }, { color: "#00B0F0", count: 1 }] };
var ac = parseSkillCost(arrayCost);
assert(ac.length, 2, '双色数组长度=2');
assert(ac[0].colorName, "红色", '双色[0]名称为红色');
assert(ac[1].colorHex, "#00B0F0", '双色[1]hex为#00B0F0');

assert(parseSkillCost({}), [], '无cost → 空数组');
assert(parseSkillCost({ cost: null }), [], 'cost=null → 空数组');
assert(parseSkillCost({ cost: { color: "#595959" } }).length, 1, '无count默认count=1');
results.push('</div>');

// =================== T3: calcTotalHP ===================
results.push('<div class="section"><h3>T3: calcTotalHP — 生命值计算</h3>');

// 蛮斗士: first=12, level_up=5
// 人类: hp_bonus=2
// 战士(sub): level_up=4
// 恶棍(bg): hp_bonus="+1" (string!)

// con=14 → calcMod=2
var hp1 = calcTotalHP("蛮斗士", 1, "", 0, 14, "", "", 0);
assertClose(hp1, 14, '蛮斗士L1 con=14 → 12+2=14');

var hp2 = calcTotalHP("蛮斗士", 1, "", 0, 14, "人类", "", 0);
assertClose(hp2, 16, '蛮斗士L1 con=14 race=人类(hp+2) → 12+2+2=16');

// 蛮斗士 L3, con=14: 12 + 2 + 5*(3-1) + 2*(3-1) = 12+2+10+4 = 28
var hp3 = calcTotalHP("蛮斗士", 3, "", 0, 14, "", "", 0);
assertClose(hp3, 28, '蛮斗士L3 con=14 → 12+2+5*2+2*2=28');

// 背景hp_bonus为字符串"+1"
var hp4 = calcTotalHP("蛮斗士", 1, "", 0, 10, "人类", "恶棍", 0);
// 12 + 0 + 2 + 1 = 15
assertClose(hp4, 15, '背景hp_bonus字符串"+1"被parseInt → 12+2+1=15');

// Multi-class: 蛮斗士L3 + 战士L2, con=14
var hp5 = calcTotalHP("蛮斗士", 3, "战士", 2, 14, "", "", 0);
// main: 12+2+5*2+2*2 = 28
// sub: (4+2)*(2-1) = 6
// total = 34
assertClose(hp5, 34, '蛮斗士L3+战士L2 con=14 → 28+6=34');

// Flat bonus
var hp6 = calcTotalHP("蛮斗士", 1, "", 0, 10, "", "", 5);
assertClose(hp6, 17, 'fb=5 → 12+5=17');

// Sub-class level 0 adds no HP
var hp7 = calcTotalHP("蛮斗士", 3, "战士", 0, 14, "", "", 0);
assertClose(hp7, 28, '战士L0不增加HP → 28');

// Non-existent class returns 0
var hp8 = calcTotalHP("", 0, "", 0, 10, "", "", 0);
assertClose(hp8, 0, '空职业 → 0');

results.push('</div>');

// =================== T4: calcTotalFP ===================

// 蛮斗士: fp first=8, level_up=1

assertClose(fp1, 8, '蛮斗士L1 kv=10 → 8');

var fp2 = calcTotalFP("蛮斗士", 1, "", 0, "力量", 14, "", 0);
// 8 + 2 + 0 = 10
assertClose(fp2, 10, '蛮斗士L1 kv=14 → 8+2=10');

// GOTCHA: ka参数传入但不使用——只用kv
var fp3 = calcTotalFP("蛮斗士", 1, "", 0, 999, 14, "", 0);

// 人类 fp_bonus = 0
var fp4 = calcTotalFP("蛮斗士", 1, "", 0, "力量", 14, "人类", 0);

// Multi-class
var fp5 = calcTotalFP("蛮斗士", 3, "战士", 2, "力量", 14, "", 0);

// sub: 1*(2-1) = 1

assertClose(fp5, 13, '蛮斗士L3+战士L2 kv=14 → 12+1=13');

results.push('</div>');

// =================== T5: calcSkillSlots ===================

// L10 / 法师L5 / 子职L6：UI 槽位须超过旧硬编码 17/8

// =================== T5b: style src + autoCalcStyles ===================
results.push('<div class="section"><h3>T5b: 风格 src 与 autoCalcStyles</h3>');

    }

}

}
// 空串不得占第一格

state.talent_tree = [{ n: _styleSample ? _styleSample.name : "瞄准射击", cls: "猎人", tier: "一阶", sub: false }];

results.push('</div>');

// =================== T5c: 复合熟练项展示表 ===================
results.push('<div class="section"><h3>T5c: 复合熟练项（巧手/表演）</h3>');
assertTrue(!!(state.profs && state.profs["敏捷"] && state.profs["敏捷"].hasOwnProperty("巧手-开锁")), "默认 profs 含 巧手-开锁");
assertTrue(!!(state.profs && state.profs["魅力"] && state.profs["魅力"].hasOwnProperty("表演-演奏")), "默认 profs 含 表演-演奏");

results.push('</div>');

results.push('<div class="section"><h3>T5d: 升级 cap、专长熟练、通用天赋钩子</h3>');

// Cap for pending next level (4→5)
assert(getAttrCapForLevel(4), 18, 'L4 attr_cap=18');
assert(getAttrCapForLevel(5), 19, 'L5 attr_cap=19');
assert(getProfCapForLevel(4), 2, 'L4 prof_cap=2');
assert(getProfCapForLevel(5), 3, 'L5 prof_cap=3');

// migrate 运动-马术 → 运动-自定义
var _mig = {力量:{ "运动-马术":2, "运动-冲浪":1, "运动-跳跃":0 }};
migrateProfKeys(_mig);

var _r1 = resolveProfTarget("隐匿");
