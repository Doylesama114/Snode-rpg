<!DOCTYPE html>

<style>
/* Char list page specific */
.char-card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.char-card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.char-card { animation: fadeInUp 0.4s ease-out both; }
.char-card:nth-child(2) { animation-delay: 0.08s; }
.char-card:nth-child(3) { animation-delay: 0.16s; }
.char-card:nth-child(4) { animation-delay: 0.24s; }
.char-card:nth-child(5) { animation-delay: 0.32s; }
.char-name {
  font-size: 20px;
  font-weight: bold;
  color: #1f2522;
  margin-bottom: 6px;
}
.char-info {
  font-size: 13px;
  color: #69706b;
  line-height: 1.6;
}
.empty-msg {
  text-align: center;
  padding: 60px 20px;
  color: #69706b;
  font-size: 15px;
}
/* Slot page specific */
.slot-card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.slot-card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.slot-card.empty {
  opacity: 0.5;
  border-style: dashed;
}
.slot-card.empty:hover {
  opacity: 0.8;
}
.slot-title {
  font-size: 16px;
  font-weight: bold;
  color: #1f2522;
  margin-bottom: 4px;
}
.slot-time {
  font-size: 12px;
  color: #69706b;
  margin-bottom: 6px;
}
.slot-summary {
  font-size: 13px;
  color: #69706b;
}
.slot-empty-text {
  font-size: 13px;
  color: #69706b;
  font-style: italic;
}
.char-subtitle {
  font-size: 14px;
  color: #69706b;
  margin-bottom: 20px;
}
.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #69706b;
  text-align: center;
}
@media (max-width:860px) {
  body { padding: 20px; }
}
@media (max-width:600px) {
  body { padding: 16px; }
  h1 { font-size: 22px; }
  .card { padding: 14px 16px; gap: 12px; }
  .card-text h2 { font-size: 16px; }
  .card-text p { font-size: 12px; }
}
@media (max-width:480px) {
  body { padding: 12px; }
  h1 { font-size: 20px; }
  .subtitle { font-size: 12px; }
  .card { padding: 12px 14px; }
}
@media (prefers-color-scheme:dark) { .char-card{background:#24272b;border-color:#3a3d40;box-shadow:0 4px 12px rgba(0,0,0,.2)} .char-card:hover{background:#1a1d20;border-color:#d4a54a;box-shadow:0 6px 20px rgba(0,0,0,.3)} .char-name,.slot-title{color:#e8e6e3} .char-info,.empty-msg,.slot-time,.slot-summary,.slot-empty-text,.footer{color:#9d9b98} .slot-card{background:#24272b;border-color:#3a3d40;box-shadow:0 4px 12px rgba(0,0,0,.2)} .slot-card:hover{background:#1a1d20;border-color:#d4a54a} .slot-card.empty{opacity:.6} .slot-card.empty:hover{opacity:.9} .char-subtitle{color:#9d9b98} }html.dark .char-card{background:#24272b;border-color:#3a3d40;box-shadow:0 4px 12px rgba(0,0,0,.2)}html.dark .char-card:hover{background:#1a1d20;border-color:#d4a54a;box-shadow:0 6px 20px rgba(0,0,0,.3)}html.dark .char-name,html.dark .slot-title{color:#e8e6e3}html.dark .char-info,html.dark .empty-msg,html.dark .slot-time,html.dark .slot-summary,html.dark .slot-empty-text,html.dark .footer{color:#9d9b98}html.dark .slot-card{background:#24272b;border-color:#3a3d40;box-shadow:0 4px 12px rgba(0,0,0,.2)}html.dark .slot-card:hover{background:#1a1d20;border-color:#d4a54a}html.dark .slot-card.empty{opacity:.6}html.dark .slot-card.empty:hover{opacity:.9}html.dark .char-subtitle{color:#9d9b98} 

/* ---------- 工会风格覆盖层（通用，CSS-only） ---------- */
body { background-color:#d0a97a !important;
  background-image: radial-gradient(1200px 460px at 50% -6%, rgba(255,240,205,.6), transparent 72%),
    repeating-linear-gradient(90deg, rgba(96,64,26,.055) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 5px, transparent 5px 26px),
    repeating-linear-gradient(0deg, rgba(88,58,22,.09) 0 1px, transparent 1px 172px),
    linear-gradient(180deg, rgba(255,255,255,.22), rgba(120,80,30,.12)) !important;
  background-attachment: scroll !important; color:#2f2317 !important; min-height:100vh; }
h1 { font-family: Georgia, "Songti SC", "SimSun", serif !important; color:#3a2a13 !important;
  letter-spacing:.06em; text-shadow: 0 1px 0 rgba(255,246,224,.75); }
h2, h3 { color:#43301a !important; }
p, .subtitle, .lead, .hint { color:#5b411f !important; }
.card, .panel, .box, .section, .item {
  background: linear-gradient(180deg,#fdf8ec,#f3e9d4) !important;

.card:hover, .item:hover { border-color:#a8802f !important; }
.btn, button.btn, .btn-primary, a.btn, .card-btn, .action, button {
  border:1px solid #6d5223 !important; border-radius:6px !important; color:#2a1c0a !important;
  background: linear-gradient(180deg,#e6c37c,#c39a4a 60%,#a8802f) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 6px rgba(40,24,6,.3) !important;

}
.btn:hover, button:hover, .card-btn:hover { filter: brightness(1.06); }
.btn.ghost, button.ghost, .btn.secondary { background: transparent !important; color:#5b411f !important;
  border-color: rgba(120,85,35,.45) !important; box-shadow:none !important; }
input, select, textarea {
  background: linear-gradient(180deg, rgba(120,85,35,.10), rgba(255,255,255,.55)) !important;
  border: 1px solid #c9ab74 !important; color:#2f2317 !important; border-radius:6px !important;
  box-shadow: inset 0 2px 5px rgba(90,60,20,.22) !important;
}
input:focus, select:focus, textarea:focus { outline:none !important; border-color:#a8802f !important;
  box-shadow: inset 0 1px 2px rgba(90,60,20,.2), 0 0 0 3px rgba(200,162,90,.3) !important; }
table { border-color:#c9ab74 !important; }
table th { background: linear-gradient(180deg,#e6c37c,#c39a4a 70%,#a8802f) !important; color:#2a1c0a !important;
  border-color:#6d5223 !important; font-weight:800 !important; }
table td { border-color: rgba(120,85,35,.22) !important; color:#43301a !important; }
table tbody tr:nth-child(even) { background: rgba(120,85,35,.07) !important; }
table tbody tr:hover { background: rgba(200,162,90,.2) !important; }
.chip, .tag, .badge, .pill { background: linear-gradient(180deg,#f6ecd3,#eadfc0) !important;
  border:1px solid #c9ab74 !important; color:#5b411f !important; border-radius:4px !important; }
a { color:#7a4a12; }
a:hover { color:#a8802f; }
html.dark body { background-color:#2a2018 !important;
  background-image: radial-gradient(1000px 400px at 50% -6%, rgba(120,90,50,.35), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, rgba(255,225,180,.06), rgba(0,0,0,.35)) !important; color:#e8dcc4 !important; }
html.dark h1, html.dark h2, html.dark h3 { color:#f0e6d2 !important; }
html.dark .card, html.dark .panel, html.dark .box, html.dark .section, html.dark .item {
  background: linear-gradient(180deg,#453d2f,#3a3327) !important; border-color:#5a4a35 !important; color:#e8e0cc !important; }
html.dark table td { color:#e8e0cc !important; border-color: rgba(220,190,140,.18) !important; }
</style>

<body>
<div class="container">
  <a class="back-link" href="角色选择页.html">← 返回角色列表</a>
  <h1>📂 选择存档</h1>
  <div class="char-subtitle" id="charNameDisplay"></div>
  <div id="slotList"></div>
</div>

<script>
function getCharName() {
  var params = new URLSearchParams(window.location.search);
  return params.get("char") || "";
}

function getSlotSummary(data) {
  var cls = "";
  if (data.classes) {
    for (var ci = 0; ci < data.classes.length; ci++) {
      var c = data.classes[ci];
      if (c && c.name && c.level > 0) {
        cls += (cls ? " / " : "") + c.name + " " + c.level + "级";
      }
    }
  }
  var hp = data.hp || "?";
  var fp = data.fp || "?";
  return cls + " | HP: " + hp + " FP: " + fp;
}

function renderSlots() {
  var charName = getCharName();
  document.getElementById("charNameDisplay").textContent = charName;

  var html = "";
  for (var si = 1; si <= 3; si++) {
    var key = "char_" + charName + "_slot" + si;
    var raw = localStorage.getItem(key);
    var isEmpty = !raw;
    var savedAt = "";
    var summary = "";

    if (!isEmpty) {
      try {
        var data = JSON.parse(raw);
        savedAt = data._savedAt ? new Date(data._savedAt).toLocaleString() : "未知";
        summary = getSlotSummary(data);
      } catch(e) {
        savedAt = "存档损坏";
        summary = "";
      }
    }

    var cls = "slot-card" + (isEmpty ? " empty" : "");
    html += "<div class='" + cls + "' onclick='openSlot(" + si + ")'>";
    html += "<div class='slot-title'>存档位 " + si;
    if (!isEmpty) html += " <span onclick=\"event.stopPropagation();deleteSlot(" + si + ")\" style=\"float:right;cursor:pointer;color:#c04040;font-size:14px\" title=\"删除此存档\">🗑</span>";
    html += "</div>";
    if (isEmpty) {
      html += "<div class='slot-empty-text'>📂 空存档位 — 点击创建新存档</div>";
    } else {
      html += "<div class='slot-time'>" + savedAt + "</div>";
      html += "<div class='slot-summary'>" + summary + "</div>";
    }
    html += "</div>";
  }
  document.getElementById("slotList").innerHTML = html;
}

function deleteSlot(slotIndex) {
  var charName = getCharName();
  SD_confirm("确定要删除「" + charName + "」存档位 " + slotIndex + " 吗？此操作不可恢复。", function() {
    localStorage.removeItem("char_" + charName + "_slot" + slotIndex);
    renderSlots();
  });
}

function openSlot(slotIndex) {
  var charName = getCharName();
  if (!charName) {
    SD_alert("未指定角色");
    return;
  }
  // Check if slot has data
  var key = "char_" + charName + "_slot" + slotIndex;
  var raw = localStorage.getItem(key);
  if (!raw) {
    SD_alert("该存档位为空，请先在角色面板中保存角色到此位置");
    return;
  }
  // Navigate to character panel with char and slot params
  window.location.href = "角色面板.html?char=" + encodeURIComponent(charName) + "&slot=" + slotIndex;
}

renderSlots();
</script>
