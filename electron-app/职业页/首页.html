    <style>
    body { background: var(--bg); }
    .home-container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 28px; text-align: center; margin-bottom: 4px; color: var(--ink); }
    .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .back-link {
        display: inline-block; color: var(--muted); font-size: 14px;
        text-decoration: none; margin-bottom: 16px; cursor: pointer;
    }
    .back-link:hover { color: var(--green); }

    .section-title {
        font-size: 16px; font-weight: 700; color: var(--ink);
        margin: 32px 0 12px; padding-left: 2px;
    }
    
    .btn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
        max-width: 100%;
    }
    .btn-grid.two-col { grid-template-columns: repeat(2, 1fr); max-width: 272px; }
    .btn-grid.three-col { grid-template-columns: repeat(3, 1fr); max-width: 404px; }
    .home-btn {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; aspect-ratio: 1 / 1;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--panel); color: var(--ink);
        text-decoration: none; font-size: 15px; font-weight: 600;
        box-shadow: 0 1px 4px rgba(31,37,34,0.03);
        transition: all 0.2s ease;
        box-sizing: border-box;
    }
    .home-btn:hover {
        border-color: var(--green); color: var(--green);
        box-shadow: 0 0 0 3px rgba(47,111,94,0.12);
        transform: translateY(-1px);
    }
    .home-btn .btn-icon { font-size: 26px; line-height: 1; }
    
    .footer-link { text-align: center; margin-top: 36px; font-size: 13px; }
    .footer-link a { color: var(--muted); text-decoration: none; }
    .footer-link a:hover { color: var(--green); }
    
    /* ── 悬浮搜索框 ── */
    .search-float-btn {
        position: fixed; bottom: 28px; right: 28px; z-index: 9999;
        width: 56px; height: 56px; border-radius: 50%; border: none;
        background: var(--green); color: #fff; font-size: 26px;
        cursor: pointer; box-shadow: 0 4px 20px rgba(31,37,34,0.25);
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex; align-items: center; justify-content: center;
    }
    .search-float-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(31,37,34,0.35); }
    .search-overlay {
        position: fixed; inset: 0; z-index: 9998;
        background: rgba(31,37,34,0.45); display: flex; justify-content: center;
        padding-top: 40px; overflow-y: auto;
    }
    .search-overlay.hidden { display: none; }
    .search-panel {
        background: var(--panel); border-radius: 14px; box-shadow: var(--shadow);
        width: 90%; max-width: 680px; max-height: 80vh;
        display: flex; flex-direction: column; overflow: hidden;
        margin: 0 16px 40px;
        animation: searchPanelIn 0.25s ease-out;
    }
    .search-panel-header {
        display: flex; align-items: center; gap: 10px;
        padding: 18px 20px 12px; border-bottom: 1px solid var(--line);
    }
    .search-widget-input {
        flex: 1; border: 1px solid var(--line); border-radius: 8px;
        padding: 12px 16px; font-size: 16px; font-family: inherit;
        background: var(--bg); color: var(--ink); outline: none;
    }
    .search-widget-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,111,94,0.12); }
    .search-close-btn {
        width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
        background: var(--bg); color: var(--muted); font-size: 18px;
        cursor: pointer; flex-shrink: 0; transition: all 0.15s;
        display: flex; align-items: center; justify-content: center;
    }
    .search-close-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }
    .search-status {
        padding: 24px; text-align: center; color: var(--muted); font-size: 14px;
    }
    .search-status.hidden { display: none; }
    .search-results { flex: 1; overflow-y: auto; padding: 8px 0; }
    .search-result-item {
        display: block; padding: 14px 20px; border-bottom: 1px solid var(--line);
        cursor: pointer; transition: background 0.12s; text-decoration: none; color: inherit;
    }
    .search-result-item:hover { background: var(--bg); }
    .search-result-item .result-class {
        font-size: 12px; color: var(--green); font-weight: 700; margin-bottom: 3px;
    }
    .search-result-item .result-name {
        font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 2px;
    }
    .search-result-item .result-meta {
        font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }
    .search-result-item .result-meta span { margin-right: 8px; }
    .search-result-item .result-snippet {
        font-size: 13px; color: var(--ink); line-height: 1.6;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
    }
    .search-highlight {
        background: #ffdd00; color: #000 !important;
        animation: search-blink 0.8s ease-in-out 3;
    }
    @keyframes searchPanelIn {
  from { transform: scale(0.95); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
@keyframes search-blink {
        0%, 100% { background: #ffdd00; }
        50% { background: #ff8800; }
    }
    
    @media (max-width: 600px) {
        .class-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .adv-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .class-card { min-height: 80px; padding: 16px 8px; }
        .home-container { padding: 24px 12px; }
        h1 { font-size: 22px; }
        .search-float-btn { width: 48px; height: 48px; bottom: 16px; right: 16px; font-size: 22px; }
        .search-panel { max-height: 90vh; border-radius: 10px; }
        .search-panel-header { padding: 14px 14px 10px; }
        .search-widget-input { padding: 10px 12px; font-size: 15px; }
    }
</style>
</head>

<button class="search-float-btn" id="searchFloatBtn" title="搜索全部职业技能">🔍</button>
<div class="search-overlay hidden" id="searchOverlay">
  <div class="search-panel">
    <div class="search-panel-header">
      <input type="search" class="search-widget-input" id="searchWidgetInput" placeholder="搜索全部职业技能（技能名/关键词/描述）…" autocomplete="off">

<script>
(function() {
  var CLASS_FILES = [
    {name:'战士',file:'数据/战士.json'},{name:'圣骑士',file:'数据/圣骑士.json'},
    {name:'猎人',file:'数据/猎人.json'},{name:'游荡者',file:'数据/游荡者.json'},
    {name:'武僧',file:'数据/武僧.json'},{name:'法师',file:'数据/法师.json'},
    {name:'术士',file:'数据/术士.json'},{name:'牧师',file:'数据/牧师.json'},
    {name:'德鲁伊',file:'数据/德鲁伊.json'},{name:'吟游诗人',file:'数据/吟游诗人.json'},
    {name:'萨满祭司',file:'数据/萨满祭司.json'},{name:'蛮斗士',file:'数据/蛮斗士.json'},
    {name:'奇械师',file:'数据/奇械师.json'},{name:'魔契师',file:'数据/魔契师.json'}
  ];

  var searchIndex = null;
  var loading = false;
  var overlay = document.getElementById('searchOverlay');
  var input = document.getElementById('searchWidgetInput');
  var resultsDiv = document.getElementById('searchResults');
  var statusDiv = document.getElementById('searchStatus');
  var floatBtn = document.getElementById('searchFloatBtn');
  var closeBtn = document.getElementById('searchCloseBtn');
  var debounceTimer = null;

  function loadAllData() {
    if (searchIndex) return Promise.resolve(searchIndex);
    if (loading) return;
    loading = true;
    statusDiv.classList.remove('hidden');
    resultsDiv.innerHTML = '';

    return Promise.all(CLASS_FILES.map(function(c) {
      return fetch(c.file)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          return { classname: c.name, skills: data.skills || [] };
        })
        .catch(function() { return { classname: c.name, skills: [] }; });
    })).then(function(allData) {
      searchIndex = [];
      allData.forEach(function(cd) {
        cd.skills.forEach(function(s) {
          var descText = (s.description || []).join(' ').toLowerCase();
          var flavorText = (s.flavor || '').toLowerCase();
          var tags = (s.tags || []).join(' ');
          var style = s.style || '';
          var tier = (typeof s.tier === 'number' ? s.tier + '阶' : s.tier || '');
          searchIndex.push({
            classname: cd.classname,
            skillId: s.id,
            skillName: s.name,
            style: style,
            tier: tier,
            snippet: descText.substring(0, 200),
            searchText: (cd.classname + ' ' + s.name + ' ' + tags + ' ' + descText + ' ' + flavorText + ' ' + style).toLowerCase()
          });
        });
      });
      statusDiv.classList.add('hidden');
      loading = false;
      return searchIndex;
    });
  }

  function search() {
    var terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!searchIndex) return;
    
    if (terms.length === 0) { resultsDiv.innerHTML = ''; return; }
    
    var matched = searchIndex.filter(function(entry) {
      return terms.every(function(t) { return entry.searchText.indexOf(t) !== -1; });
    });
    
    renderResults(matched.slice(0, 60));
  }

  function highlightText(text, terms) {
    if (!terms || terms.length === 0) return text;
    var result = text;
    terms.forEach(function(t) {
      if (!t) return;
      var escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      var regex = new RegExp('(' + escaped + ')', 'gi');
      result = result.replace(regex, '<span class="search-highlight">$1</span>');
    });
    return result;
  }

  function renderResults(items) {
    if (items.length === 0) {
      resultsDiv.innerHTML = '<div class="search-status">没有找到匹配的技能</div>';
      return;
    }
    var terms = input.value.trim().split(/\s+/).filter(Boolean);
    resultsDiv.innerHTML = items.map(function(it) {
      var hlName = highlightText(it.skillName, terms);
      var hlSnippet = highlightText(it.snippet, terms);
      var hlStyle = highlightText(it.style, terms);
      return '<a class="search-result-item" href="' + it.classname + '.html#' + it.skillId + '">' +
        '<div class="result-class">' + it.classname + '</div>' +
        '<div class="result-name">' + hlName + '</div>' +
        '<div class="result-meta"><span>' + hlStyle + '</span><span>' + it.tier + '</span></div>' +
        '<div class="result-snippet">' + hlSnippet + '</div>' +
      '</a>';
    }).join('');
  }

  function openOverlay() {
    overlay.classList.remove('hidden');
    var panel = overlay.querySelector('.search-panel');
    if (panel) {
        panel.style.animation = 'none';
        panel.offsetHeight;
        panel.style.animation = '';
    }
    input.focus();
    loadAllData();
  }

  function closeOverlay() {
    overlay.classList.add('hidden');
    input.value = '';
    resultsDiv.innerHTML = '';
  }

  floatBtn.addEventListener('click', openOverlay);
  closeBtn.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeOverlay(); });

  input.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(search, 250);
  });
})();
</script>
<script src="common_tooltip.js"></script>
</body>
