<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>斯诺德全职业技能树 · 首页</title>
    <link rel="stylesheet" href="common.css"/>
    <script src="common.js"></script>
    <style>
    body { background: var(--bg); }
    .home-container { max-width: 800px; margin: 0 auto; padding: 40px 24px; }
    h1 { font-size: 28px; text-align: center; margin-bottom: 4px; color: var(--ink); }
    .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .back-link {
        display: inline-block; color: var(--muted); font-size: 14px;
        text-decoration: none; margin-bottom: 16px; cursor: pointer;
    }
    .back-link:hover { color: var(--green); }

    .section-title {
        font-size: 16px; font-weight: 700; color: var(--ink);
        margin: 32px 0 12px; padding-left: 2px;
    }
    
    .btn-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 12px;
        max-width: 100%;
    }
    .btn-grid.two-col { grid-template-columns: repeat(2, 1fr); max-width: 272px; }
    .btn-grid.three-col { grid-template-columns: repeat(3, 1fr); max-width: 404px; }
    .home-btn {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 8px; aspect-ratio: 1 / 1;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--panel); color: var(--ink);
        text-decoration: none; font-size: 15px; font-weight: 600;
        box-shadow: 0 1px 4px rgba(31,37,34,0.03);
        transition: all 0.2s ease;
        box-sizing: border-box;
    }
    .home-btn:hover {
        border-color: var(--green); color: var(--green);
        box-shadow: 0 0 0 3px rgba(47,111,94,0.12);
        transform: translateY(-1px);
    }
    .home-btn .btn-icon { font-size: 26px; line-height: 1; }
    
    .footer-link { text-align: center; margin-top: 36px; font-size: 13px; }
    .footer-link a { color: var(--muted); text-decoration: none; }
    .footer-link a:hover { color: var(--green); }
    
    /* ── 悬浮搜索框 ── */
    .search-float-btn {
        position: fixed; bottom: 28px; right: 28px; z-index: 9999;
        width: 56px; height: 56px; border-radius: 50%; border: none;
        background: var(--green); color: #fff; font-size: 26px;
        cursor: pointer; box-shadow: 0 4px 20px rgba(31,37,34,0.25);
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex; align-items: center; justify-content: center;
    }
    .search-float-btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(31,37,34,0.35); }
    .search-overlay {
        position: fixed; inset: 0; z-index: 9998;
        background: rgba(31,37,34,0.45); display: flex; justify-content: center;
        padding-top: 40px; overflow-y: auto;
    }
    .search-overlay.hidden { display: none; }
    .search-panel {
        background: var(--panel); border-radius: 14px; box-shadow: var(--shadow);
        width: 90%; max-width: 720px; max-height: 88vh;
        display: flex; flex-direction: column; overflow: hidden;
        margin: 0 16px 40px;
        animation: searchPanelIn 0.25s ease-out;
    }
    .search-panel-header {
        display: flex; align-items: center; gap: 10px;
        padding: 16px 18px 10px; border-bottom: 1px solid var(--line);
    }
    .search-widget-input {
        flex: 1; border: 1px solid var(--line); border-radius: 8px;
        padding: 12px 16px; font-size: 16px; font-family: inherit;
        background: var(--bg); color: var(--ink); outline: none;
    }
    .search-widget-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(47,111,94,0.12); }
    .search-close-btn {
        width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
        background: var(--bg); color: var(--muted); font-size: 18px;
        cursor: pointer; flex-shrink: 0; transition: all 0.15s;
        display: flex; align-items: center; justify-content: center;
    }
    .search-close-btn:hover { background: var(--red); color: #fff; border-color: var(--red); }
    .search-filters {
        padding: 10px 16px 8px; border-bottom: 1px solid var(--line);
        background: var(--bg); max-height: 38vh; overflow-y: auto;
    }
    .search-filter-row { margin-bottom: 8px; }
    .search-filter-row:last-child { margin-bottom: 0; }
    .search-filter-label {
        display: flex; align-items: center; justify-content: space-between;
        font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px;
    }
    .search-filter-clear {
        border: none; background: none; color: var(--green); font-size: 12px;
        cursor: pointer; padding: 0; font-family: inherit;
    }
    .search-filter-clear:hover { text-decoration: underline; }
    .search-chip-wrap, .search-color-wrap {
        display: flex; flex-wrap: wrap; gap: 6px;
    }
    .search-chip {
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600;
        cursor: pointer; font-family: inherit; line-height: 1.3;
    }
    .search-chip.active {
        border-color: var(--green); background: rgba(47,111,94,0.12); color: var(--green);
    }
    .search-color-btn {
        border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
        padding: 4px 8px; font-size: 12px; cursor: pointer; font-family: inherit;
        display: inline-flex; align-items: center; gap: 4px; color: var(--ink);
    }
    .search-color-btn.active { border-color: var(--green); box-shadow: 0 0 0 2px rgba(47,111,94,0.15); }
    .search-color-btn .gs-dot { font-size: 14px; line-height: 1; }
    .search-color-btn.light .gs-dot {
        text-shadow: -1px -1px 0 #333, 1px -1px 0 #333, -1px 1px 0 #333, 1px 1px 0 #333;
    }
    .search-summary {
        padding: 8px 16px; font-size: 12px; color: var(--muted);
        border-bottom: 1px solid var(--line); background: var(--panel);
    }
    .search-summary strong { color: var(--ink); }
    .search-status {
        padding: 24px; text-align: center; color: var(--muted); font-size: 14px;
    }
    .search-status.error { color: var(--red); }
    .search-status.hidden { display: none; }
    .search-results { flex: 1; overflow-y: auto; padding: 0 0 12px; }
    .gs-group { border-bottom: 1px solid var(--line); }
    .gs-group-head {
        width: 100%; display: flex; align-items: center; justify-content: space-between;
        padding: 10px 16px; border: none; background: var(--bg); color: var(--ink);
        font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; text-align: left;
    }
    .gs-group-head:hover { background: rgba(47,111,94,0.06); }
    .gs-group-head .gs-count { color: var(--muted); font-weight: 600; }
    .gs-group-body.collapsed { display: none; }
    .gs-row {
        display: flex; align-items: stretch; border-bottom: 1px solid var(--line);
    }
    .gs-row:last-child { border-bottom: none; }
    .gs-row-main {
        flex: 1; display: flex; align-items: center; gap: 8px;
        padding: 8px 6px 8px 16px; text-decoration: none; color: inherit; min-width: 0;
    }
    .gs-row-main:hover { background: rgba(47,111,94,0.05); }
    .gs-row-name { font-size: 14px; font-weight: 700; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .gs-row-marks { display: inline-flex; gap: 1px; flex-shrink: 0; }
    .gs-row-marks .gs-dot { font-size: 13px; line-height: 1; }
    .gs-row-meta { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; flex-shrink: 1; min-width: 0; }
    .gs-row-toggle {
        width: 36px; border: none; background: transparent; color: var(--muted);
        cursor: pointer; font-size: 12px; flex-shrink: 0;
    }
    .gs-row-toggle:hover { color: var(--green); }
    .gs-row-snippet {
        display: none; padding: 0 16px 10px 16px; font-size: 12px; color: var(--ink);
        line-height: 1.55; border-bottom: 1px solid var(--line);
    }
    .gs-row.expanded + .gs-row-snippet { display: block; }
    .gs-more {
        display: block; width: calc(100% - 32px); margin: 12px 16px 4px;
        padding: 10px; border: 1px dashed var(--line); border-radius: 8px;
        background: var(--bg); color: var(--green); font-weight: 700; font-size: 13px;
        cursor: pointer; font-family: inherit;
    }
    .gs-more:hover { border-color: var(--green); }
    .search-highlight {
        background: #ffdd00; color: #000 !important;
        animation: search-blink 0.8s ease-in-out 3;
    }
@keyframes searchPanelIn {
  from { transform: scale(0.95); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
@keyframes search-blink {
        0%, 100% { background: #ffdd00; }
        50% { background: #ff8800; }
    }
    
    @media (max-width: 600px) {
        .class-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .adv-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .class-card { min-height: 80px; padding: 16px 8px; }
        .home-container { padding: 24px 12px; }
        h1 { font-size: 22px; }
        .search-float-btn { width: 48px; height: 48px; bottom: 16px; right: 16px; font-size: 22px; }
        .search-panel { max-height: 92vh; border-radius: 10px; }
        .search-panel-header { padding: 14px 14px 10px; }
        .search-widget-input { padding: 10px 12px; font-size: 15px; }
        .search-filters { max-height: 32vh; }
        .gs-row-meta { display: none; }
    }
</style>

<script>
(function() {
  var MARK_META = [
    { hex: '#FF0000', name: '红', light: false },
    { hex: '#EE822F', name: '橙', light: false },
    { hex: '#FFF32F', name: '黄', light: true },
    { hex: '#00B050', name: '绿', light: false },
    { hex: '#00FA99', name: '青', light: true },
    { hex: '#00B0F0', name: '蓝', light: false },
    { hex: '#B3F9FF', name: '浅', light: true },
    { hex: '#B94BFF', name: '紫', light: false },
    { hex: '#FFB7E3', name: '粉', light: true },
    { hex: '#843F0B', name: '棕', light: false },
    { hex: '#FFFFFF', name: '白', light: true },
    { hex: '#595959', name: '黑', light: false },
    { hex: '#D9D9D9', name: '灰', light: true },
    { hex: '#851321', name: '暗红', light: false }
  ];
  var metaByHex = {};
  MARK_META.forEach(function(m) { metaByHex[m.hex.toUpperCase()] = m; });

  var CLASS_ORDER = [
    '战士', '圣骑士', '猎人', '游荡者', '武僧', '法师', '术士', '牧师',
    '德鲁伊', '吟游诗人', '萨满祭司', '蛮斗士', '奇械师', '魔契师',
    '通用天赋树', '特殊专长'
  ];

  var PAGE_SIZE = 80;
  var PAGE_STEP = 40;

  var searchIndex = null;
  var loadPromise = null;
  var loadError = null;
  var selectedClasses = new Set();
  var selectedColors = new Set();
  var visibleLimit = PAGE_SIZE;
  var lastMatched = [];
  var collapsedGroups = {};

  var overlay = document.getElementById('searchOverlay');
  var input = document.getElementById('searchWidgetInput');
  var resultsDiv = document.getElementById('searchResults');
  var statusDiv = document.getElementById('searchStatus');
  var summaryDiv = document.getElementById('searchSummary');
  var floatBtn = document.getElementById('searchFloatBtn');
  var closeBtn = document.getElementById('searchCloseBtn');
  var classWrap = document.getElementById('classFilterWrap');
  var colorWrap = document.getElementById('colorFilterWrap');
  var debounceTimer = null;

  function normHex(h) {
    if (!h) return '';
    h = String(h).trim().toUpperCase();
    if (h.charAt(0) !== '#') h = '#' + h;
    return h;
  }

  function canonicalizeMarkHex(h) {
    var aliases = { '#808080': '#595959', '#F79646': '#EE822F', '#FF66CC': '#FFB7E3' };
    h = normHex(h);
    return aliases[h] || h;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function highlightText(text, terms) {
    var result = escapeHtml(text || '');
    if (!terms || !terms.length) return result;
    terms.forEach(function(t) {
      if (!t) return;
      var escaped = t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      result = result.replace(new RegExp('(' + escaped + ')', 'gi'), '<span class="search-highlight">$1</span>');
    });
    return result;
  }

  function hasActiveQuery() {
    return !!(input.value.trim() || selectedClasses.size || selectedColors.size);
  }

  function loadIndex() {
    if (searchIndex) return Promise.resolve(searchIndex);
    if (loadPromise) return loadPromise;
    statusDiv.classList.remove('hidden');
    statusDiv.className = 'search-status';
    statusDiv.textContent = '加载索引中…';
    summaryDiv.classList.add('hidden');
    loadPromise = fetch('search-index.json')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(data) {
        searchIndex = data.skills || [];
        loadError = null;
        statusDiv.classList.add('hidden');
        buildFilterControls();
        return searchIndex;
      })
      .catch(function(err) {
        loadError = err;
        loadPromise = null;
        searchIndex = null;
        statusDiv.classList.remove('hidden');
        statusDiv.className = 'search-status error';
        statusDiv.textContent = '索引加载失败（请用启动台或本地 HTTP 打开）。请确认存在 search-index.json。';
        throw err;
      });
    return loadPromise;
  }

  function buildFilterControls() {
    classWrap.innerHTML = '';
    CLASS_ORDER.forEach(function(name) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-chip' + (selectedClasses.has(name) ? ' active' : '');
      btn.textContent = name;
      btn.setAttribute('data-class', name);
      btn.addEventListener('click', function() {
        if (selectedClasses.has(name)) selectedClasses.delete(name);
        else selectedClasses.add(name);
        btn.classList.toggle('active', selectedClasses.has(name));
        visibleLimit = PAGE_SIZE;
        collapsedGroups = {};
        scheduleQuery();
      });
      classWrap.appendChild(btn);
    });

    var colorSet = {};
    searchIndex.forEach(function(s) {
      (s.marks || []).forEach(function(c) {
        c = canonicalizeMarkHex(c);
        if (c) colorSet[c] = true;
      });
    });
    var colors = Object.keys(colorSet).sort(function(a, b) {
      var ia = MARK_META.findIndex(function(m) { return m.hex === a; });
      var ib = MARK_META.findIndex(function(m) { return m.hex === b; });
      if (ia < 0) ia = 999;
      if (ib < 0) ib = 999;
      return ia - ib || a.localeCompare(b);
    });
    colorWrap.innerHTML = '';
    colors.forEach(function(hex) {
      var meta = metaByHex[hex] || { hex: hex, name: hex.replace('#', ''), light: false };
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'search-color-btn' + (meta.light ? ' light' : '') + (selectedColors.has(hex) ? ' active' : '');
      btn.setAttribute('data-color', hex);
      btn.innerHTML = '<span class="gs-dot" style="color:' + hex + '">●</span><span>' + escapeHtml(meta.name) + '</span>';
      btn.addEventListener('click', function() {
        var key = canonicalizeMarkHex(hex);
        if (selectedColors.has(key)) selectedColors.delete(key);
        else selectedColors.add(key);
        btn.classList.toggle('active', selectedColors.has(key));
        visibleLimit = PAGE_SIZE;
        collapsedGroups = {};
        scheduleQuery();
      });
      colorWrap.appendChild(btn);
    });
  }

  function scoreEntry(entry, terms) {
    var name = (entry.skillName || '').toLowerCase();
    var joined = terms.join(' ');
    if (terms.length && name === joined) return 0;
    if (terms.length && terms.every(function(t) { return name.indexOf(t) !== -1; })) return 1;
    return 2;
  }

  function runQuery() {
    if (!searchIndex) return;
    if (loadError) return;

    var terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (!hasActiveQuery()) {
      summaryDiv.classList.add('hidden');
      statusDiv.classList.remove('hidden');
      statusDiv.className = 'search-status';
      statusDiv.textContent = '输入关键词，或筛选职业 / 色彩标识';
      resultsDiv.innerHTML = '';
      lastMatched = [];
      return;
    }

    var matched = searchIndex.filter(function(entry) {
      if (selectedClasses.size && !selectedClasses.has(entry.classname)) return false;
      if (selectedColors.size) {
        var marks = (entry.marks || []).map(canonicalizeMarkHex);
        var hit = false;
        selectedColors.forEach(function(c) {
          if (marks.indexOf(canonicalizeMarkHex(c)) !== -1) hit = true;
        });
        if (!hit) return false;
      }
      if (terms.length && !terms.every(function(t) { return (entry.searchText || '').indexOf(t) !== -1; })) {
        return false;
      }
      return true;
    });

    matched.sort(function(a, b) {
      var sa = scoreEntry(a, terms);
      var sb = scoreEntry(b, terms);
      if (sa !== sb) return sa - sb;
      var ca = CLASS_ORDER.indexOf(a.classname);
      var cb = CLASS_ORDER.indexOf(b.classname);
      if (ca < 0) ca = 999;
      if (cb < 0) cb = 999;
      if (ca !== cb) return ca - cb;
      return (a.skillName || '').localeCompare(b.skillName || '', 'zh');
    });

    lastMatched = matched;
    statusDiv.classList.add('hidden');
    renderSummary(matched.length);
    renderResults(matched, terms);
  }

  function renderSummary(n) {
    var parts = ['共 <strong>' + n + '</strong> 条命中'];
    if (selectedClasses.size) parts.push('职业 ' + selectedClasses.size);
    else parts.push('全部职业');
    if (selectedColors.size) parts.push('色彩 ' + selectedColors.size);
    summaryDiv.innerHTML = parts.join(' · ');
    summaryDiv.classList.remove('hidden');
  }

  function renderDots(marks) {
    return (marks || []).map(function(hex) {
      hex = canonicalizeMarkHex(hex);
      var meta = metaByHex[hex] || { light: false };
      var cls = meta.light ? 'gs-dot light' : 'gs-dot';
      var shadow = meta.light
        ? 'text-shadow:-1px -1px 0 #333,1px -1px 0 #333,-1px 1px 0 #333,1px 1px 0 #333;'
        : '';
      return '<span class="' + cls + '" style="color:' + hex + ';' + shadow + '">●</span>';
    }).join('');
  }

  function renderResults(matched, terms) {
    if (!matched.length) {
      resultsDiv.innerHTML = '<div class="search-status">没有找到匹配的技能</div>';
      return;
    }

    var limited = matched.slice(0, visibleLimit);
    var groups = [];
    var map = {};
    limited.forEach(function(it) {
      if (!map[it.classname]) {
        map[it.classname] = { name: it.classname, items: [] };
        groups.push(map[it.classname]);
      }
      map[it.classname].items.push(it);
    });

    // Full counts per class among all matches
    var fullCounts = {};
    matched.forEach(function(it) {
      fullCounts[it.classname] = (fullCounts[it.classname] || 0) + 1;
    });

    var html = '';
    groups.forEach(function(g, gi) {
      var collapsed = Object.prototype.hasOwnProperty.call(collapsedGroups, g.name)
        ? collapsedGroups[g.name]
        : gi >= 3;
      var count = fullCounts[g.name] || g.items.length;
      html += '<div class="gs-group" data-group="' + escapeHtml(g.name) + '">';
      html += '<button type="button" class="gs-group-head" data-toggle-group="' + escapeHtml(g.name) + '">';
      html += '<span>' + escapeHtml(g.name) + '</span>';
      html += '<span class="gs-count">' + count + (collapsed ? ' ▸' : ' ▾') + '</span></button>';
      html += '<div class="gs-group-body' + (collapsed ? ' collapsed' : '') + '">';
      g.items.forEach(function(it, idx) {
        var href = encodeURI(it.page || (it.classname + '.html')) + '#' + encodeURIComponent(it.skillId);
        var meta = [it.style, it.tier].filter(Boolean).join(' · ');
        var rowId = 'gs-' + gi + '-' + idx;
        html += '<div class="gs-row" data-row="' + rowId + '">';
        html += '<a class="gs-row-main" href="' + href + '">';
        html += '<span class="gs-row-name">' + highlightText(it.skillName, terms) + '</span>';
        html += '<span class="gs-row-marks">' + renderDots(it.marks) + '</span>';
        if (meta) html += '<span class="gs-row-meta">' + highlightText(meta, terms) + '</span>';
        html += '</a>';
        html += '<button type="button" class="gs-row-toggle" data-expand="' + rowId + '" title="展开摘要">▾</button>';
        html += '</div>';
        html += '<div class="gs-row-snippet" data-snippet-for="' + rowId + '">' + highlightText(it.snippet || '', terms) + '</div>';
      });
      html += '</div></div>';
    });

    if (matched.length > visibleLimit) {
      html += '<button type="button" class="gs-more" id="gsShowMore">再显示 ' +
        Math.min(PAGE_STEP, matched.length - visibleLimit) + ' 条（已显示 ' +
        limited.length + ' / ' + matched.length + '）</button>';
    }

    resultsDiv.innerHTML = html;
  }

  function scheduleQuery() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function() {
      loadIndex().then(function() { runQuery(); }).catch(function() {});
    }, 200);
  }

  function openOverlay() {
    overlay.classList.remove('hidden');
    var panel = overlay.querySelector('.search-panel');
    if (panel) {
      panel.style.animation = 'none';
      panel.offsetHeight;
      panel.style.animation = '';
    }
    input.focus();
    loadIndex().then(function() {
      if (hasActiveQuery()) runQuery();
      else {
        statusDiv.classList.remove('hidden');
        statusDiv.className = 'search-status';
        statusDiv.textContent = '输入关键词，或筛选职业 / 色彩标识';
      }
    }).catch(function() {});
  }

  function closeOverlay() {
    overlay.classList.add('hidden');
  }

  floatBtn.addEventListener('click', openOverlay);
  closeBtn.addEventListener('click', closeOverlay);
  overlay.addEventListener('click', function(e) { if (e.target === overlay) closeOverlay(); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeOverlay();
  });

  input.addEventListener('input', function() {
    visibleLimit = PAGE_SIZE;
    collapsedGroups = {};
    scheduleQuery();
  });

  document.getElementById('clearClassFilter').addEventListener('click', function() {
    selectedClasses.clear();
    classWrap.querySelectorAll('.search-chip').forEach(function(b) { b.classList.remove('active'); });
    visibleLimit = PAGE_SIZE;
    collapsedGroups = {};
    scheduleQuery();
  });
  document.getElementById('clearColorFilter').addEventListener('click', function() {
    selectedColors.clear();
    colorWrap.querySelectorAll('.search-color-btn').forEach(function(b) { b.classList.remove('active'); });
    visibleLimit = PAGE_SIZE;
    collapsedGroups = {};
    scheduleQuery();
  });

  resultsDiv.addEventListener('click', function(e) {
    var more = e.target.closest('#gsShowMore');
    if (more) {
      visibleLimit += PAGE_STEP;
      runQuery();
      return;
    }
    var head = e.target.closest('[data-toggle-group]');
    if (head) {
      var name = head.getAttribute('data-toggle-group');
      var group = resultsDiv.querySelector('.gs-group[data-group="' + name + '"]');
      if (!group) return;
      var body = group.querySelector('.gs-group-body');
      var nowCollapsed = !body.classList.contains('collapsed');
      body.classList.toggle('collapsed', nowCollapsed);
      collapsedGroups[name] = nowCollapsed;
      var countEl = head.querySelector('.gs-count');
      if (countEl) {
        var n = (lastMatched.filter(function(x) { return x.classname === name; }).length);
        countEl.textContent = n + (nowCollapsed ? ' ▸' : ' ▾');
      }
      return;
    }
    var exp = e.target.closest('[data-expand]');
    if (exp) {
      var rowId = exp.getAttribute('data-expand');
      var row = resultsDiv.querySelector('.gs-row[data-row="' + rowId + '"]');
      if (!row) return;
      row.classList.toggle('expanded');
      exp.textContent = row.classList.contains('expanded') ? '▴' : '▾';
    }
  });
})();
</script>
<script src="common_tooltip.js"></script>
<script src="../斯诺德跑团/shortcuts.js"></script>
