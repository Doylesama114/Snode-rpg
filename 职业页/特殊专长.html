<script>
(function() {
    var searchInput = document.getElementById("feat-search");
    var skills = document.querySelectorAll(".content .skill");
    var navLinks = document.querySelectorAll("nav .skill-link");
    var emptyEl = document.getElementById("feat-empty");

    function doSearch() {
        var q = searchInput.value.trim();
        // Clear previous highlights
        if (typeof _clearHighlights === "function") {
            _clearHighlights();
        }

        if (!q) {
            // Show all
            skills.forEach(function(s) { s.classList.remove("hidden"); });
            navLinks.forEach(function(n) { n.classList.remove("hidden"); });
            emptyEl.style.display = "none";
            return;
        }

        var terms = q.split(/\s+/).filter(Boolean);
        var anyVisible = false;

        skills.forEach(function(s) {
            var ds = s.getAttribute("data-search") || "";
            var match = terms.every(function(t) {
                return ds.toLowerCase().indexOf(t.toLowerCase()) >= 0;
            });
            if (match) {
                s.classList.remove("hidden");
                anyVisible = true;
            } else {
                s.classList.add("hidden");
            }
        });

        // Sync nav links
        navLinks.forEach(function(n) {
            var href = n.getAttribute("href");
            if (href) {
                var target = document.querySelector(href);
                if (target && !target.classList.contains("hidden")) {
                    n.classList.remove("hidden");
                } else {
                    n.classList.add("hidden");
                }
            }
        });

        emptyEl.style.display = anyVisible ? "none" : "block";

        // Apply highlights
        if (terms.length > 0 && typeof _applyHighlights === "function") {
            _applyHighlights("feat-content", terms);
        }
    }

    searchInput.addEventListener("input", doSearch);
})();
</script>
