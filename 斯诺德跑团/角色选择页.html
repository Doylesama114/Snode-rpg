<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择角色</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  background: #f6f4ef;
  color: #1f2522;
  min-height: 100vh;
  padding: 30px;
  font-size: 15px;
}
.container {
  max-width: 520px;
  margin: 0 auto;
}
h1 {
  font-size: 26px;
  color: #1f2522;
  font-weight: bold;
  margin-bottom: 6px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d8d2c4;
}
.subtitle {
  font-size: 14px;
  color: #69706b;
  margin-bottom: 24px;
}
.card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.icon {
  font-size: 32px;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f6f4ef;
  border-radius: 8px;
  flex-shrink: 0;
  border: 1px solid #d8d2c4;
}
.card-text h2 {
  font-size: 18px;
  color: #1f2522;
  margin-bottom: 3px;
}
.card-text p {
  font-size: 13px;
  color: #69706b;
}
.back-link {
  display: inline-block;
  color: #69706b;
  font-size: 14px;
  text-decoration: none;
  margin-bottom: 20px;
  cursor: pointer;
}
.back-link:hover { color: #a46d1f; }
/* Char list page specific */
.char-card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.char-card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.char-name {
  font-size: 20px;
  font-weight: bold;
  color: #1f2522;
  margin-bottom: 6px;
}
.char-info {
  font-size: 13px;
  color: #69706b;
  line-height: 1.6;
}
.empty-msg {
  text-align: center;
  padding: 60px 20px;
  color: #69706b;
  font-size: 15px;
}
/* Slot page specific */
.slot-card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.slot-card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.slot-card.empty {
  opacity: 0.5;
  border-style: dashed;
}
.slot-card.empty:hover {
  opacity: 0.8;
}
.slot-title {
  font-size: 16px;
  font-weight: bold;
  color: #1f2522;
  margin-bottom: 4px;
}
.slot-time {
  font-size: 12px;
  color: #69706b;
  margin-bottom: 6px;
}
.slot-summary {
  font-size: 13px;
  color: #69706b;
}
.slot-empty-text {
  font-size: 13px;
  color: #69706b;
  font-style: italic;
}
.char-subtitle {
  font-size: 14px;
  color: #69706b;
  margin-bottom: 20px;
}
.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #69706b;
  text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="主页.html">← 返回主页</a>
  <h1>📜 选择已有角色</h1>
  <div id="charList"></div>
</div>

<script>
function getSavedChars() {
  var chars = [];
  for (var i = 0; i < localStorage.length; i++) {
    var key = localStorage.key(i);
    if (key.indexOf("char_") === 0) {
      var parts = key.replace("char_", "").split("_slot");
      var charName = parts[0];
      if (chars.indexOf(charName) < 0) chars.push(charName);
    }
  }
  return chars;
}

function getCharSummary(charName) {
  var latest = null;
  var latestTime = 0;
  for (var si = 1; si <= 3; si++) {
    var key = "char_" + charName + "_slot" + si;
    var raw = localStorage.getItem(key);
    if (raw) {
      try {
        var data = JSON.parse(raw);
        var savedTime = data._savedAt ? new Date(data._savedAt).getTime() : 0;
        if (savedTime >= latestTime) {
          latestTime = savedTime;
          var cls = "";
          if (data.classes) {
            for (var ci = 0; ci < data.classes.length; ci++) {
              var c = data.classes[ci];
              if (c && c.name && c.level > 0) {
                cls += (cls ? " / " : "") + c.name + " " + c.level + "级";
              }
            }
          }
          var hp = data.hp || "?";
          var fp = data.fp || "?";
          var attrs = data.attrs || {};
          var attrStr = "";
          var attrNames = ["力量","敏捷","体质","智力","感知","魅力","意志","幸运"];
          for (var ai = 0; ai < attrNames.length; ai++) {
            attrStr += attrNames[ai] + (attrs[attrNames[ai]] || 0) + " ";
          }
          var race = data.race || "";
          var bg = data.background || "";
          var personality = data.personality || "";
          var traits = data.traits || "";
          latest = { cls: cls, hp: hp, fp: fp, attrs: attrStr, race: race, bg: bg, personality: personality, traits: traits };
        }
      } catch(e) {}
    }
  }
  return latest;
}

function renderCharList() {
  var chars = getSavedChars();
  var html = "";
  if (chars.length === 0) {
    html = "<div class='empty-msg'>暂无已保存的角色<br><br>请先在角色面板中创建并保存角色</div>";
  } else {
    for (var ci = 0; ci < chars.length; ci++) {
      var name = chars[ci];
      var summary = getCharSummary(name);
      var infoHtml = "";
      if (summary) {
        var headerLine = "";
        if (summary.race) headerLine += summary.race;
        if (summary.cls) headerLine += (headerLine ? " · " : "") + summary.cls;
        if (headerLine) infoHtml += "<div class='char-info'>" + headerLine + "</div>";
        if (summary.bg) infoHtml += "<div class='char-info'>背景: " + summary.bg + "</div>";
        var pers = summary.personality || summary.traits || "";
        if (pers) infoHtml += "<div class='char-info' style='color:#5a5240'>" + pers + "</div>";
        infoHtml += "<div class='char-info'>生命: " + summary.hp + " / 疲劳: " + summary.fp + "</div>";
        infoHtml += "<div class='char-info' style='font-size:11px'>" + summary.attrs + "</div>";
      } else {
        infoHtml = "<div class='char-info'>无有效存档数据</div>";
      }
      html += "<div class='char-card' onclick=\"location.href='角色存档页.html?char=" + encodeURIComponent(name) + "'\">";
      html += "<div class='char-name'>" + name + "</div>";
      html += infoHtml;
      html += "</div>";
    }
  }
  document.getElementById("charList").innerHTML = html;
    var footer=document.getElementById("charList");var btn=document.createElement("div");btn.style.cssText="text-align:center;margin-top:20px;padding:10px;cursor:pointer;color:#a08050;font-size:13px";btn.innerHTML="🗑 清空所有测试角色";btn.onclick=clearAllChars;footer.parentNode.insertBefore(btn,footer.nextSibling);
}

renderCharList();
function clearAllChars(){if(confirm("确定要删除所有角色存档吗？此操作不可恢复。")){var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf("char_")===0)keys.push(k);}for(var i=0;i<keys.length;i++)localStorage.removeItem(keys[i]);alert("已清空 "+keys.length+" 个角色存档");location.reload();}}
</script>
<script src="/bug-report.js"></script>
</body>
</html>
