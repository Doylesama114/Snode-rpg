var results = [];
var passes = 0, fails = 0;

function assert(actual, expected, testName) {
  var pass = JSON.stringify(actual) === JSON.stringify(expected);
  if (pass) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual)); }
}

function assertClose(actual, expected, testName) {
  var pass = typeof actual === 'number' && typeof expected === 'number' && Math.abs(actual - expected) < 0.01;
  if (pass) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected ' + expected + ', got ' + actual); }
}

function assertTrue(actual, testName) {
  if (actual) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName); }
}

function assertFalse(actual, testName) {
  if (!actual) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected falsy, got ' + actual); }
}

var hp3 = calcTotalHP("蛮斗士", 3, "", 0, 14, "", "", 0);
assertClose(hp3, 28, '蛮斗士L3 con=14 → 12+2+5*2+2*2=28');

var rProfs = { "敏捷": { "体操": 2 }, "智力": { "伪造": 1 }, "魅力": { "欺瞒": 1 } };
assertTrue(evalSubclassProfReq(rogueReq, rProfs).ok, '游荡者: 敏捷2+伪造1+欺瞒1=4');

assertFalse(checkSubclassReq("法师", "蛮斗士", { "力量": 16, "体质": 16 }, bProfs).ok, '法师主职不可兼职蛮斗士');

results.push('</div>');

// =================== T10: xlsx 天赋导出行位 ===================
results.push('<div class="section"><h3>T10: fillXlsxTalents 按阶位填行</h3>');
var xlsxWrites = {};
var tierMap = defaultTalentTierRowMap();
fillXlsxTalents(function(ref, val) { xlsxWrites[ref] = val; }, [
  { n: 'T1A', tier: '一阶' }, { n: 'T1B', tier: '一阶' },
  { n: 'T2A', tier: '二阶' },
  { n: 'T3A', tier: '三阶' }, { n: 'T3B', tier: '三阶' }
], tierMap);
assert(xlsxWrites.O122, 'T1A', '一阶首行 O122');
assert(xlsxWrites.O123, 'T1B', '一阶 O123');
assert(xlsxWrites.O129, 'T2A', '二阶 O129');
assert(xlsxWrites.O136, 'T3A', '三阶 O136');
assert(xlsxWrites.O137, 'T3B', '三阶 O137');
assertFalse(xlsxWrites.O125, 'T2A 不在一阶区 O125');
assert(featDisplayName({ name: '健壮', level: 4 }), '健壮', 'featDisplayName 对象');
assert(featDisplayName('质朴'), '质朴', 'featDisplayName 字符串');
results.push('</div>');

// =================== Render Summary ===================
var total = passes + fails;
var summary = document.getElementById("summary");
if (fails === 0) {
  summary.className = "summary all-pass";
  summary.innerHTML = "✅ ALL " + total + " TESTS PASSED";
} else {
  summary.className = "summary has-fail";
  summary.innerHTML = "❌ " + passes + " passed, " + fails + " FAILED (total: " + total + ")";
}
document.getElementById("results").innerHTML = results.join('\n');
</script>
</body>
