<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Tests - 斯诺德跑团</title>
<style>
body { font-family: monospace; background: #1a1a1a; color: #ddd; padding: 20px; font-size: 13px; }
h1 { color: #fff; }
.pass { color: #5f5; }
.fail { color: #f55; }
.section { margin: 16px 0; padding: 10px; background: #222; border-radius: 6px; }
.section h3 { color: #aaa; margin: 0 0 8px 0; }
.summary { font-size: 18px; margin-top: 20px; padding: 16px; border-radius: 8px; text-align: center; font-weight: bold; }
.summary.all-pass { background: #1a3a1a; color: #5f5; }
.summary.has-fail { background: #3a1a1a; color: #f55; }
</style>
</head>
<body>
<h1>Panel Engine Tests</h1>
<div id="results"></div>
<div id="summary"></div>

<!-- Prevent panel_engine render() from crashing on tests page -->
<div style="display:none"><div id="info-grid"></div><div id="class-row"></div><div id="story-block"></div><div id="story-title"></div><div id="xp-bar"></div><div id="sp-bar"></div><div id="stat-row"></div><div id="attr-grid"></div><div id="feat-list"></div><div id="currency-row"></div><div id="weight-block"></div><div id="talent-grid"></div><div id="equip-grid"></div><div id="racial-traits"></div><div id="class-features"></div><div id="lang-list"></div><div id="prof-list"></div><div id="skill-table-body"></div><div id="sub-skill-table-body"></div><div id="learnPanel"></div><div id="subSkillTitle"></div><div id="mainSkillTitle"></div></div>

<script src="../职业页/数据/items_data.js"></script>
<script src="panel_data.js"></script>
<script>
// Prevent panel_engine.js from auto-calling render() on tests page
window.initFromURL = function() { return true; };
</script>
<script src="panel_engine.js"></script>
<script>
var results = [];
var passes = 0, fails = 0;

function assert(actual, expected, testName) {
  var pass = JSON.stringify(actual) === JSON.stringify(expected);
  if (pass) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual)); }
}

function assertClose(actual, expected, testName) {
  var pass = typeof actual === 'number' && typeof expected === 'number' && Math.abs(actual - expected) < 0.01;
  if (pass) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected ' + expected + ', got ' + actual); }
}

function assertTrue(actual, testName) {
  if (actual) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName); }
}

function assertFalse(actual, testName) {
  if (!actual) { passes++; results.push('<span class="pass">✅ PASS</span>: ' + testName); }
  else { fails++; results.push('<span class="fail">❌ FAIL</span>: ' + testName + ' — expected falsy, got ' + actual); }
}

// =================== T1: calcMod (pure) ===================
results.push('<div class="section"><h3>T1: calcMod — 属性调整值</h3>');
assert(calcMod(10), 0, 'calcMod(10) → 0');
assert(calcMod(8), -1, 'calcMod(8) → -1');
assert(calcMod(12), 1, 'calcMod(12) → +1');
assert(calcMod(9), -1, 'calcMod(9) → -1 (floor向下取整)');
assert(calcMod(20), 5, 'calcMod(20) → +5');
assert(calcMod(30), 10, 'calcMod(30) → +10');
assert(calcMod(7), -2, 'calcMod(7) → -2');
results.push('</div>');

// =================== T2: parseSkillCost (pure) ===================
results.push('<div class="section"><h3>T2: parseSkillCost — 技能点消耗解析</h3>');
var singleCost = { cost: { color: "#FF0000", count: 2 } };
assert(parseSkillCost(singleCost), [
  { colorName: "红色", colorHex: "#FF0000" },
  { colorName: "红色", colorHex: "#FF0000" }
], '单色×2 → [{红色,红色}]');

var arrayCost = { cost: [{ color: "#FF0000", count: 1 }, { color: "#00B0F0", count: 1 }] };
var ac = parseSkillCost(arrayCost);
assert(ac.length, 2, '双色数组长度=2');
assert(ac[0].colorName, "红色", '双色[0]名称为红色');
assert(ac[1].colorHex, "#00B0F0", '双色[1]hex为#00B0F0');

assert(parseSkillCost({}), [], '无cost → 空数组');
assert(parseSkillCost({ cost: null }), [], 'cost=null → 空数组');
assert(parseSkillCost({ cost: { color: "#595959" } }).length, 1, '无count默认count=1');
results.push('</div>');

// =================== T3: calcTotalHP ===================
results.push('<div class="section"><h3>T3: calcTotalHP — 生命值计算</h3>');

// 蛮斗士: first=12, level_up=5
// 人类: hp_bonus=2
// 战士(sub): level_up=4
// 恶棍(bg): hp_bonus="+1" (string!)

// con=14 → calcMod=2
var hp1 = calcTotalHP("蛮斗士", 1, "", 0, 14, "", "", 0);
assertClose(hp1, 14, '蛮斗士L1 con=14 → 12+2=14');

var hp2 = calcTotalHP("蛮斗士", 1, "", 0, 14, "人类", "", 0);
assertClose(hp2, 16, '蛮斗士L1 con=14 race=人类(hp+2) → 12+2+2=16');

// 蛮斗士 L3, con=14: 12 + 2 + 5*(3-1) + 2*(3-1) = 12+2+10+4 = 28
var hp3 = calcTotalHP("蛮斗士", 3, "", 0, 14, "", "", 0);
assertClose(hp3, 28, '蛮斗士L3 con=14 → 12+2+5*2+2*2=28');

// 背景hp_bonus为字符串"+1"
var hp4 = calcTotalHP("蛮斗士", 1, "", 0, 10, "人类", "恶棍", 0);
// 12 + 0 + 2 + 1 = 15
assertClose(hp4, 15, '背景hp_bonus字符串"+1"被parseInt → 12+2+1=15');

// Multi-class: 蛮斗士L3 + 战士L2, con=14
var hp5 = calcTotalHP("蛮斗士", 3, "战士", 2, 14, "", "", 0);
// main: 12+2+5*2+2*2 = 28
// sub: (4+2)*(2-1) = 6
// total = 34
assertClose(hp5, 34, '蛮斗士L3+战士L2 con=14 → 28+6=34');

// Flat bonus
var hp6 = calcTotalHP("蛮斗士", 1, "", 0, 10, "", "", 5);
assertClose(hp6, 17, 'fb=5 → 12+5=17');

// Sub-class level 0 adds no HP
var hp7 = calcTotalHP("蛮斗士", 3, "战士", 0, 14, "", "", 0);
assertClose(hp7, 28, '战士L0不增加HP → 28');

// Non-existent class returns 0
var hp8 = calcTotalHP("", 0, "", 0, 10, "", "", 0);
assertClose(hp8, 0, '空职业 → 0');

results.push('</div>');

// =================== T4: calcTotalFP ===================
results.push('<div class="section"><h3>T4: calcTotalFP — 疲劳值计算</h3>');

// 蛮斗士: fp first=8, level_up=1
var fp1 = calcTotalFP("蛮斗士", 1, "", 0, "力量", 10, "", 0);
assertClose(fp1, 8, '蛮斗士L1 kv=10 → 8');

var fp2 = calcTotalFP("蛮斗士", 1, "", 0, "力量", 14, "", 0);
// 8 + 2 + 0 = 10
assertClose(fp2, 10, '蛮斗士L1 kv=14 → 8+2=10');

// GOTCHA: ka参数传入但不使用——只用kv
var fp3 = calcTotalFP("蛮斗士", 1, "", 0, 999, 14, "", 0);
assertClose(fp3, 10, 'GOTCHA: ka=999(无效)只使用kv=14 → 8+2=10');

// 人类 fp_bonus = 0
var fp4 = calcTotalFP("蛮斗士", 1, "", 0, "力量", 14, "人类", 0);
assertClose(fp4, 10, '人类fp_bonus=0 → 不变');

// Multi-class
var fp5 = calcTotalFP("蛮斗士", 3, "战士", 2, "力量", 14, "", 0);
// main: 8+2+1*2 = 12
// sub: 1*(2-1) = 1
// total = 13
assertClose(fp5, 13, '蛮斗士L3+战士L2 kv=14 → 12+1=13');

results.push('</div>');

// =================== T5: calcSkillSlots ===================
results.push('<div class="section"><h3>T5: calcSkillSlots — 技能槽位计算</h3>');

// Mock state
state.classes = [{ name: "蛮斗士", level: 1 }, { name: "", level: 0 }, { name: "", level: 0 }];
var ss1 = calcSkillSlots(0);
assertClose(ss1, 10, '蛮斗士L1 → 10槽');

state.classes = [{ name: "蛮斗士", level: 3 }, { name: "", level: 0 }, { name: "", level: 0 }];
var ss2 = calcSkillSlots(0);
assertClose(ss2, 12, '蛮斗士L3 → 10+1+1=12');

// GOTCHA: 法师双倍槽位
state.classes = [{ name: "法师", level: 3 }, { name: "", level: 0 }, { name: "", level: 0 }];
var ss3 = calcSkillSlots(0);
assertClose(ss3, 14, 'GOTCHA: 法师L3 → 10+1*2+1*2=14');

// Non-法师 no double
state.classes = [{ name: "战士", level: 3 }, { name: "", level: 0 }, { name: "", level: 0 }];
var ss4 = calcSkillSlots(0);
assertClose(ss4, 12, '战士L3(非法师) → 10+1+1=12');

// Sub-class
state.classes = [{ name: "蛮斗士", level: 1 }, { name: "战士", level: 1 }, { name: "", level: 0 }];
var ss5 = calcSkillSlots(1);
assertClose(ss5, 4, '子职业L1 → 4槽');

// Empty class
state.classes = [{ name: "", level: 0 }, { name: "", level: 0 }, { name: "", level: 0 }];
var ssEmpty = calcSkillSlots(0);
assertClose(ssEmpty, 0, '空职业 → 0');

// 法师L1 no double (only >1)
state.classes = [{ name: "法师", level: 1 }, { name: "", level: 0 }, { name: "", level: 0 }];
var ss6 = calcSkillSlots(0);
assertClose(ss6, 10, '法师L1无双倍 → 10');

results.push('</div>');

// =================== T6: canPlaceInSlot ===================
results.push('<div class="section"><h3>T6: canPlaceInSlot — 装备槽位规则</h3>');

// Reset container state
state.containerItems = { "背包": "已解锁", "旅行腰包": "已解锁" };

// 防具 slot
assertTrue(canPlaceInSlot(["防具"], "防具", "", ""), '防具tag → 防具槽');
assertFalse(canPlaceInSlot(["武器"], "防具", "", ""), '武器tag → 防具槽(fail)');

// 杂务包 slot
assertTrue(canPlaceInSlot(["杂务"], "杂务包", "", ""), '杂务tag → 杂务包');
assertTrue(canPlaceInSlot(["武器"], "杂务包", "", ""), '武器tag → 杂务包(true, 游戏允许)');

// 配饰 slot
assertTrue(canPlaceInSlot(["配饰"], "配饰", "", ""), '配饰tag → 配饰槽');

// 材料包 — 烹饪
assertTrue(canPlaceInSlot(["食品"], "材料包", "", "烹饪材料包"), '食品tag → 烹饪材料包');
assertFalse(canPlaceInSlot(["食品", "水产"], "材料包", "", "烹饪材料包"), '食品+水产tag → 烹饪材料包(fail)');

// 材料包 — 炼金
assertTrue(canPlaceInSlot(["材料", "生物材料"], "材料包", "", "炼金材料包"), '生物材料 → 炼金材料包');
assertFalse(canPlaceInSlot(["木材"], "材料包", "", "炼金材料包"), '木材 → 炼金材料包(fail)');

// 材料包 — null bagType
assertFalse(canPlaceInSlot(["草药"], "材料包", "", ""), 'no bagType → fail');

// Locked container
state.containerItems = { "背包": "" };
assertFalse(canPlaceInSlot(["道具"], "背包", "", ""), '锁定的背包 → false');

// Default slot (anything allowed)
state.containerItems = { "背包": "已解锁" };
assertTrue(canPlaceInSlot(["道具"], "背包", "", ""), '已解锁背包 → true');

results.push('</div>');

// =================== Render Summary ===================
var total = passes + fails;
var summary = document.getElementById("summary");
if (fails === 0) {
  summary.className = "summary all-pass";
  summary.innerHTML = "✅ ALL " + total + " TESTS PASSED";
} else {
  summary.className = "summary has-fail";
  summary.innerHTML = "❌ " + passes + " passed, " + fails + " FAILED (total: " + total + ")";
}
document.getElementById("results").innerHTML = results.join('\n');
</script>
</body>
</html>
