<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Verify — 斯诺德跑团</title>
<style>
body { font-family: monospace; background: #1a1a1a; color: #ddd; padding:20px; font-size:13px; }
.pass { color:#5f5; } .fail { color:#f55; } .warn { color:#fa0; }
.section { margin:16px 0; padding:10px; background:#222; border-radius:6px; }
h1{color:#fff}h3{color:#aaa;margin:0 0 8px}
.summary{font-size:18px;margin-top:20px;padding:16px;border-radius:8px;text-align:center;font-weight:bold}
.all-pass{background:#1a3a1a;color:#5f5}.has-fail{background:#3a3a1a;color:#fa0}
</style>
</head>
<body>
<h1>Verification Report</h1>
<div id="results"></div>

<script src="panel_data.js"></script>
<!-- NOTE: panel_engine.js NOT loaded here — it auto-calls render() which needs 角色面板.html DOM -->
<script>
var results=[], errors=[];

// Capture console errors
window.onerror = function(msg, src, line, col, err) {
  errors.push({msg:msg, src:src, line:line});
  return false;
};

// ========== V1: Script loading ==========
results.push('<div class="section"><h3>V1: Script Loading</h3>');

function checkDef(name, desc) {
  var ok = typeof window[name] !== 'undefined';
  results.push(ok 
    ? '<span class="pass">✅</span> ' + desc
    : '<span class="fail">❌</span> ' + desc + ' — NOT DEFINED');
  return ok;
}

// Test data availability (all extracted constants should be global)
checkDef('REF_CLASSES', 'REF_CLASSES loaded');
checkDef('REF_RACES', 'REF_RACES loaded');
checkDef('REF_BACKGROUNDS', 'REF_BACKGROUNDS loaded');
checkDef('REF_LEVELUP', 'REF_LEVELUP loaded');
checkDef('SKILL_DATA', 'SKILL_DATA loaded');
checkDef('SKILL_DATA', 'SKILL_DATA loaded');
checkDef('SPECIAL_FEATS', 'SPECIAL_FEATS extracted');
checkDef('CHOICE_B_PROF_MAP', 'CHOICE_B_PROF_MAP extracted');
checkDef('LEVEL_TABLE', 'LEVEL_TABLE extracted');
checkDef('armorACMap', 'armorACMap extracted');
checkDef('itemWeights', 'itemWeights extracted');
checkDef('aliasMap', 'aliasMap extracted');
checkDef('CHOICE_GROUPS', 'CHOICE_GROUPS extracted');
checkDef('STYLE_COLORS', 'STYLE_COLORS extracted');

// Test function availability
checkDef('calcMod', 'calcMod function');
checkDef('calcTotalHP', 'calcTotalHP function');
checkDef('calcTotalFP', 'calcTotalFP function');
checkDef('parseSkillCost', 'parseSkillCost function');
checkDef('canPlaceInSlot', 'canPlaceInSlot function');
checkDef('render', 'render function');
checkDef('injectPortrait', 'injectPortrait function');
checkDef('exportAllSaves', 'exportAllSaves function');
checkDef('importSaves', 'importSaves function');

results.push('</div>');

// ========== V2: Quick calcMod sanity ==========
results.push('<div class="section"><h3>V2: calcMod Quick Sanity</h3>');
var cmOK = true;
cmOK = cmOK && calcMod(10) === 0;
cmOK = cmOK && calcMod(14) === 2;
cmOK = cmOK && calcMod(8) === -1;
results.push(cmOK ? '<span class="pass">✅</span> calcMod sanity checks pass'
  : '<span class="fail">❌</span> calcMod sanity checks FAIL');

// Quick HP check
var hpOK = calcTotalHP('蛮斗士', 1, '', 0, 14, '', '', 0) === 14;
results.push(hpOK ? '<span class="pass">✅</span> calcTotalHP quick check pass'
  : '<span class="fail">❌</span> calcTotalHP quick check FAIL');
results.push('</div>');

// ========== V3: Console errors ==========
results.push('<div class="section"><h3>V3: Console Errors</h3>');
setTimeout(function() {
  if (errors.length === 0) {
    results.push('<span class="pass">✅</span> No console errors detected');
  } else {
    for (var i=0;i<errors.length;i++) {
      results.push('<span class="fail">❌</span> ' + errors[i].msg + ' (' + errors[i].src + ':' + errors[i].line + ')');
    }
  }
  results.push('</div>');

  // ========== Summary ==========
  var total = (results.join('').match(/class="(pass|fail)"/g) || []).length;
  var fails = (results.join('').match(/class="fail"/g) || []).length;
  var summary = document.createElement('div');
  summary.className='summary ' + (fails===0 ? 'all-pass' : 'has-fail');
  summary.textContent = fails===0 
    ? '✅ ALL VERIFICATIONS PASS (' + total + ' checks)'
    : '⚠ ' + fails + ' FAILURES (total ' + total + ' checks)';
  document.getElementById('results').innerHTML = results.join('\n');
  document.getElementById('results').appendChild(summary);
}, 500);
</script>

</body>
</html>
