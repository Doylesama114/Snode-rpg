<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>资料库 - 斯诺德跑团</title>
<style>
  :root{--ink:#1f2522;--muted:#69706b;--paper:#fbf8f1;--soft:#f1ebdf;--bg:#f6f4ef;--line:#d8d2c4;--accent:#a46d1f;--good:#4caf50;--row:#fbf8f1;--row-alt:#f3eee3}
  html.dark{--ink:#e8e6e3;--muted:#9d9b98;--paper:#24272b;--soft:#2b2f33;--bg:#1a1d20;--line:#3a3d40;--accent:#d4a54a;--good:#7ec87b;--row:#24272b;--row-alt:#2b2f33}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
  a.back{color:var(--accent);text-decoration:none;font-size:14px}
  h1{margin:10px 0 4px;font-size:28px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);cursor:pointer;font-size:14px}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel{display:none;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px}
  .panel.active{display:block}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
  .toolbar input{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--soft);color:var(--ink)}
  .meta{color:var(--muted);font-size:13px}
  .sheetTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .sheetTab{padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;font-size:13px}
  .sheetTab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tableBox{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper);max-height:68vh}
  table.flow{border-collapse:collapse;min-width:960px;width:100%;table-layout:fixed;font-size:12px;line-height:1.45}
  table.flow td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;white-space:pre-wrap;word-break:break-word;max-width:320px}
  table.flow td:empty{background:var(--row-alt)}
  .bgLayout{display:grid;grid-template-columns:216px 1fr;gap:14px;align-items:start}
  .bgSide{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:14px;max-height:78vh;display:flex;flex-direction:column;min-width:0}
  .bgSideHead{font-size:14px;font-weight:bold;color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}
  .bgSide input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px;margin-bottom:8px}
  .bgList{overflow:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
  .bgListItem{padding:7px 9px;border-radius:8px;font-size:14px;line-height:1.5;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink);flex:0 0 auto}
  .bgListItem:hover{background:var(--paper);color:var(--accent)}
  .bgListItem.active{background:var(--accent);color:#fff}
  .bgPage{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;min-height:66vh;min-width:0}
  .bgPageHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
  .bgPageTitle{font-size:22px;font-weight:bold;color:var(--accent)}
  .bgPageMeta{color:var(--muted);font-size:13px;margin-top:4px}
  .bgPageNav{display:flex;gap:8px;flex:none}
  .bgPageNav button{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);cursor:pointer;font-size:13px}
  .bgPageNav button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .bgPageNav button:disabled{opacity:.4;cursor:not-allowed}
  .bgFields{display:grid;grid-template-columns:132px 1fr;gap:6px 12px;font-size:14px;line-height:1.75}
  .bgFields .fieldLabel{color:var(--muted);font-weight:bold}
  .bgFields .fieldValue{color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .bgSection{margin:16px 0 8px;font-size:16px;font-weight:bold;color:var(--accent);border-left:4px solid var(--accent);padding-left:8px}
  .bgOptionGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
  .bgOption{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px;line-height:1.6}
  .bgOptionSub{margin-top:5px;color:var(--muted);font-size:12.5px;line-height:1.55}
  .bgOptionSub b{color:var(--accent);font-weight:bold}
  .warn{background:var(--row-alt);border:1px solid var(--line);color:var(--accent);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  @media(max-width:860px){
    .bgLayout{grid-template-columns:1fr}
    .bgSide{position:static;max-height:none}
    .bgList{flex-direction:row;overflow-x:auto;padding-bottom:4px}
    .bgListItem{flex:none;max-width:160px}
    .bgFields{grid-template-columns:96px 1fr}
    .bgPageTitle{font-size:19px}
  }
  .cardLink{display:block;border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--soft);text-decoration:none;color:var(--ink);margin-bottom:12px}
  .cardLink b{color:var(--accent)}
  .cardLink span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
  .empty{padding:24px;color:var(--muted);text-align:center}
  .recList{display:flex;flex-direction:column;gap:12px}
  .recCard{scroll-margin-top:14px}
  .flowNav{position:fixed;right:14px;top:96px;width:188px;max-height:72vh;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(31,37,34,.14);z-index:60;overflow:hidden}
  .flowNav.collapsed{width:auto;max-height:none}
  .flowNavHead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--soft);border-bottom:1px solid var(--line);font-size:13px;font-weight:bold;color:var(--accent);cursor:pointer;white-space:nowrap}
  .flowNav.collapsed .flowNavHead{border-bottom:none}
  .flowNavList{overflow:auto;padding:6px}
  .flowNav.collapsed .flowNavList{display:none}
  .flowNavItem{padding:5px 8px;border-radius:6px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .flowNavItem:hover{background:var(--soft);color:var(--accent)}
  @media(max-width:1180px){.flowNav{width:166px;top:88px}}
  @media(max-width:820px){.flowNav{right:8px;left:8px;top:auto;bottom:10px;width:auto;max-height:40vh}}

  .recCard{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px}
  .recTitle{font-size:16px;font-weight:bold;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
  .kvRow{display:grid;grid-template-columns:118px 1fr;gap:8px;font-size:13px;line-height:1.6;margin:4px 0}
  .kvLabel{color:var(--muted);font-weight:bold;word-break:keep-all}
  .kvValue{color:var(--ink);word-break:break-word;white-space:pre-wrap}
  .recSection{margin:10px 0 4px;font-weight:bold;color:var(--accent);font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  .recText{font-size:13px;line-height:1.75;margin:5px 0;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
  @media(max-width:700px){.kvRow{grid-template-columns:86px 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="主页.html">← 返回冒险者手册</a>
  <h1>📚 资料库</h1>
  <div class="sub">创建流程、个性与背景规则、物资大全与基础规则统一入口。</div>

  <div class="tabs">
    <div class="tab active" data-tab="flow">创建流程</div>
    <div class="tab" data-tab="bg">个性与背景创建规则</div>
    <div class="tab" data-tab="store">物资大全</div>
    <div class="tab" data-tab="base">基础规则</div>
  </div>

  <div class="panel active" id="panel-flow">
    <div class="meta" style="margin-bottom:10px">来源：冒险者角色创建流程.xlsx；按原表合并单元格渲染，可滚动查看。</div>
    <div class="sheetTabs" id="sheetTabs"></div>
    <div class="tableBox" id="flowBox"></div>
  </div>

  <div class="panel" id="panel-bg">
    <div class="bgLayout">
      <aside class="bgSide">
        <div class="bgSideHead"><span>个性背景</span><span class="meta" id="bgCount"></span></div>
        <input id="bgQ" placeholder="搜索背景名称、熟练项、特性描述…">
        <div class="bgList" id="bgList"></div>
      </aside>
      <main class="bgPage" id="bgPage"></main>
    </div>
  </div>

  <div class="panel" id="panel-store">
    <a class="cardLink" href="物资大全.html">
      <b>📦 打开斯诺德物资大全</b>
      <span>按原文件的大分类 + 小分类分组展示全部物品（名称 / 小类 / 效果与简介 / 价格 / 载重与负重 / 品质），武器伤害、卷轴与魔法道具效果、品质、容器负重、租借与购买价全部可见，支持搜索。</span>
    </a>
  </div>

  <div class="panel" id="panel-base">
    <a class="cardLink" href="help.html">
      <b>📖 打开冒险者基础规则</b>
      <span>包含冒险者基础规则.xlsx 已整合的内容。</span>
    </a>
  </div>
</div>

<div id="flowNav" class="flowNav" style="display:none">
  <div class="flowNavHead" id="flowNavHead"><span id="flowNavTitle">跳转</span><span id="flowNavToggle">−</span></div>
  <div class="flowNavList" id="flowNavList"></div>
</div>
<script src="../职业页/数据/backgrounds_data.js"></script>
<script src="../职业页/数据/bg_personality_data.js"></script>
<script src="资料库/creation_flow_data.js"></script>
<script>
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function nl2br(t){return esc(t).replace(/\n/g,'<br>');}

/* ===== tabs ===== */
var tabs=document.querySelectorAll('.tab');
for(var ti=0;ti<tabs.length;ti++){
  tabs[ti].onclick=function(){
    for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
    this.classList.add('active');
    var id=this.getAttribute('data-tab');
    var panels=['flow','bg','store','base'];
    for(var j=0;j<panels.length;j++)document.getElementById('panel-'+panels[j]).classList.remove('active');
    document.getElementById('panel-'+id).classList.add('active');
    if(typeof renderFlowNav==='function')renderFlowNav();
  };
}

/* ===== creation flow ===== */
var _flowIdx=0;
function buildMergeMap(sh){
  var map={};
  for(var i=0;i<sh.merges.length;i++){
    var m=sh.merges[i],c1=m[0],r1=m[1],c2=m[2],r2=m[3];
    map[r1+','+c1]={rowspan:r2-r1+1,colspan:c2-c1+1};
    for(var r=r1;r<=r2;r++)for(var c=c1;c<=c2;c++){if(r!==r1||c!==c1)map[r+','+c]='covered';}
  }
  return map;
}
function renderFlowRecords(sh){
  var h='<div class="recList">';
  for(var i=0;i<sh.records.length;i++){
    var rec=sh.records[i]||{};
    h+='<div class="recCard" id="flowRec_'+i+'"><div class="recTitle">'+esc(rec.title||'')+'</div>';
    var fields=rec.fields||[];
    for(var j=0;j<fields.length;j++){
      var f=fields[j]||{};
      if(f.type==='section')h+='<div class="recSection">'+esc(f.text||'')+'</div>';
      else if(f.type==='kv')h+='<div class="kvRow"><span class="kvLabel">'+esc(f.label||'')+'</span><span class="kvValue">'+esc(f.value||'')+'</span></div>';
      else h+='<div class="recText">'+esc(f.text||'')+'</div>';
    }
    h+='</div>';
  }
  return h+'</div>';
}
function renderFlow(){
  var sh=CREATION_FLOW_DATA.sheets[_flowIdx];
  if(!sh){document.getElementById('flowBox').innerHTML='<div class="empty">没有数据</div>';return;}
  if(sh.records&&sh.records.length){document.getElementById('flowBox').innerHTML=renderFlowRecords(sh);return;}
  // 兼容：没有结构化 records 时回退到原始表格
  var map=buildMergeMap(sh);
  var h='<table class="flow"><tbody>';
  for(var r=0;r<sh.rows.length;r++){
    h+='<tr>';
    for(var c=0;c<sh.maxCol;c++){
      var key=(r+1)+','+(c+1);var mk=map[key];
      if(mk==='covered')continue;
      var v=sh.rows[r][c]||'';
      var attrs='';
      if(mk&&mk!=='covered'){if(mk.rowspan>1)attrs+=' rowspan="'+mk.rowspan+'"';if(mk.colspan>1)attrs+=' colspan="'+mk.colspan+'"';}
      h+='<td'+attrs+'>'+(v?nl2br(v):'')+'</td>';
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  document.getElementById('flowBox').innerHTML=h;
}
function renderSheetTabs(){
  var h='';
  for(var i=0;i<CREATION_FLOW_DATA.sheets.length;i++){
    h+='<div class="sheetTab'+(_flowIdx===i?' active':'')+'" data-idx="'+i+'">'+esc(CREATION_FLOW_DATA.sheets[i].name)+'</div>';
  }
  document.getElementById('sheetTabs').innerHTML=h;
  var tabs=document.querySelectorAll('.sheetTab');
  for(var j=0;j<tabs.length;j++){
    tabs[j].onclick=function(){_flowIdx=parseInt(this.getAttribute('data-idx'),10)||0;renderSheetTabs();renderFlow();renderFlowNav();};
  }
}
var _flowNavCollapsed = window.innerWidth < 1280;
function scrollToFlowRecord(i){
  var el=document.getElementById('flowRec_'+i);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderFlowNav(){
  var nav=document.getElementById('flowNav');
  var panel=document.getElementById('panel-flow');
  var sh=CREATION_FLOW_DATA.sheets[_flowIdx];
  if(!nav||!panel||!panel.classList.contains('active')||!sh||!sh.records||!sh.records.length){if(nav)nav.style.display='none';return;}
  nav.style.display='flex';
  if(_flowNavCollapsed)nav.classList.add('collapsed');else nav.classList.remove('collapsed');
  var title=String(sh.name||'').replace(/^NO\.\d+/, '');
  document.getElementById('flowNavTitle').textContent='跳转 · '+title;
  document.getElementById('flowNavToggle').textContent=_flowNavCollapsed?'+':'−';
  var h='';
  for(var i=0;i<sh.records.length;i++){
    h+='<div class="flowNavItem" data-idx="'+i+'" title="'+esc(sh.records[i].title||'')+'">'+esc(sh.records[i].title||'')+'</div>';
  }
  document.getElementById('flowNavList').innerHTML=h;
  var items=document.querySelectorAll('#flowNavList .flowNavItem');
  for(var j=0;j<items.length;j++){
    items[j].onclick=function(){
      var idx=parseInt(this.getAttribute('data-idx'),10)||0;
      scrollToFlowRecord(idx);
      if(window.innerWidth<820){_flowNavCollapsed=true;renderFlowNav();}
    };
  }
}
document.getElementById('flowNavHead').onclick=function(){
  _flowNavCollapsed=!_flowNavCollapsed;
  renderFlowNav();
};
renderSheetTabs();renderFlow();renderFlowNav();

/* ===== backgrounds ===== */
var _bgIdx=0;
function _bgMatch(b,p,q){
  if(!q)return true;
  var hay=(String(b.name||'')+' '+String(b['基础熟练项']||'')+' '+String(b['专业熟练项']||'')+' '+String(b['其他']||'')+' '+String(b['特性描述']||'')+' '+String((p&&p.desc)||'')).toLowerCase();
  return hay.indexOf(q)>=0;
}
function _bgFiltered(){
  var q=(document.getElementById('bgQ').value||'').trim().toLowerCase();
  var out=[];
  for(var i=0;i<BACKGROUNDS.length;i++){
    var b=BACKGROUNDS[i]||{},p=BG_PERSONALITY[b.name]||{};
    if(_bgMatch(b,p,q))out.push({i:i,b:b,p:p});
  }
  return out;
}
function _bgWarnings(b,p){
  var name=b.name||'',warn=[];
  if(name==='法师学徒')warn.push('创建时：必须从法师一阶戏法中选择满 2 个，加入技能列表且不占技能栏；不允许二阶戏法。');
  if(p.deities&&p.deities.length)warn.push('创建时必须从神祇列表选择 1 项（下方附各神祇简介）。');
  if(p.contacts&&p.contacts.length)warn.push('创建时必须从联系渠道列表选择 1 项。');
  if(p.scam_types&&p.scam_types.length)warn.push('创建时必须从偏好骗局列表选择 1 项（并取得对应的骗局装备）。');
  if(p.mission_channels&&p.mission_channels.length)warn.push('创建时必须从任务渠道列表选择 1 项。');
  if(p.academic_domains&&p.academic_domains.length)warn.push('创建时必须从学术领域列表选择 1 项（决定熟练度加成与额外装备）。');
  if(p.crime_details&&p.crime_details.length)warn.push('创建时必须从罪名列表选择 1 项（决定你的接头人）。');
  if(p.seclusion_reasons&&p.seclusion_reasons.length)warn.push('创建时必须从隐居原因列表选择 1 项。');
  if(p.military_roles&&p.military_roles.length)warn.push('创建时必须从专职列表选择 1 项（决定熟练度加成与额外装备）。');
  if(p.foreign_origins&&p.foreign_origins.length)warn.push('创建时必须从造访原因列表选择 1 项（不同原因获得不同加成）。');
  if(p.companions&&p.companions.length)warn.push('创建时必须从名望加成列表选择 1 种动物伙伴。');
  if(String(b['其他']||'').indexOf('任选')>=0)warn.push('创建时必须完成「'+b['其他']+'」的选择。');
  if(String(b['基础熟练项']||'').indexOf('任选')>=0||String(b['专业熟练项']||'').indexOf('任选')>=0)warn.push('创建时必须完成对应熟练项/专业的选择。');
  return warn;
}
function _bgEsc(v){
  // 数据里存在 &#10; 形式的换行实体，先还原成真正的换行，再转义并渲染为 <br>
  return esc(String(v==null?'':v).replace(/&#10;/g,'\n')).replace(/\n/g,'<br>');
}
function _bgField(label,value){
  var v=_bgEsc(value||'无');
  return '<div class="fieldLabel">'+esc(label)+'</div><div class="fieldValue">'+v+'</div>';
}
function _bgOptions(title,arr){
  if(!arr||!arr.length)return '';
  var h='<div class="bgSection">'+esc(title)+'</div><div class="bgOptionGrid">';
  for(var i=0;i<arr.length;i++)h+='<div class="bgOption">'+_bgEsc(arr[i])+'</div>';
  return h+'</div>';
}
/* 带附加说明的选项（如 神祇简介 / 专职熟练度+额外装备 / 名望加成表） */
function _bgRichOptions(title,arr,fields){
  if(!arr||!arr.length)return '';
  var h='<div class="bgSection">'+esc(title)+'</div><div class="bgOptionGrid">';
  for(var i=0;i<arr.length;i++){
    var it=arr[i];
    if(typeof it==='string'||it==null){h+='<div class="bgOption">'+_bgEsc(it)+'</div>';continue;}
    var main='';
    for(var f=0;f<fields.length;f++){
      var key=fields[f][0];
      if(key==='name'||key==='level'){main=_bgEsc(it[key]||'');break;}
    }
    if(!main)main=_bgEsc(it.name||it.level||'');
    var sub='';
    for(var g=0;g<fields.length;g++){
      var k2=fields[g][0],lbl=fields[g][1];
      if(k2==='name'||k2==='level')continue;
      if(!it[k2])continue;
      sub+='<div class="bgOptionSub"><b>'+esc(lbl)+'：</b>'+_bgEsc(it[k2])+'</div>';
    }
    h+='<div class="bgOption">'+main+sub+'</div>';
  }
  return h+'</div>';
}
function renderBgList(){
  var items=_bgFiltered();
  if(!items.length){document.getElementById('bgList').innerHTML='<div class="meta" style="padding:8px">没有匹配的背景</div>';document.getElementById('bgCount').textContent='0';return items;}
  var found=false;
  for(var i=0;i<items.length;i++){if(items[i].i===_bgIdx)found=true;}
  if(!found)_bgIdx=items[0].i;
  var h='';
  for(var j=0;j<items.length;j++){
    var it=items[j];
    h+='<div class="bgListItem'+(_bgIdx===it.i?' active':'')+'" data-idx="'+it.i+'" title="'+esc(it.b.name)+'">'+esc(it.b.name)+'</div>';
  }
  document.getElementById('bgList').innerHTML=h;
  document.getElementById('bgCount').textContent=String(items.length);
  var list=document.querySelectorAll('#bgList .bgListItem');
  for(var k=0;k<list.length;k++){
    list[k].onclick=function(){selectBackground(parseInt(this.getAttribute('data-idx'),10)||0);};
  }
  return items;
}
function selectBackground(i){
  _bgIdx=i;
  renderBgList();
  renderBgPage();
  var el=document.querySelector('#bgList .bgListItem.active');
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'nearest',inline:'nearest'});
}
function stepBackground(delta){
  var items=_bgFiltered();
  if(!items.length)return;
  var pos=-1;
  for(var i=0;i<items.length;i++){if(items[i].i===_bgIdx){pos=i;break;}}
  if(pos<0)pos=0;
  var next=pos+delta;
  if(next<0)next=0;
  if(next>=items.length)next=items.length-1;
  selectBackground(items[next].i);
}
function renderBgPage(){
  var page=document.getElementById('bgPage');
  var items=_bgFiltered();
  var b=null,p={},pos=-1;
  for(var i=0;i<items.length;i++)if(items[i].i===_bgIdx){b=items[i].b;p=items[i].p||{};pos=i;break;}
  if(!b){page.innerHTML='<div class="empty">没有匹配的背景</div>';return;}
  var h='<div class="bgPageHead"><div><div class="bgPageTitle">'+esc(b.name||'')+'</div><div class="bgPageMeta">HP '+(b['生命值加成']||'+0')+' · '+(b['资金']||'无资金')+' · 第 '+(pos+1)+' / '+items.length+' 页</div></div>';
  h+='<div class="bgPageNav"><button '+(pos<=0?'disabled':'')+' onclick="stepBackground(-1)">← 上一个</button><button '+(pos>=items.length-1?'disabled':'')+' onclick="stepBackground(1)">下一个 →</button></div></div>';
  var warn=_bgWarnings(b,p);
  if(warn.length){h+='<div class="warn">'+warn.map(function(x){return esc(x);}).join('<br>')+'</div>';}
  h+='<div class="bgFields">';
  h+=_bgField('简介',p.desc||b.description||'');
  h+=_bgField('生命值加成',b['生命值加成']||'+0');
  h+=_bgField('基础熟练项',b['基础熟练项']||'无');
  h+=_bgField('专业熟练项',b['专业熟练项']||'无');
  h+=_bgField('其他',b['其他']||'无');
  h+=_bgField('资金',b['资金']||'无');
  h+=_bgField('装备','\n'+String(b['装备']||'').split('\n').filter(function(x){return x;}).map(function(x){return '· '+x;}).join('\n'));
  h+=_bgField('特性描述',b['特性描述']||'无');
  h+='</div>';
  h+=_bgOptions('特点选项',p.traits);
  h+=_bgOptions('理念选项',p.ideals);
  h+=_bgOptions('羁绊选项',p.bonds);
  h+=_bgOptions('缺陷选项',p.flaws);
  h+=_bgRichOptions('神祇选项（创建时选 1 项）',p.deity_details||p.deities,[['name','神祇'],['desc','简介']]);
  h+=_bgOptions('联系渠道选项',p.contacts);
  h+=_bgRichOptions('偏好骗局选项（创建时选 1 项）',p.scam_details||p.scam_types,[['name','骗局'],['gear','对应装备']]);
  h+=_bgOptions('任务渠道选项',p.mission_channels);
  h+=_bgRichOptions('学术领域选项（创建时选 1 项）',p.academic_details||p.academic_domains,[['name','学科'],['prof','熟练度加成'],['gear','额外装备']]);
  h+=_bgRichOptions('罪名选项（创建时选 1 项）',p.crime_details||p.crimes,[['name','罪名'],['contact','接头人']]);
  h+=_bgRichOptions('专职选项（创建时选 1 项）',p.military_roles||p.roles,[['name','职务'],['prof','熟练度加成'],['gear','额外装备']]);
  h+=_bgRichOptions('造访原因选项（创建时选 1 项）',p.foreign_origins||p.origins,[['name','身份'],['desc','介绍']]);
  h+=_bgOptions('隐居原因选项（创建时选 1 项）',p.seclusion_reasons);
  h+=_bgOptions('动物伙伴选项（创建时选 1 种）',p.companions);
  h+=_bgRichOptions('名望加成',p.fame_tiers&&p.fame_tiers.length&&p.fame_tiers[0]&&p.fame_tiers[0].level?p.fame_tiers:null,[['level','等级'],['bonus','魅力相关检定增益']]);
  page.innerHTML=h;
}
document.getElementById('bgQ').addEventListener('input',function(){renderBgList();renderBgPage();});
renderBgList();
renderBgPage();
</script>
</body>
</html>
