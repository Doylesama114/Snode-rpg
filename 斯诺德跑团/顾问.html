<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>斯诺德 · AI 顾问</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  background: #f6f4ef;
  color: #1f2522;
  overflow: hidden;
}
.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 720px;
  margin: 0 auto;
  background: #f6f4ef;
}
.hdr {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: #fffdf8;
  border-bottom: 1px solid #d8d2c4;
}
.hdr-btn {
  min-width: 44px;
  height: 44px;
  border: 1px solid #d8d2c4;
  background: #fff;
  border-radius: 10px;
  font-size: 22px;
  color: #69706b;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.hdr-btn:active { background: #f6f4ef; }
.hdr-title { flex: 1; min-width: 0; }
.hdr-title h1 { font-size: 17px; color: #1f2522; }
.hdr-title .sub { font-size: 12px; color: #69706b; margin-top: 1px; }
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #b9b3a7;
  margin-right: 5px;
  vertical-align: 1px;
}
.dot._ok { background: #4caf50; }
.dot._bad { background: #e53935; }
.msgs {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg { display: flex; flex-direction: column; max-width: 100%; }
.msg._user { align-items: flex-end; }
.msg._ai { align-items: flex-start; }
.bubble {
  max-width: 92%;
  padding: 11px 13px;
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.62;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg._user .bubble {
  background: #e9e4d8;
  border: 1px solid #d8d2c4;
  border-bottom-right-radius: 4px;
}
.msg._ai .bubble {
  background: #fffdf8;
  border: 1px solid #e8e4dc;
  border-bottom-left-radius: 4px;
}
.msg._err { align-items: stretch; }
.msg._err .bubble {
  background: #ffebee;
  border: 1px solid #ffcdd2;
  color: #c62828;
  font-size: 13px;
  max-width: 100%;
}
.refs {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed #d8d2c4;
  font-size: 12px;
  color: #69706b;
  line-height: 1.9;
}
.refs a { color: #a46d1f; text-decoration: underline; }
.refs span { color: #8a8a8a; }
.actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.actions button {
  min-height: 34px;
  padding: 4px 12px;
  border: 1px solid #d8d2c4;
  border-radius: 16px;
  background: transparent;
  color: #69706b;
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.actions button:disabled { opacity: 0.55; }
.chips {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 14px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex-shrink: 0;
  min-height: 40px;
  padding: 6px 14px;
  border: 1px solid #a46d1f;
  border-radius: 18px;
  background: #fffdf8;
  color: #a46d1f;
  font-size: 13px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chips button:active { background: #f6f4ef; }
.form {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: #fffdf8;
  border-top: 1px solid #d8d2c4;
}
.form textarea {
  flex: 1;
  min-height: 44px;
  max-height: 132px;
  border: 1px solid #d8d2c4;
  border-radius: 12px;
  padding: 11px 12px;
  font-size: 15px;
  font-family: inherit;
  line-height: 1.4;
  resize: none;
  outline: none;
  background: #fff;
  color: #1f2522;
}
.form textarea:focus { border-color: #a46d1f; }
.form .send {
  min-width: 64px;
  height: 44px;
  border: none;
  border-radius: 12px;
  background: #a46d1f;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.form .send:disabled { opacity: 0.55; }
.empty {
  margin: auto;
  text-align: center;
  color: #69706b;
  font-size: 14px;
  line-height: 1.8;
  padding: 24px;
}
.empty .big { font-size: 40px; display: block; margin-bottom: 8px; }
.typing::after {
  content: "";
  display: inline-block;
  width: 4px;
  height: 14px;
  margin-left: 2px;
  vertical-align: -2px;
  background: #a46d1f;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
html.dark body, html.dark .app { background: #1e2124; color: #e8e6e3; }
html.dark .hdr, html.dark .form { background: #24272b; border-color: #3a3d40; }
html.dark .hdr-btn { background: #2a2d31; border-color: #3a3d40; color: #cfcac2; }
html.dark .msg._user .bubble { background: #2f3337; border-color: #3a3d40; }
html.dark .msg._ai .bubble { background: #24272b; border-color: #3a3d40; }
html.dark .form textarea { background: #2a2d31; border-color: #3a3d40; color: #e8e6e3; }
html.dark .chips button { background: #24272b; }
html.dark .empty { color: #9aa0a6; }

/* ---------- 工会风格覆盖层（通用，CSS-only） ---------- */
body { background-color:#d0a97a !important;
  background-image: radial-gradient(1200px 460px at 50% -6%, rgba(255,240,205,.6), transparent 72%),
    repeating-linear-gradient(90deg, rgba(96,64,26,.055) 0 2px, transparent 2px 9px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 5px, transparent 5px 26px),
    repeating-linear-gradient(0deg, rgba(88,58,22,.09) 0 1px, transparent 1px 172px),
    linear-gradient(180deg, rgba(255,255,255,.22), rgba(120,80,30,.12)) !important;
  background-attachment: scroll !important; color:#2f2317 !important; min-height:100vh; }
h1 { font-family: Georgia, "Songti SC", "SimSun", serif !important; color:#3a2a13 !important;
  letter-spacing:.06em; text-shadow: 0 1px 0 rgba(255,246,224,.75); }
h2, h3 { color:#43301a !important; }
p, .subtitle, .lead, .hint { color:#5b411f !important; }
.card, .panel, .box, .section, .item {
  background: linear-gradient(180deg,#fdf8ec,#f3e9d4) !important;
  border: 1px solid #c9ab74 !important; border-radius: 7px !important;
  box-shadow: inset 0 2px 5px rgba(90,60,20,.22), 0 10px 22px rgba(50,30,8,.24) !important;
}
.card:hover, .item:hover { border-color:#a8802f !important; }
.btn, button.btn, .btn-primary, a.btn, .card-btn, .action, button {
  border:1px solid #6d5223 !important; border-radius:6px !important; color:#2a1c0a !important;
  background: linear-gradient(180deg,#e6c37c,#c39a4a 60%,#a8802f) !important;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 6px rgba(40,24,6,.3) !important;
  font-weight:700;
}
.btn:hover, button:hover, .card-btn:hover { filter: brightness(1.06); }
.btn.ghost, button.ghost, .btn.secondary { background: transparent !important; color:#5b411f !important;
  border-color: rgba(120,85,35,.45) !important; box-shadow:none !important; }
input, select, textarea {
  background: linear-gradient(180deg, rgba(120,85,35,.10), rgba(255,255,255,.55)) !important;
  border: 1px solid #c9ab74 !important; color:#2f2317 !important; border-radius:6px !important;
  box-shadow: inset 0 2px 5px rgba(90,60,20,.22) !important;
}
input:focus, select:focus, textarea:focus { outline:none !important; border-color:#a8802f !important;
  box-shadow: inset 0 1px 2px rgba(90,60,20,.2), 0 0 0 3px rgba(200,162,90,.3) !important; }
table { border-color:#c9ab74 !important; }
table th { background: linear-gradient(180deg,#e6c37c,#c39a4a 70%,#a8802f) !important; color:#2a1c0a !important;
  border-color:#6d5223 !important; font-weight:800 !important; }
table td { border-color: rgba(120,85,35,.22) !important; color:#43301a !important; }
table tbody tr:nth-child(even) { background: rgba(120,85,35,.07) !important; }
table tbody tr:hover { background: rgba(200,162,90,.2) !important; }
.chip, .tag, .badge, .pill { background: linear-gradient(180deg,#f6ecd3,#eadfc0) !important;
  border:1px solid #c9ab74 !important; color:#5b411f !important; border-radius:4px !important; }
a { color:#7a4a12; }
a:hover { color:#a8802f; }
html.dark body { background-color:#2a2018 !important;
  background-image: radial-gradient(1000px 400px at 50% -6%, rgba(120,90,50,.35), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 2px, transparent 2px 9px),
    linear-gradient(180deg, rgba(255,225,180,.06), rgba(0,0,0,.35)) !important; color:#e8dcc4 !important; }
html.dark h1, html.dark h2, html.dark h3 { color:#f0e6d2 !important; }
html.dark .card, html.dark .panel, html.dark .box, html.dark .section, html.dark .item {
  background: linear-gradient(180deg,#453d2f,#3a3327) !important; border-color:#5a4a35 !important; color:#e8e0cc !important; }
html.dark table td { color:#e8e0cc !important; border-color: rgba(220,190,140,.18) !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <button class="hdr-btn" id="backBtn" aria-label="返回">‹</button>
    <div class="hdr-title">
      <h1><span class="dot" id="statusDot"></span>AI 顾问</h1>
      <div class="sub" id="statusText">连接中…</div>
    </div>
    <button class="hdr-btn" id="clearBtn" aria-label="新对话" title="新对话">＋</button>
  </header>
  <main class="msgs" id="msgs"></main>
  <div class="chips" id="chips"></div>
  <form class="form" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="问问角色培养、技能、进阶……"></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
</div>
<script>window.SNODE_ADVISOR_API = window.SNODE_ADVISOR_API || "__ADVISOR_API_BASE__";</script>
<script src="ui_dialog.js"></script>
<script src="advisor-chat.js"></script>
<script>window.__guiBeam="AI 顾问";; window.__guiSkin = true;</script>
<script src="guild-ui.js"></script>
<script src="advisor-offline-guide.js"></script>
</body>
</html>
