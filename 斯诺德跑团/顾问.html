<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f4ef">
<title>斯诺德 · AI 顾问</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  background: #f6f4ef;
  color: #1f2522;
  overflow: hidden;
}
.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 720px;
  margin: 0 auto;
  background: #f6f4ef;
}
.hdr {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
  background: #fffdf8;
  border-bottom: 1px solid #d8d2c4;
}
.hdr-btn {
  min-width: 44px;
  height: 44px;
  border: 1px solid #d8d2c4;
  background: #fff;
  border-radius: 10px;
  font-size: 22px;
  color: #69706b;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.hdr-btn:active { background: #f6f4ef; }
.hdr-title { flex: 1; min-width: 0; }
.hdr-title h1 { font-size: 17px; color: #1f2522; }
.hdr-title .sub { font-size: 12px; color: #69706b; margin-top: 1px; }
.dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #b9b3a7;
  margin-right: 5px;
  vertical-align: 1px;
}
.dot._ok { background: #4caf50; }
.dot._bad { background: #e53935; }
.msgs {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg { display: flex; flex-direction: column; max-width: 100%; }
.msg._user { align-items: flex-end; }
.msg._ai { align-items: flex-start; }
.bubble {
  max-width: 92%;
  padding: 11px 13px;
  border-radius: 12px;
  font-size: 15px;
  line-height: 1.62;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg._user .bubble {
  background: #e9e4d8;
  border: 1px solid #d8d2c4;
  border-bottom-right-radius: 4px;
}
.msg._ai .bubble {
  background: #fffdf8;
  border: 1px solid #e8e4dc;
  border-bottom-left-radius: 4px;
}
.msg._err { align-items: stretch; }
.msg._err .bubble {
  background: #ffebee;
  border: 1px solid #ffcdd2;
  color: #c62828;
  font-size: 13px;
  max-width: 100%;
}
.refs {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed #d8d2c4;
  font-size: 12px;
  color: #69706b;
  line-height: 1.9;
}
.refs a { color: #a46d1f; text-decoration: underline; }
.refs span { color: #8a8a8a; }
.actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.actions button {
  min-height: 34px;
  padding: 4px 12px;
  border: 1px solid #d8d2c4;
  border-radius: 16px;
  background: transparent;
  color: #69706b;
  font-size: 12px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.actions button:disabled { opacity: 0.55; }
.chips {
  flex-shrink: 0;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 10px 14px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chips button {
  flex-shrink: 0;
  min-height: 40px;
  padding: 6px 14px;
  border: 1px solid #a46d1f;
  border-radius: 18px;
  background: #fffdf8;
  color: #a46d1f;
  font-size: 13px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.chips button:active { background: #f6f4ef; }
.form {
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  background: #fffdf8;
  border-top: 1px solid #d8d2c4;
}
.form textarea {
  flex: 1;
  min-height: 44px;
  max-height: 132px;
  border: 1px solid #d8d2c4;
  border-radius: 12px;
  padding: 11px 12px;
  font-size: 15px;
  font-family: inherit;
  line-height: 1.4;
  resize: none;
  outline: none;
  background: #fff;
  color: #1f2522;
}
.form textarea:focus { border-color: #a46d1f; }
.form .send {
  min-width: 64px;
  height: 44px;
  border: none;
  border-radius: 12px;
  background: #a46d1f;
  color: #fff;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.form .send:disabled { opacity: 0.55; }
.empty {
  margin: auto;
  text-align: center;
  color: #69706b;
  font-size: 14px;
  line-height: 1.8;
  padding: 24px;
}
.empty .big { font-size: 40px; display: block; margin-bottom: 8px; }
.typing::after {
  content: "";
  display: inline-block;
  width: 4px;
  height: 14px;
  margin-left: 2px;
  vertical-align: -2px;
  background: #a46d1f;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
html.dark body, html.dark .app { background: #1e2124; color: #e8e6e3; }
html.dark .hdr, html.dark .form { background: #24272b; border-color: #3a3d40; }
html.dark .hdr-btn { background: #2a2d31; border-color: #3a3d40; color: #cfcac2; }
html.dark .msg._user .bubble { background: #2f3337; border-color: #3a3d40; }
html.dark .msg._ai .bubble { background: #24272b; border-color: #3a3d40; }
html.dark .form textarea { background: #2a2d31; border-color: #3a3d40; color: #e8e6e3; }
html.dark .chips button { background: #24272b; }
html.dark .empty { color: #9aa0a6; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <button class="hdr-btn" id="backBtn" aria-label="返回">‹</button>
    <div class="hdr-title">
      <h1><span class="dot" id="statusDot"></span>AI 顾问</h1>
      <div class="sub" id="statusText">连接中…</div>
    </div>
    <button class="hdr-btn" id="clearBtn" aria-label="新对话" title="新对话">＋</button>
  </header>
  <main class="msgs" id="msgs"></main>
  <div class="chips" id="chips"></div>
  <form class="form" id="form" autocomplete="off">
    <textarea id="input" rows="1" placeholder="问问角色培养、技能、进阶……"></textarea>
    <button class="send" id="send" type="submit">发送</button>
  </form>
</div>
<script>window.SNODE_ADVISOR_API = window.SNODE_ADVISOR_API || "__ADVISOR_API_BASE__";</script>
<script src="advisor-chat.js"></script>
</body>
</html>
