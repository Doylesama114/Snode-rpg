<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>斯诺德 · 冒险者工具集</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  background: #f6f4ef;
  color: #1f2522;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
}
.container { max-width: 460px; width: 100%; animation: fadeInUp 0.45s ease-out both; }
h1 {
  font-size: 28px;
  color: #1f2522;
  font-weight: bold;
  text-align: center;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 14px;
  color: #69706b;
  text-align: center;
  margin-bottom: 32px;
}
.card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 12px;
  padding: 24px 28px;
  margin-bottom: 14px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 18px;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
  text-decoration: none;
  color: inherit;
  animation: fadeInUp 0.4s ease-out both;
}
.card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.icon {
  font-size: 36px;
  width: 58px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f6f4ef;
  border-radius: 10px;
  flex-shrink: 0;
  border: 1px solid #d8d2c4;
}
.card-text h2 {
  font-size: 19px;
  color: #1f2522;
  margin-bottom: 4px;
}
.card-text p {
  font-size: 13px;
  color: #69706b;
  line-height: 1.5;
}
.footer {
  margin-top: 36px;
  font-size: 12px;
  color: #69706b;
  text-align: center;
}
#themeToggle{position:fixed;top:16px;right:16px;z-index:999;background:transparent;border:1px solid #d8d2c4;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;transition:all 0.2s}
#themeToggle:hover{background:#f6f4ef;border-color:#a46d1f}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: none; }
}
.card:nth-child(2) { animation-delay: 0.05s; }
.card:nth-child(3) { animation-delay: 0.10s; }
@media (prefers-color-scheme:dark) { body{background:#1a1d20;color:#e8e6e3} h1{color:#e8e6e3} .subtitle{color:#9d9b98} .card{background:#24272b;border-color:#3a3d40;box-shadow:0 4px 12px rgba(0,0,0,.2)} .card:hover{background:#1a1d20;border-color:#d4a54a;box-shadow:0 6px 20px rgba(0,0,0,.3)} .icon{background:#1a1d20;border-color:#3a3d40} .card-text h2{color:#e8e6e3} .card-text p{color:#9d9b98} .footer{color:#9d9b98} }
html.dark body{background:#1a1d20;color:#e8e6e3}html.dark h1{color:#e8e6e3}html.dark .subtitle{color:#9d9b98}html.dark .card{background:#24272b;border-color:#3a3d40;box-shadow:0 4px 12px rgba(0,0,0,.2)}html.dark .card:hover{background:#1a1d20;border-color:#d4a54a;box-shadow:0 6px 20px rgba(0,0,0,.3)}html.dark .icon{background:#1a1d20;border-color:#3a3d40}html.dark .card-text h2{color:#e8e6e3}html.dark .card-text p{color:#9d9b98}html.dark .footer{color:#9d9b98}html.dark #themeToggle{border-color:#3a3d40;color:#e8e6e3}html.dark #themeToggle:hover{background:#24272b;border-color:#d4a54a}
@media (max-width:860px) {
  body { padding: 20px; }
}
@media (max-width:600px) {
  body { padding: 16px; }
  h1 { font-size: 24px; }
  .card { padding: 18px 20px; gap: 14px; }
  .icon { width: 50px; height: 50px; font-size: 30px; }
  .card-text h2 { font-size: 17px; }
}
@media (max-width:480px) {
  body { padding: 12px; }
  h1 { font-size: 22px; }
  .subtitle { font-size: 12px; }
  .card { padding: 14px 16px; }
  .card-text h2 { font-size: 16px; }
  .card-text p { font-size: 12px; }
}
</style>
</head>
<body>
<button id="themeToggle">☀️</button>
<button id="muteToggle" onclick="snd.toggle();this.textContent=snd.muted?'🔇':'🔊'" style="position:fixed;top:62px;right:16px;z-index:999;background:transparent;border:1px solid #d8d2c4;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;transition:all 0.2s">🔊</button>
<button id="shortcutBtn" onclick="showShortcutHelp()" style="position:fixed;top:108px;right:16px;z-index:999;background:transparent;border:1px solid #d8d2c4;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;transition:all 0.2s" title="快捷键">⌨️</button>
<div class="container">
  <h1>⚔ 斯诺德</h1>
  <div class="subtitle">冒险者工具集</div>

  <a class="card" href="主页.html">
    <div class="icon">📜</div>
    <div class="card-text">
      <h2>角色系统</h2>
      <p>创建、管理你的冒险者角色，查看角色面板与装备</p>
    </div>
  </a>

  <a class="card" href="../职业页/首页.html">
    <div class="icon">📖</div>
    <div class="card-text">
      <h2>职业技能</h2>
      <p>浏览各职业的天赋树、技能详情与进阶途径</p>
    </div>
  </a>

  <a class="card" href="#" onclick="openPokerGame(event)">
    <div class="icon">🃏</div>
    <div class="card-text">
      <h2>斯诺德对决</h2>
      <p>回合制策略对战 · 支持联网对战</p>
    </div>
  </a>

  <a class="card" href="帮助.html">
    <div class="icon">❓</div>
    <div class="card-text">
      <h2>帮助</h2>
      <p>查看使用指南、规则说明与常见问题</p>
    </div>
  </a>

  <div class="footer">
    斯诺德规则 · 冒险者工具集
    <div style="margin-top:8px;display:flex;align-items:center;justify-content:center;gap:12px">
      <span style="color:#a46d1f;font-size:13px;font-weight:bold" id="versionDisplay">v1.0.6102</span>
      <button onclick="checkUpdate()" id="updateBtn" style="color:#69706b;font-size:12px;padding:4px 10px;border:1px solid #d8d2c4;border-radius:4px;background:transparent;cursor:pointer">检查更新</button>
      <button onclick="showChangelog(false)" style="color:#69706b;font-size:12px;padding:4px 10px;border:1px solid #d8d2c4;border-radius:4px;background:transparent;cursor:pointer">📋 更新日志</button>
      <button onclick="mirrorDownload()" id="mirrorBtn" style="color:#69706b;font-size:12px;padding:4px 10px;border:1px solid #d8d2c4;border-radius:4px;background:transparent;cursor:pointer">⬇️ 镜像下载</button>
    </div>
    <div id="updateMsg" style="margin-top:6px;font-size:12px"></div>
  </div>
  </div>
</div>
<script src="bug-report.js"></script>
<script src="changelog.js"></script>
<script>
// 版本号
var APP_VERSION = '1.0.6102';
document.getElementById('versionDisplay').textContent = 'v' + APP_VERSION;

/** 斯诺德对决入口：Electron/镜像包用 ../poker-game，仓库开发用 ../electron-app/poker-game */
function pokerGameHref() {
  if (window.electronAPI) return '../poker-game/index.html#/';
  var path = decodeURIComponent(location.pathname.replace(/\\/g, '/'));
  if (path.indexOf('/electron-app/') !== -1) return '../poker-game/index.html#/';
  return '../electron-app/poker-game/index.html#/';
}
function openPokerGame(e) {
  e.preventDefault();
  location.href = pokerGameHref();
}

// 首次看到新版本时自动弹出更新日志
(function(){
  var seen = localStorage.getItem('_snowd_changelog_seen');
  if (seen !== APP_VERSION) {
    setTimeout(function() { showChangelog(true); }, 1000);
    localStorage.setItem('_snowd_changelog_seen', APP_VERSION);
  }
})();

// 更新检查
function checkUpdate() {
  // Electron 模式：通过 IPC 触发 autoUpdater
  if (window.electronAPI) {
    var btn = document.getElementById('updateBtn');
    var msg = document.getElementById('updateMsg');
    btn.textContent = '检查中...'; btn.disabled = true;
    msg.style.color = '#a46d1f'; msg.textContent = '正在检查更新...';
    window.electronAPI.checkUpdate();
    setTimeout(function() { btn.textContent = '检查更新'; btn.disabled = false; }, 5000);
    return;
  }

  // Web 模式：通过 GitHub API 检查
  var btn = document.getElementById('updateBtn');
  var msg = document.getElementById('updateMsg');
  btn.textContent = '检查中...'; btn.disabled = true;
  msg.style.color = '#69706b'; msg.textContent = '';

  fetch('https://api.github.com/repos/Doylesama114/Snode-rpg/releases/latest')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var latest = (data.tag_name || '').replace('v', '');
      btn.textContent = '检查更新'; btn.disabled = false;
      if (!latest) { msg.style.color='#c62828'; msg.textContent='无法获取更新信息'; return; }
      if (compareVersions(latest, APP_VERSION) > 0) {
        msg.style.color='#2e7d32';
        msg.innerHTML='发现新版本 v'+latest+'！<a href="'+data.html_url+'" target="_blank">前往下载</a>';
      } else { msg.style.color='#69706b'; msg.textContent='已是最新版本 v'+APP_VERSION; }
    })
    .catch(function() {
      btn.textContent = '检查更新'; btn.disabled = false;
      msg.style.color='#c62828'; msg.textContent='网络连接失败';
    });
}

// 镜像下载/更新
function mirrorDownload() {
  var msg = document.getElementById('updateMsg');
  // Electron 模式：走自动更新
  if (window.electronAPI) {
    msg.style.color = '#a46d1f'; msg.textContent = '正在获取最新版本...';
    window.electronAPI.checkUpdateGitee();
    return;
  }
  // Web 模式：直接下载 exe
  var btn = document.getElementById('mirrorBtn');
  var origText = btn.textContent;
  btn.textContent = '获取中...'; btn.disabled = true;

  fetch('https://api.github.com/repos/Doylesama114/Snode-rpg/releases/latest')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var exe = null;
      for (var i = 0; i < (data.assets || []).length; i++) {
        if (/\.exe$/.test(data.assets[i].name)) { exe = data.assets[i]; break; }
      }
      btn.textContent = origText; btn.disabled = false;
      if (exe) {
        msg.style.color='#2e7d32'; msg.textContent='正在下载 v'+ (data.tag_name||'').replace('v','') + '...';
        window.open(exe.browser_download_url, '_blank');
      } else {
        msg.style.color='#c62828'; msg.textContent='未找到安装包';
      }
    })
    .catch(function() {
      btn.textContent = origText; btn.disabled = false;
      msg.style.color='#c62828'; msg.textContent='网络连接失败，请稍后重试';
    });
}

function compareVersions(a, b) {
  var pa = a.split('.'), pb = b.split('.');
  for (var i = 0; i < Math.max(pa.length, pb.length); i++) {
    var na = parseInt(pa[i]) || 0, nb = parseInt(pb[i]) || 0;
    if (na > nb) return 1;
    if (na < nb) return -1;
  }
  return 0;
}

// Electron autoUpdater 事件监听
if (typeof require !== 'undefined') {
  try { var { ipcRenderer } = require('electron');
    ipcRenderer.on('update-status', function(event, data) { showUpdateMsg(data); });
  } catch(e) {}
}

// 监听 Electron IPC 更新状态
if (window.electronAPI) {
  window.electronAPI.onUpdateStatus(function(data) { showUpdateMsg(data); });
}

function showUpdateMsg(data) {
  var msg = document.getElementById('updateMsg');
  if (!msg) return;
  if (data.status === 'checking') { msg.style.color='#a46d1f'; msg.textContent='正在检查更新...'; }
  else if (data.status === 'downloading') { msg.style.color='#a46d1f'; msg.textContent='正在下载更新 v'+(data.version||'')+'...'; }
  else if (data.status === 'downloaded') { msg.style.color='#2e7d32'; msg.innerHTML='更新已就绪，<b>即将自动重启</b>...'; }
  else if (data.status === 'uptodate') { msg.style.color='#69706b'; msg.textContent='已是最新版本 v'+APP_VERSION; }
  else if (data.status === 'error') { msg.style.color='#c62828'; msg.textContent=(data.message||'更新检查失败'); }
}

// 自动检查更新（Web 模式 — Electron 由主进程 autoUpdater 处理）
(function(){
  if (window.electronAPI) return; // Electron 模式由主进程接管
  // 启动时检查（延迟2秒）
  setTimeout(checkUpdate, 2000);
  // 定时检查（每4小时）
  setInterval(checkUpdate, 4 * 60 * 60 * 1000);
})();
</script>
<script>
(function(){
  var t=document.getElementById('themeToggle'),h=document.documentElement;
  function apply(d){h.classList.toggle('dark',d);t.textContent=d?'🌙':'☀️';}
  var s=localStorage.getItem('_snowd_theme');
  if(s!==null)apply(s==='dark');
  else apply(window.matchMedia('(prefers-color-scheme:dark)').matches);
  t.onclick=function(){var d=!h.classList.contains('dark');apply(d);localStorage.setItem('_snowd_theme',d?'dark':'light');if(window.snd)snd.play('toggle');};
})();
</script>
<script src="snd.js"></script>
<script src="shortcuts.js"></script>
</body>
</html>
