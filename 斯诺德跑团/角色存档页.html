<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色存档</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  background: #f6f4ef;
  color: #1f2522;
  min-height: 100vh;
  padding: 30px;
  font-size: 15px;
}
.container {
  max-width: 520px;
  margin: 0 auto;
}
h1 {
  font-size: 26px;
  color: #1f2522;
  font-weight: bold;
  margin-bottom: 6px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d8d2c4;
}
.subtitle {
  font-size: 14px;
  color: #69706b;
  margin-bottom: 24px;
}
.card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px 24px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.icon {
  font-size: 32px;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f6f4ef;
  border-radius: 8px;
  flex-shrink: 0;
  border: 1px solid #d8d2c4;
}
.card-text h2 {
  font-size: 18px;
  color: #1f2522;
  margin-bottom: 3px;
}
.card-text p {
  font-size: 13px;
  color: #69706b;
}
.back-link {
  display: inline-block;
  color: #69706b;
  font-size: 14px;
  text-decoration: none;
  margin-bottom: 20px;
  cursor: pointer;
}
.back-link:hover { color: #a46d1f; }
/* Char list page specific */
.char-card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.char-card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.char-name {
  font-size: 20px;
  font-weight: bold;
  color: #1f2522;
  margin-bottom: 6px;
}
.char-info {
  font-size: 13px;
  color: #69706b;
  line-height: 1.6;
}
.empty-msg {
  text-align: center;
  padding: 60px 20px;
  color: #69706b;
  font-size: 15px;
}
/* Slot page specific */
.slot-card {
  background: #fffdf8;
  border: 1px solid #d8d2c4;
  border-radius: 10px;
  padding: 20px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(31,37,34,0.04);
}
.slot-card:hover {
  background: #f6f4ef;
  border-color: #a46d1f;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(31,37,34,0.08);
}
.slot-card.empty {
  opacity: 0.5;
  border-style: dashed;
}
.slot-card.empty:hover {
  opacity: 0.8;
}
.slot-title {
  font-size: 16px;
  font-weight: bold;
  color: #1f2522;
  margin-bottom: 4px;
}
.slot-time {
  font-size: 12px;
  color: #69706b;
  margin-bottom: 6px;
}
.slot-summary {
  font-size: 13px;
  color: #69706b;
}
.slot-empty-text {
  font-size: 13px;
  color: #69706b;
  font-style: italic;
}
.char-subtitle {
  font-size: 14px;
  color: #69706b;
  margin-bottom: 20px;
}
.footer {
  margin-top: 30px;
  font-size: 12px;
  color: #69706b;
  text-align: center;
}
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="角色选择页.html">← 返回角色列表</a>
  <h1>📂 选择存档</h1>
  <div class="char-subtitle" id="charNameDisplay"></div>
  <div id="slotList"></div>
</div>

<script>
function getCharName() {
  var params = new URLSearchParams(window.location.search);
  return params.get("char") || "";
}

function getSlotSummary(data) {
  var cls = "";
  if (data.classes) {
    for (var ci = 0; ci < data.classes.length; ci++) {
      var c = data.classes[ci];
      if (c && c.name && c.level > 0) {
        cls += (cls ? " / " : "") + c.name + " " + c.level + "级";
      }
    }
  }
  var hp = data.hp || "?";
  var fp = data.fp || "?";
  return cls + " | HP: " + hp + " FP: " + fp;
}

function renderSlots() {
  var charName = getCharName();
  document.getElementById("charNameDisplay").textContent = charName;

  var html = "";
  for (var si = 1; si <= 3; si++) {
    var key = "char_" + charName + "_slot" + si;
    var raw = localStorage.getItem(key);
    var isEmpty = !raw;
    var savedAt = "";
    var summary = "";

    if (!isEmpty) {
      try {
        var data = JSON.parse(raw);
        savedAt = data._savedAt ? new Date(data._savedAt).toLocaleString() : "未知";
        summary = getSlotSummary(data);
      } catch(e) {
        savedAt = "存档损坏";
        summary = "";
      }
    }

    var cls = "slot-card" + (isEmpty ? " empty" : "");
    html += "<div class='" + cls + "' onclick='openSlot(" + si + ")'>";
    html += "<div class='slot-title'>存档位 " + si + "</div>";
    if (isEmpty) {
      html += "<div class='slot-empty-text'>空存档位</div>";
    } else {
      html += "<div class='slot-time'>" + savedAt + "</div>";
      html += "<div class='slot-summary'>" + summary + "</div>";
    }
    html += "</div>";
  }
  document.getElementById("slotList").innerHTML = html;
}

function openSlot(slotIndex) {
  var charName = getCharName();
  if (!charName) {
    alert("未指定角色");
    return;
  }
  // Check if slot has data
  var key = "char_" + charName + "_slot" + slotIndex;
  var raw = localStorage.getItem(key);
  if (!raw) {
    alert("该存档位为空，请先在角色面板中保存角色到此位置");
    return;
  }
  // Navigate to character panel with char and slot params
  window.location.href = "角色面板.html?char=" + encodeURIComponent(charName) + "&slot=" + slotIndex;
}

renderSlots();
</script>
<script src="/bug-report.js"></script>
</body>
</html>
