<text x="105" y="467" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">来源职业、阶位、风格</text>
<rect x="80" y="546" width="308" height="130" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
