<rect x="584" y="588" width="132" height="42" rx="8" fill="#ffffff" stroke="#dac9a8" stroke-width="2"/>
<text x="650" y="617" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#a77b37" text-anchor="middle">获取来源</text>
<rect x="730" y="588" width="132" height="42" rx="8" fill="#ffffff" stroke="#dac9a8" stroke-width="2"/>
<text x="796" y="617" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#a77b37" text-anchor="middle">成长等级</text>
<rect x="876" y="588" width="132" height="42" rx="8" fill="#ffffff" stroke="#dac9a8" stroke-width="2"/>
<text x="942" y="617" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#a77b37" text-anchor="middle">关键属性</text>
<rect x="1022" y="588" width="132" height="42" rx="8" fill="#ffffff" stroke="#dac9a8" stroke-width="2"/>
<text x="1088" y="617" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#a77b37" text-anchor="middle">是否占栏</text>
<text x="584" y="665" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">按获取规则确定，不只按技能名或摆放位置绑定。</text>
<text x="56" y="779" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#597080" text-anchor="start">角色 B、角色 C ……共用同样资料，各自保留选择、技能和当前状态。</text>
</svg>