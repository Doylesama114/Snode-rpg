<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8298a8"/></marker></defs>
<rect width="1280" height="830" rx="24" fill="#f6f9fb"/>
<text x="56" y="57" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#21746e" text-anchor="start">02</text>
<text x="112" y="58" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" fill="#183042" text-anchor="start">数据结构：共用资料与个人记录分开</text>
<text x="56" y="104" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#597080" text-anchor="start">新增角色增加记录；新增职业、阶位或领域扩展定义和规则。</text>
<rect x="56" y="150" width="356" height="568" rx="18" fill="#eff8f5" stroke="#a3c9bd" stroke-width="2"/>
<text x="80" y="194" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#21746e" text-anchor="start">人人共用的资料</text>
