<rect x="582" y="399" width="5" height="31" rx="2" fill="#376b95"/>
<text x="602" y="422" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">选择与成长</text>
<text x="585" y="459" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">选择依据、已领取收益</text>
<rect x="894" y="376" width="306" height="120" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="916" y="399" width="5" height="31" rx="2" fill="#376b95"/>
<text x="936" y="422" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">当前资源与状态</text>
<text x="919" y="459" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">生命、疲劳、来源池余额</text>
