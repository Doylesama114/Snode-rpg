<rect x="56" y="638" width="1168" height="100" rx="12" fill="#fffaf0" stroke="#d7c49e" stroke-width="2"/>
<text x="80" y="680" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#a77b37" text-anchor="start">关键冲突未处理时保留 R1，不能出现一半角色用新规则、一半用旧规则。</text>
<text x="80" y="718" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#597080" text-anchor="start">已开始的战斗固定其原版本；无关旧疑点按影响范围处理。</text>
