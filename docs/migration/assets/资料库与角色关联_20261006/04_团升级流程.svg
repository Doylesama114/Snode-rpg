<rect x="474" y="178" width="5" height="31" rx="2" fill="#376b95"/>
<text x="494" y="201" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#376b95" text-anchor="start">2</text>
<text x="529" y="201" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">影响预览</text>
<text x="477" y="238" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">扫描本团角色与装备</text>
<text x="477" y="269" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">显示数值变化与待决项</text>
