<rect x="474" y="445" width="5" height="31" rx="2" fill="#21746e"/>
<text x="494" y="468" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#21746e" text-anchor="start">5</text>
<text x="529" y="468" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">统一提交</text>
<text x="477" y="505" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">团与角色一起切到 R2</text>
<text x="477" y="536" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">快照、审计、防重记录</text>
<rect x="848" y="422" width="352" height="162" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="870" y="445" width="5" height="31" rx="2" fill="#376b95"/>
<text x="890" y="468" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#376b95" text-anchor="start">6</text>
<text x="925" y="468" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">按新版使用</text>
<text x="873" y="505" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">派生结果按 R2 计算</text>
<text x="873" y="536" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">历史事实仍可追溯</text>
