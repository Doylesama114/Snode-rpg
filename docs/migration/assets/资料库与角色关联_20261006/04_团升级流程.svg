<rect x="78" y="445" width="5" height="31" rx="2" fill="#376b95"/>
<text x="98" y="468" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#376b95" text-anchor="start">4</text>
<text x="133" y="468" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">复核当前状态</text>
<text x="81" y="505" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">检查角色与资产修订</text>
<text x="81" y="536" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">有变动就重新计算</text>
