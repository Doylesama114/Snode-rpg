<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8298a8"/></marker></defs>
<rect width="1280" height="830" rx="24" fill="#f6f9fb"/>
<text x="56" y="57" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#21746e" text-anchor="start">03</text>
<text x="112" y="58" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="33" font-weight="700" fill="#183042" text-anchor="start">操作流程：正式保存与旧档导入</text>
<text x="56" y="104" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="400" fill="#597080" text-anchor="start">保留用户输入，预览变化；一次业务提交不会重复扣费或发收益。</text>
<rect x="56" y="145" width="1168" height="248" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<text x="80" y="190" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#376b95" text-anchor="start">A  正式保存</text>
<rect x="80" y="219" width="280" height="147" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="102" y="242" width="5" height="31" rx="2" fill="#376b95"/>
<text x="122" y="265" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">编辑输入</text>
<text x="105" y="302" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">先在本机保留草稿</text>
<rect x="500" y="219" width="280" height="147" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="522" y="242" width="5" height="31" rx="2" fill="#376b95"/>
<text x="542" y="265" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">预览与检查</text>
<text x="525" y="302" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">显示费用、收益和问题</text>
<rect x="920" y="219" width="280" height="147" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="942" y="242" width="5" height="31" rx="2" fill="#376b95"/>
<text x="962" y="265" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">正式提交</text>
<text x="945" y="302" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">角色、历史、相关资产</text>
<text x="945" y="333" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">一起成功或一起回滚</text>
<path d="M368 289 L489 289" fill="none" stroke="#8298a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M788 289 L909 289" fill="none" stroke="#8298a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="56" y="430" width="1168" height="302" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<text x="80" y="475" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="27" font-weight="700" fill="#21746e" text-anchor="start">B  导入旧档</text>
<rect x="80" y="505" width="232" height="120" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="102" y="528" width="5" height="31" rx="2" fill="#21746e"/>
<text x="122" y="551" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">选择对象</text>
<text x="105" y="588" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">文件 / 表 / 角色</text>
<rect x="374" y="505" width="232" height="120" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="396" y="528" width="5" height="31" rx="2" fill="#21746e"/>
<text x="416" y="551" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">预览差异</text>
<text x="399" y="588" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">检查来源与差异</text>
<rect x="668" y="505" width="232" height="120" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="690" y="528" width="5" height="31" rx="2" fill="#21746e"/>
<text x="710" y="551" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">待核对保存</text>
<text x="693" y="588" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">原文 / 数值 / 编号</text>
<rect x="962" y="505" width="232" height="120" rx="18" fill="#ffffff" stroke="#c7d5df" stroke-width="2"/>
<rect x="984" y="528" width="5" height="31" rx="2" fill="#21746e"/>
<text x="1004" y="551" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" font-weight="700" fill="#183042" text-anchor="start">补选或确认</text>
<text x="987" y="588" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" font-weight="400" fill="#597080" text-anchor="start">补来源，不重领</text>
<path d="M318 564 L367 564" fill="none" stroke="#8298a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M612 564 L661 564" fill="none" stroke="#8298a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M906 564 L955 564" fill="none" stroke="#8298a8" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="80" y="674" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#597080" text-anchor="start">未知技能来源：保留待核对，只限制依赖它的自动操作。</text>
<text x="80" y="711" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#597080" text-anchor="start">历史金币与物品：先记录声明，入团后由 DM 批准入账。</text>
<text x="56" y="790" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#597080" text-anchor="start">网络超时或重复点击，应核实原提交结果；不另发一份起始收益或资产。</text>
</svg>